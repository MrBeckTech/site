<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engine Bay</title>
<meta name="tw-titlecard" content="PE3201 · SMALL ENGINES|ENGINE BAY|OPEN THE HOOD.">
<meta name="tw-canvas" content="off">
<style>
/* Engine Bay styles. Every colour reads the Twilight token first, with the style guide's hex as fallback. */
:root {
  --eb-night: var(--bg, #1b1030); --eb-panel: var(--tw-panel, #160d2b); --eb-rim: var(--tw-rim, #8a6fd0);
  --eb-ink: var(--ink, #f6efff); --eb-ink2: var(--ink2, #c3b2e6); --eb-gold: var(--tw-gold, #ffd23f);
  --eb-mint: var(--tw-mint, #5df2a4); --eb-sky: var(--tw-sky, #6ad3ff); --eb-coral: var(--tw-coral, #ff5d73);
  --eb-warm: var(--warm, #ff9a4d); --eb-amber: #ffb347; --eb-lav: #b388ff; --eb-btn: #4a2f86;
  --eb-window: var(--tw-win, linear-gradient(180deg, #3b2468, #2a1850 55%, #1f1240));
  --sys-ignition: var(--eb-gold); --sys-fuel: var(--eb-sky); --sys-valve: var(--eb-warm); --sys-compression: var(--eb-coral);
  --sys-lubrication: var(--eb-mint); --sys-cooling: var(--eb-lav); --sys-mechanical: var(--eb-ink2);
}
* { box-sizing: border-box; }
body { font-size: 17px; line-height: 1.5; }
.px { font-family: 'Press Start 2P', monospace; letter-spacing: .5px; }
.vt { font-family: 'VT323', monospace; }

/* top bar */
.eb-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 16px; background: var(--eb-panel); border-bottom: 4px solid #000; position: sticky; top: 0; z-index: 10; }
.eb-top h1 { margin: 0; font-size: 15px; color: var(--eb-gold); }
.eb-top .kicker { font-size: 9px; color: var(--eb-amber); display: block; margin-bottom: 4px; }
.eb-who { color: var(--eb-ink2); font-size: 15px; }
.eb-spacer { flex: 1; }
.eb-save { font-size: 14px; color: var(--eb-ink2); }
.eb-save.dirty { color: var(--eb-coral); font-weight: 700; }

/* tabs */
.eb-tabs { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 16px 0; max-width: 1180px; margin: 0 auto; }
.eb-tab { font-family: 'VT323', monospace; font-size: 22px; background: none; border: none; color: var(--eb-ink2); padding: 4px 10px; cursor: pointer; }
.eb-tab:hover { color: var(--eb-ink); }
.eb-tab.on { color: var(--eb-gold); }
.eb-tab.on::before { content: '▶ '; }

main.eb-main { max-width: 1180px; margin: 0 auto; padding: 16px 16px 80px; }

/* window */
.win { background: var(--eb-window); border: 4px solid #000; box-shadow: inset 0 0 0 3px var(--eb-rim), 5px 5px 0 #000; border-radius: 6px; padding: 20px 22px; margin-bottom: 18px; }
.win h2, .win h3 { margin-top: 0; }
.label { font-family: 'Press Start 2P', monospace; font-size: 10px; color: var(--eb-mint); text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 8px; }
.screen { background: var(--eb-panel); border: 3px solid #000; border-radius: 4px; padding: 14px 16px; }
.callout { background: var(--eb-panel); border-left: 6px solid var(--eb-sky); border-radius: 4px; padding: 12px 16px; margin: 10px 0; }
.callout.good { border-left-color: var(--eb-mint); } .callout.bad { border-left-color: var(--eb-coral); } .callout.warm { border-left-color: var(--eb-warm); }
.muted { color: var(--eb-ink2); }

/* buttons */
.btn { font: inherit; font-size: 16px; cursor: pointer; color: var(--eb-ink); background: var(--eb-btn); border: 3px solid #000; border-radius: 6px; padding: 9px 16px; box-shadow: inset 0 2px 0 rgba(255, 255, 255, .18), 3px 3px 0 #000; }
.btn:hover:not(:disabled) { filter: brightness(1.15); }
.btn:active:not(:disabled) { transform: translate(1px, 1px); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .18), 2px 2px 0 #000; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--eb-gold); color: #1b1030; font-weight: 700; }
.btn.on { background: var(--eb-mint); color: #0d2a1c; }
.btn.wrong { background: #4a1a2a; color: var(--eb-coral); }
.btn.block { display: block; width: 100%; text-align: left; margin-bottom: 8px; }
input, textarea, select { font: inherit; color: var(--eb-ink); background: var(--eb-panel); border: 3px solid #000; border-radius: 4px; padding: 9px 12px; width: 100%; }
textarea { min-height: 90px; resize: vertical; }
label.f { display: block; color: var(--eb-ink2); font-size: 15px; margin: 12px 0 4px; }

/* layout */
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.two { display: grid; gap: 18px; grid-template-columns: minmax(300px, 400px) 1fr; align-items: start; }
.two.wide { grid-template-columns: 1fr minmax(280px, 340px); }
@media (max-width: 860px) { .two, .two.wide { grid-template-columns: 1fr; } }
.hidden { display: none !important; }

/* readouts */
.readout { display: inline-flex; flex-direction: column; background: var(--eb-panel); border: 3px solid #000; border-radius: 4px; padding: 6px 12px; min-width: 110px; }
.readout .k { font-size: 13px; color: var(--eb-ink2); }
.readout .v { font-family: 'VT323', monospace; font-size: 30px; color: var(--eb-mint); line-height: 1; }
.score { font-family: 'VT323', monospace; font-size: 64px; color: var(--eb-gold); line-height: 1; }
.badge { font-family: 'Press Start 2P', monospace; font-size: 9px; padding: 5px 8px; border: 2px solid #000; border-radius: 4px; background: var(--eb-panel); color: var(--eb-ink2); }
.badge.good { color: var(--eb-mint); } .badge.new { color: var(--eb-coral); }

/* lists */
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--eb-panel); border: 3px solid #000; border-radius: 4px; margin-bottom: 10px; }
.item .t { flex: 1; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #000; flex: 0 0 12px; display: inline-block; }
.sysname { font-family: 'Press Start 2P', monospace; font-size: 9px; color: var(--eb-ink2); margin: 16px 0 8px; }
.log .entry { background: var(--eb-panel); border-left: 6px solid var(--eb-rim); border-radius: 4px; padding: 10px 14px; margin-bottom: 10px; }
.log .entry .name { font-size: 14px; color: var(--eb-ink2); font-weight: 700; }
.log .entry .explain { color: var(--eb-ink2); font-size: 15px; border-top: 2px dashed #3a2a63; padding-top: 6px; margin-top: 6px; }

/* learn */
.learn-body p { margin: 0 0 12px; }
.learn-body ul { margin: 0 0 12px; padding-left: 22px; } .learn-body li { margin-bottom: 6px; }
.learn-body b { color: var(--eb-sky); }
.pager { display: flex; gap: 6px; margin-bottom: 14px; }
.pager span { width: 22px; height: 8px; background: #3a2a63; border: 2px solid #000; }
.pager span.on { background: var(--eb-gold); }

/* engine diagram */
.engine-svg { width: 100%; height: auto; max-height: calc(100vh - 370px); min-height: 300px; display: block; background: var(--eb-panel); border: 3px solid #000; border-radius: 4px; }
.engine-svg .part { cursor: pointer; }
.engine-svg .part:hover { filter: drop-shadow(0 0 2px var(--eb-gold)) drop-shadow(0 0 2px var(--eb-gold)); }
.engine-svg .part.sel { filter: drop-shadow(0 0 3px var(--eb-gold)) drop-shadow(0 0 3px var(--eb-gold)) drop-shadow(0 0 2px var(--eb-gold)); }
.engine-svg .part.faded { pointer-events: none; filter: brightness(.6) saturate(.5); }
.engine-svg .part.flash { filter: drop-shadow(0 0 3px var(--eb-coral)) drop-shadow(0 0 3px var(--eb-coral)) drop-shadow(0 0 2px var(--eb-coral)); }
.eb-views { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.eb-views .btn { padding: 6px 10px; font-size: 14px; }

/* measure */
.gaugebox { background: var(--eb-panel); border: 3px solid #000; border-radius: 4px; padding: 10px; }
.blades { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.blades .btn { font-family: 'VT323', monospace; font-size: 22px; padding: 4px 12px; }

/* banner + dialog */
.eb-banner { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--eb-gold); color: #1b1030; border: 3px solid #000; box-shadow: 4px 4px 0 #000; padding: 12px 18px; border-radius: 6px; font-weight: 700; display: none; z-index: 40; }
.eb-banner.show { display: block; }
dialog { color: var(--eb-ink); background: var(--eb-window); border: 4px solid #000; box-shadow: inset 0 0 0 3px var(--eb-rim), 5px 5px 0 #000; border-radius: 6px; max-width: 560px; width: calc(100% - 32px); padding: 20px; }
dialog::backdrop { background: rgba(10, 4, 24, .75); }
table.spec { width: 100%; border-collapse: collapse; font-size: 15px; }
table.spec td { padding: 7px 4px; border-bottom: 2px solid #000; vertical-align: top; }
table.spec td:first-child { color: var(--eb-ink2); width: 42%; }

body { margin: 0; background-color: var(--eb-night); color: var(--eb-ink); font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; }

/* end card: copied from chemistry/part2-review */
.endcard{position:fixed;inset:0;z-index:9998;background:#000;color:#fff;display:flex;flex-direction:column;justify-content:center;padding:0 8vw;cursor:pointer;overflow:hidden}
.endcard[hidden]{display:none}
.endcard .stripes{position:absolute;inset:-20% -10%;background:repeating-linear-gradient(-28deg,transparent 0 46px,rgba(255,210,63,.9) 46px 58px,transparent 58px 120px,rgba(255,93,115,.85) 120px 128px,transparent 128px 190px,rgba(106,211,255,.8) 190px 196px);
  opacity:.22;animation:slide 6s linear infinite}
@keyframes slide{to{transform:translateX(190px)}}
.endcard .k{font:400 clamp(10px,1.4vw,14px)/1.6 'Press Start 2P','Courier New',monospace;color:var(--eb-gold);position:relative;letter-spacing:.06em}
.endcard .big{font-family:'Shippori Mincho B1','Times New Roman',serif;font-weight:800;line-height:.92;position:relative;transform-origin:left;transform:scaleX(.72);white-space:nowrap}
.endcard .l1{font-size:clamp(40px,8vw,96px)}
.endcard .l2{font-size:clamp(52px,11vw,132px);color:var(--eb-gold)}
.endcard .sub{position:relative;font:italic 700 clamp(14px,2vw,22px)/1.3 'Atkinson Hyperlegible',sans-serif;color:var(--eb-sky);margin-top:14px}
.endcard .close{position:absolute;right:18px;bottom:14px;font-size:13px;color:#888}
.endcard .in{animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
.endcard .in.d2{animation-delay:.25s} .endcard .in.d3{animation-delay:.5s} .endcard .in.d4{animation-delay:.8s}
@keyframes pop{from{opacity:0;transform:translateX(-40px) scaleX(.72)}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.endcard .stripes,.endcard .in{animation:none}}
</style>

<style>
/* Twilight Menu theme: shared by every sim. Edit here, then run tools/apply-theme.mjs.
   It sits AFTER each sim's own <style>, so it overrides the old light look without touching sim logic. */
:root{
  --bg:#1b1030; --card:#2a1850; --ink:#f6efff; --ink2:#c3b2e6; --line:#4a3478;
  --brand:#ffd23f; --brand2:#3a2463; --cool:#6ad3ff; --warm:#ff9a4d; --good:#5df2a4; --bad:#ff5d73;
  --focus:#5df2a4; --radius:6px;
  --tw-win:linear-gradient(180deg,#3b2468 0%,#2a1850 55%,#1f1240 100%);
  --tw-panel:#160d2b; --tw-rim:#8a6fd0; --tw-gold:#ffd23f; --tw-mint:#5df2a4; --tw-sky:#6ad3ff; --tw-coral:#ff5d73;
  --tw-pix:'Press Start 2P','Courier New',monospace;
  --tw-term:'VT323','Courier New',monospace;
  --tw-body:'Atkinson Hyperlegible',system-ui,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{background-color:var(--bg);color:var(--ink);font-family:var(--tw-body);
  background-image:radial-gradient(#ffffff10 1px,transparent 1px);background-size:6px 6px}

/* header */
.hd h1{font-family:var(--tw-pix);font-weight:400;font-size:clamp(14px,2.2vw,20px);line-height:1.5;color:var(--tw-gold);
  text-shadow:3px 3px 0 #000}
.pill{font-family:var(--tw-pix);font-size:9px;font-weight:400;letter-spacing:0;background:var(--tw-mint);color:#1b1030;
  border:3px solid #000;border-radius:0;padding:5px 8px}
.lead{color:var(--ink2)}

/* windows */
.card{background:var(--tw-win);border:4px solid #000;border-radius:var(--radius);
  box-shadow:inset 0 0 0 3px var(--tw-rim),5px 5px 0 #000;padding:14px}
.stagecard{padding:10px}
.stage canvas,.stage svg{background:var(--tw-panel);border:3px solid #000;border-radius:4px}
.caption{color:var(--ink2)} .caption b{color:var(--ink)}

/* headings inside windows */
.ctl-head h2,.learn h2,.sub{font-family:var(--tw-pix);font-weight:400;font-size:10px;line-height:1.6;letter-spacing:0;color:var(--tw-mint)}
.learn h2{color:var(--tw-sky)}

/* tabs and buttons: chunky menu buttons */
.tab,.btn,.segbtn{background:#3a2463;color:var(--ink);border:3px solid #000;border-radius:4px;
  box-shadow:inset 0 0 0 2px #5b3f94;font-family:var(--tw-body);font-weight:700}
.tab:hover,.btn:hover,.segbtn:hover{border-color:#000;box-shadow:inset 0 0 0 2px var(--tw-gold)}
.tab[aria-selected=true],.btn.primary{background:var(--tw-gold);color:#1b1030;border-color:#000;box-shadow:inset 0 -3px 0 #c99a00}
.tab[aria-selected=true]::before{content:'▶ ';font-size:.75em}
.segbtn[aria-pressed=true]{background:var(--tw-mint);color:#1b1030;border-color:#000;box-shadow:inset 0 -3px 0 #2fae6f}
.btn:active,.tab:active,.segbtn:active{transform:translate(1px,1px)}

/* controls */
.ctl-row{flex-wrap:wrap}
.ctl-row output{font-family:var(--tw-term);font-size:1.35rem;font-weight:400;color:var(--tw-gold);line-height:1;white-space:nowrap;margin-left:auto}
.hint{color:var(--ink2)}
input[type=range],.chk input{accent-color:var(--tw-gold)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* readouts: terminal-style panel */
.ro{background:var(--tw-panel);border:3px solid #000;border-radius:4px;box-shadow:inset 0 0 0 2px #3a2463}
.ro .k{color:var(--ink2)} .ro .v{font-family:var(--tw-term);font-size:1.25rem;color:var(--tw-mint);line-height:1.1}

/* callouts: dialogue-box style */
.callout{background:var(--tw-panel);border:3px solid #000;border-left:6px solid var(--tw-sky);border-radius:4px;color:var(--ink)}
.callout.warm{background:#24130f;border-left-color:var(--warm)}
.callout.good{background:#0f2219;border-left-color:var(--tw-mint)}
.callout.bad{background:#2a0f18;border-left-color:var(--tw-coral)}

/* learn / quiz */
.learn dd,.learn .ans{color:var(--ink2)}
.learn details{background:var(--tw-panel);border:3px solid #000;border-radius:4px}
.learn summary::before{background:var(--tw-gold);color:#1b1030;border-radius:0}
.learn details[open] summary::before{background:var(--tw-mint);color:#1b1030}
.foot{color:var(--ink2)}
a{color:var(--tw-sky)}

/* World Map button */
.tw-back-wrap{max-width:1120px;margin:0 auto;padding:10px 12px 0}
.tw-back{display:inline-block;font-family:var(--tw-pix);font-size:10px;line-height:1;color:var(--tw-gold);background:#3a2463;
  text-decoration:none;padding:8px 10px;border:3px solid #000;border-radius:4px;box-shadow:inset 0 0 0 2px #5b3f94}
.tw-back:hover{box-shadow:inset 0 0 0 2px var(--tw-gold)}
@media print{.tw-back-wrap{display:none}}

/* anime title card */
.tw-card{position:fixed;inset:0;z-index:9999;background:#000;color:#fff;display:flex;flex-direction:column;justify-content:center;
  padding:0 8vw;font-family:'Shippori Mincho B1','Times New Roman',serif;font-weight:800;line-height:.95;cursor:pointer;
  transition:opacity .45s}
.tw-card.out{opacity:0;pointer-events:none}
.tw-card div{transform-origin:left;white-space:nowrap}
.tw-card .l1{font-size:clamp(18px,3.4vw,34px);transform:scaleX(.82)}
.tw-card .l2{font-size:clamp(44px,9vw,104px);transform:scaleX(.7);letter-spacing:-.02em;margin:.08em 0}
.tw-card .l3{font-size:clamp(20px,4vw,44px);transform:scaleX(.8)}
.tw-card .skip{position:absolute;right:16px;bottom:12px;font:12px var(--tw-body);font-weight:400;color:#777;transform:none}
@media(prefers-reduced-motion:reduce){.tw-card{display:none}}
</style>
<script>
/* Twilight Menu theme runtime: shared by every sim. Edit here, then run tools/apply-theme.mjs.
   1) Canvas colour remap: the sims were drawn for a light background. Rather than hand-editing ~400
      colour literals across 18 sims, this rewrites colours as they are assigned to the canvas:
        light, greyish backgrounds -> dark twilight panels (same hue)
        dark, greyish ink/text     -> light ink
        dark saturated accents     -> lightened so they read on dark
        white halos behind labels  -> dark halos
      Mid/bright science colours (warm reds, cold blues, etc.) pass through unchanged.
      Shape-aware: pale colours filling round shapes (clouds, snow, droplets) stay pale; pale boxes go dark.
      Per-sim control: <meta name="tw-white" content="panel"> darkens everything pale regardless of shape;
      content="keep" never touches pure white. <meta name="tw-map" content="old=new; old=new"> forces exact colours.
      <meta name="tw-canvas" content="off"> turns the remap off: for new sims drawn in theme colours.
   2) Title card: reads <meta name="tw-titlecard" content="LINE 1|LINE 2|LINE 3">. Shown once per tab session.
   NEW sims should use the theme colours directly; the remap is there to convert the existing ones. */
(function(){
  const meta=n=>{const m=document.querySelector(`meta[name="${n}"]`);return m?m.content:null;};
  // tw-white: "auto" (default) | "panel" (dark-mode everything) | "keep" (never touch white)
  const whiteMode=meta('tw-white')||'auto';
  const cache=new Map();
  // Per-sim exact overrides: <meta name="tw-map" content="rgba(255,255,255,.92)=#241845; #e3e9f1=#3a2c5c">
  const norm=c=>String(c).toLowerCase().replace(/\s+/g,'');
  const overrides=new Map((meta('tw-map')||'').split(';').map(x=>x.split('=').map(y=>y.trim())).filter(x=>x.length===2&&x[0]).map(([a,b])=>[norm(a),b]));
  function parse(c){
    if(typeof c!=='string')return null; c=c.trim().toLowerCase();
    let m;
    if(c[0]==='#'){let h=c.slice(1);if(h.length===3||h.length===4)h=[...h].map(x=>x+x).join('');
      if(h.length!==6&&h.length!==8)return null;
      return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16),h.length===8?parseInt(h.slice(6,8),16)/255:1];}
    if((m=c.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*(?:,\s*([\d.]+)\s*)?\)$/)))
      return [+m[1],+m[2],+m[3],m[4]==null?1:+m[4]];
    if(c==='white')return [255,255,255,1];
    if(c==='black')return [0,0,0,1];
    return null;
  }
  function toHsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;
    if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);
      h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h/=6;}
    return [h,s,l];}
  function hsl(h,s,l,a){const f=n=>{const k=(n+h*12)%12,q=s*Math.min(l,1-l);return Math.round(255*(l-q*Math.max(-1,Math.min(k-3,9-k,1))));};
    return `rgba(${f(0)},${f(8)},${f(4)},${a})`;}
  const isWhite=p=>p&&p[0]>=250&&p[1]>=250&&p[2]>=250;
  const chromaOf=p=>(Math.max(p[0],p[1],p[2])-Math.min(p[0],p[1],p[2]))/255;
  // "pale" = white or a washed-out tint: these are the colours that are either backgrounds or clouds/snow
  function isPale(c){const p=parse(c);if(!p)return false;if(isWhite(p))return true;const l=toHsl(p[0],p[1],p[2])[2];return l>=.72&&chromaOf(p)<.4;}
  function remap(c,kind){
    if(overrides.has(norm(c)))return overrides.get(norm(c));
    const key=kind+c; if(cache.has(key))return cache.get(key);
    const p=parse(c); let out=c;
    if(p){const [r,g,b,a]=p,[h,s,l]=toHsl(r,g,b);
      const chroma=chromaOf(p);
      const TH=.73;                                        // theme hue (twilight purple)
      if(isWhite(p)){
        if(whiteMode==='keep') out=c;
        else if(a<1) out=`rgba(22,13,43,${a})`;           // label halos (strokes) / veils over backgrounds
        else out=kind==='stroke'?c:'#241845';               // white panels -> dark; white outlines stay
      }
      else if(l>=.72&&chroma<.4) out=chroma<.05                                         // pale backgrounds, grid lines
        ? hsl(TH,.3,.09+(1-l)*.95,a) : hsl(h,Math.min(s,.32),.1+(1-l)*.95,a);
      else if(l<.5&&chroma<.3) out=chroma<.12                                           // ink, labels, grey strokes
        ? hsl(TH,.3,Math.min(.93,1.02-l*.8),a) : hsl(h,.35,Math.min(.9,1-l*.7),a);

<script>
// pengsave.js — shared save-file format for Engine Bay (and later the Cabin game).
// Format:  PENG1.<base64 of deflated JSON>.<checksum>
// The checksum stops casual editing (a student opening the file in a text editor).
// It is NOT real security: anything that runs in the browser can be reverse-engineered.
(function (global) {
  const MAGIC = 'PENG1';
  const SALT = 'qerhs-pe3201-neon-decay'; // change this each year to invalidate old files

  // cyrb53: small, fast, non-cryptographic string hash
  function cyrb53(str, seed = 0) {
    let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (let i = 0; i < str.length; i++) {
      const ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
  }

  function bytesToB64(bytes) {
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  }
  function b64ToBytes(b64) {
    const s = atob(b64), out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }
  async function pipe(bytes, stream) {
    const res = new Response(new Blob([bytes]).stream().pipeThrough(stream));
    return new Uint8Array(await res.arrayBuffer());
  }

  async function encode(obj) {
    const json = JSON.stringify(obj);
    const packed = await pipe(new TextEncoder().encode(json), new CompressionStream('deflate'));
    const body = bytesToB64(packed);
    return `${MAGIC}.${body}.${cyrb53(SALT + body)}`;
  }

  // Returns { data, valid } — valid=false means the file was edited or damaged.
  async function decode(text) {
    const parts = text.trim().split('.');
    if (parts.length !== 3 || parts[0] !== MAGIC) throw new Error('Not an Engine Bay save file');
    const [, body, sum] = parts;
    const valid = cyrb53(SALT + body) === sum;
    let data;
    try {
      data = JSON.parse(new TextDecoder().decode(await pipe(b64ToBytes(body), new DecompressionStream('deflate'))));
    } catch (e) { throw new Error('The file is damaged and can\'t be read'); }
    return { data, valid };
  }

  // Save: on ChromeOS Chrome this opens a real "Save as" dialog (students can pick their Drive folder).
  // Fallback: a normal download.
  async function saveToFile(obj, suggestedName) {
    const text = await encode(obj);
    if (global.showSaveFilePicker) {
      try {
        const handle = await global.showSaveFilePicker({
          suggestedName,
          types: [{ description: 'Engine Bay save', accept: { 'text/plain': ['.peng'] } }],
        });
        const w = await handle.createWritable();
        await w.write(text); await w.close();
        return 'saved';
      } catch (e) {
        if (e.name === 'AbortError') return 'cancelled';
        // fall through to download on any other error (e.g. blocked by policy)
      }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
    a.download = suggestedName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    return 'downloaded';
  }

  global.PengSave = { encode, decode, saveToFile };
})(window);

</script>

  return { render, views, has, shows, VIEWS };
})();

<script>
// ENGINE BAY — main app. Data lives in data-*.js; save format in pengsave.js.
(function () {
const E = window.ENGINE_GX;
const SCORING = { wastedTest: 4, wrongFault: 20, wrongRepair: 15, teardownError: 3 };
const CERT_CASES = 3, CERT_NEEDS = 3, REMIND_MIN = 10;

let S = null, dirty = false, busy = null; // busy = a case/teardown/measure run in progress
let tab = 'home';
const $ = s => document.querySelector(s);
const app = () => $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sysVar = s => `var(--sys-${s.toLowerCase().split(' ')[0]})`;
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
const pick = a => a[Math.floor(Math.random() * a.length)];
const now = () => new Date().toISOString();

// ================= save =================
function blank(name, cls) {
  return { v: 2, app: 'engine-bay', student: { name, cls }, created: now(), saved: null, saveCount: 0,
    learn: {}, teardown: {}, measure: { attempts: 0, best: null }, practice: {}, cert: { status: 'none', cases: [], results: {} }, log: [] };
}
function upgrade(d) { // v1 files had no learn/teardown/measure
  d.learn ||= {}; d.teardown ||= {}; d.measure ||= { attempts: 0, best: null }; d.practice ||= {}; d.cert ||= { status: 'none', cases: [], results: {} }; d.log ||= []; d.v = 2; return d;
}
function logEvent(ev) { S.log.push({ t: now(), ev }); if (S.log.length > 500) S.log.shift(); }
function markDirty() { dirty = true; header(); }
async function save() {
  S.saved = now(); S.saveCount++;
  const fname = (S.student.name.replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '') || 'student') + '-EngineBay.peng';
  const r = await PengSave.saveToFile(S, fname);
  if (r === 'cancelled') { S.saveCount--; return; }
  dirty = false; header(); banner(r === 'saved' ? 'Saved.' : 'Downloaded: move it into your Drive folder.');
}
window.ebSave = save;
function banner(msg, ms = 3500) { const b = $('#banner'); b.textContent = msg; b.classList.add('show'); clearTimeout(banner.t); banner.t = setTimeout(() => b.classList.remove('show'), ms); }
setInterval(() => { if (S && dirty) banner('Save your file now! (SAVE, top right)', 8000); }, REMIND_MIN * 60000);
window.addEventListener('beforeunload', e => { if (S && (dirty || busy)) { e.preventDefault(); e.returnValue = ''; } });

function header() {
  $('#who').textContent = S ? `${S.student.name} · ${S.student.cls}` : '';
  $('#saveBtn').classList.toggle('hidden', !S);
  const st = $('#savestate');

function startJob(id) {
  const job = JOBS.find(j => j.id === id);
  busy = { kind: 'teardown', job, phase: 'off', off: new Set(), errors: 0, sel: null, step: null, log: [], startedAt: now() };
  drawJob();
}
const inJob = (job, id) => job.parts.includes(id);
function blockersOff(job, off, id) { return PARTS[id].under.filter(b => inJob(job, b) && !off.has(b)); }          // still on, in the way
function needsFirst(job, off, id) { return job.parts.filter(c => off.has(c) && PARTS[c].under.includes(id)); }     // must go back before id
function drawJob(flash) {
  const B = busy, job = B.job, rebuild = B.phase === 'on';
  const list = job.parts.filter(p => rebuild ? B.off.has(p) : !B.off.has(p)).sort((a, b) => PARTS[a].name.localeCompare(PARTS[b].name));
  // Which drawing to show: stay on the student's view while it still shows something they can work on, otherwise move to one that does.
  const views = EngineSVG.views(job.parts, B.off);
  const can = B.step ? [B.step.part] : job.parts.filter(p => rebuild ? B.off.has(p) && !needsFirst(job, B.off, p).length : !B.off.has(p) && !blockersOff(job, B.off, p).length);
  const fits = v => can.some(p => rebuild ? EngineSVG.has(v, p) : EngineSVG.shows(v, p, B.off));
  const most = v => job.parts.filter(p => EngineSVG.has(v, p)).length; // prefer the side where most of this job happens
  if (!views.includes(B.view) || (!B.pinned && !fits(B.view))) B.view = views.filter(fits).sort((a, b) => most(b) - most(a))[0] || views[0];
  const logHtml = B.log.slice().reverse().map(l => `<div class="entry" style="border-left-color:${l.bad ? 'var(--eb-coral)' : 'var(--eb-mint)'}"><div>${l.html}</div></div>`).join('');
  let panel = '';
  if (B.step && B.step.stage === 'tool') {
    const p = PARTS[B.step.part];
    panel = `<div class="callout"><b>${esc(p.name)}</b>: which tool${rebuild && p.torque ? ' do you finish it with' : ''}?</div>
      <div class="row">${TOOLS.map(t => `<button class="btn ${B.step.wrong.includes(t.id) ? 'wrong' : ''}" data-tool="${t.id}" ${B.step.wrong.includes(t.id) ? 'disabled' : ''}>${esc(t.name)}</button>`).join('')}</div>
      <button class="btn" id="cancelStep" style="margin-top:10px">Cancel</button>`;
  } else if (B.step && B.step.stage === 'torque') {
    const p = PARTS[B.step.part];
    panel = `<div class="callout"><b>${esc(p.name)}</b>: torque to what? (Open the spec card if you need it.)</div>
      <div class="row">${[...new Set(Object.values(PARTS).map(q => q.torque).filter(Boolean))].sort((a, b) => a - b).map(v => `<button class="btn vt ${B.step.wrong.includes(v) ? 'wrong' : ''}" style="font-size:22px" data-tq="${v}" ${B.step.wrong.includes(v) ? 'disabled' : ''}>${v} ft-lb</button>`).join('')}</div>`;
  } else if (B.step && B.step.stage === 'check') {
    const ck = PARTS[B.step.part].check;
    panel = `<div class="callout"><b>${esc(ck.q)}</b></div>${ck.a.map((a, i) => `<button class="btn block ${B.step.wrong.includes(i) ? 'wrong' : ''}" data-ck="${i}" ${B.step.wrong.includes(i) ? 'disabled' : ''}>${esc(a)}</button>`).join('')}`;
  } else {
    panel = `<p class="muted" style="margin:0 0 8px">${rebuild ? 'Pick the next part to put back on (click it in the tray).' : 'Pick the next part to take off (click it here or on the engine).'}</p>
      ${list.map(p => `<button class="btn block" data-p="${p}"><span class="dot" style="background:${sysVar(PARTS[p].sys)};margin-right:8px"></span>${esc(PARTS[p].name)}</button>`).join('')}`;
  }
  app().innerHTML = `
  <div class="row" style="margin-bottom:12px"><button class="btn" id="jback">← Jobs</button><span class="label" style="margin:0 0 0 8px">${esc(job.title)}</span><div class="eb-spacer"></div>
    <span class="readout"><span class="k">${rebuild ? 'Installed' : 'Removed'}</span><span class="v">${rebuild ? job.parts.length - B.off.size : B.off.size}/${job.parts.length}</span></span>
    <span class="readout"><span class="k">Mistakes</span><span class="v" style="color:${B.errors ? 'var(--eb-coral)' : 'var(--eb-mint)'}">${B.errors}</span></span>
    <button class="btn" onclick="ebSpec()">Spec card</button></div>
  <div class="two wide">
    <div><div class="win" style="padding:12px"><div class="eb-views">${views.map(v => `<button class="btn ${v === B.view ? 'primary' : ''}" data-view="${v}">${EngineSVG.VIEWS.find(x => x.id === v).label}</button>`).join('')}</div>
      ${EngineSVG.render({ view: B.view, scope: job.parts, off: B.off, sel: B.step && B.step.part, flash })}</div>
      <div class="win log"><span class="label">Shop log</span>${logHtml || '<p class="muted">Safety first: think about what has to happen before anything else.</p>'}</div></div>
    <div class="win"><span class="label">${rebuild ? 'Rebuild · parts tray' : 'Teardown · parts on the engine'}</span>${panel}</div>
  </div>`;
  $('#jback').onclick = () => go('teardown');
  app().querySelectorAll('[data-p]').forEach(b => b.onclick = () => choosePart(b.dataset.p));

  app().querySelectorAll('[data-view]').forEach(b => b.onclick = () => { B.view = b.dataset.view; B.pinned = true; drawJob(); });
  app().querySelectorAll('[data-tool]').forEach(b => b.onclick = () => chooseTool(b.dataset.tool));
  app().querySelectorAll('[data-tq]').forEach(b => b.onclick = () => chooseTorque(+b.dataset.tq));
  app().querySelectorAll('[data-ck]').forEach(b => b.onclick = () => chooseCheck(+b.dataset.ck));
  const c = $('#cancelStep'); if (c) c.onclick = () => { B.step = null; drawJob(); };
}
function err(html, flash) { busy.errors++; busy.log.push({ bad: true, html }); drawJob(flash); }
function choosePart(id) {
  const B = busy, job = B.job, p = PARTS[id];
  if (B.phase === 'off') {
    if (!inJob(job, id)) return;
    const bl = blockersOff(job, B.off, id);
    if (bl.length) return err(`<b>${esc(p.name)}</b> can't come off yet: <b>${esc(PARTS[bl[0]].name)}</b> is in the way.`, bl[0]);
  } else {
    const nf = needsFirst(job, B.off, id);
    if (nf.length) return err(`<b>${esc(p.name)}</b> can't go on yet: <b>${esc(PARTS[nf[0]].name)}</b> goes on underneath it first.`);
  }
  B.step = { part: id, stage: 'tool', wrong: [] }; B.pinned = false; drawJob();
}
function chooseTool(t) {
  const B = busy, p = PARTS[B.step.part], rebuild = B.phase === 'on';
  const right = rebuild && p.torque ? 'torque' : p.tool;
  if (t !== right) {
    B.step.wrong.push(t);
    const why = TOOL_WHY[t] || (rebuild && p.torque && t === p.tool ? `That gets it snug, but this fastener has a torque spec, so it is finished with the torque wrench.` : `${TOOLS.find(x => x.id === t).name} isn't the right tool for the ${p.name.toLowerCase()}.`);
    return err(why);
  }
  if (rebuild && p.check) { B.step.stage = 'check'; B.step.wrong = []; return drawJob(); }
  if (rebuild && p.torque) { B.step.stage = 'torque'; B.step.wrong = []; return drawJob(); }
  finishStep();
}
function chooseTorque(v) {
  const B = busy, p = PARTS[B.step.part];
  if (v !== p.torque) { B.step.wrong.push(v); return err(`${v} ft-lb is wrong for the ${p.name.toLowerCase()}. Too loose and it works free; too tight and it stretches the bolt or strips the aluminum threads. Check the spec card.`); }
  finishStep();
}
function chooseCheck(i) {
  const B = busy, p = PARTS[B.step.part], ck = p.check;
  if (i !== ck.c) { B.step.wrong.push(i); return err(`Not right. ${esc(ck.why)}`); }
  B.log.push({ html: esc(ck.why) });
  if (p.torque) { B.step.stage = 'torque'; B.step.wrong = []; return drawJob(); }
  finishStep();
}
function finishStep() {
  const B = busy, id = B.step.part, p = PARTS[id], job = B.job;
  if (B.phase === 'off') { B.off.add(id); B.log.push({ html: `<b>Off: ${esc(p.name)}.</b> ${esc(p.off)}` }); }
  else { B.off.delete(id); B.log.push({ html: `<b>On: ${esc(p.name)}.</b>${p.torque ? ` Torqued to ${p.torque} ft-lb.` : ''}` }); }
  B.step = null; B.pinned = false;
  if (B.phase === 'off' && B.off.size === job.parts.length) {
    B.phase = 'on'; B.log.push({ html: '<b>Teardown complete.</b> Inspect, clean, then rebuild: the last part off is the first part back on.' });
  } else if (B.phase === 'on' && B.off.size === 0) return jobDone();
  drawJob();
}
function jobDone() {
  const B = busy, score = Math.max(0, 100 - B.errors * SCORING.teardownError);
  const r = S.teardown[B.job.id] || (S.teardown[B.job.id] = { attempts: 0, best: null });
  r.attempts++; r.best = Math.max(r.best ?? 0, score); r.last = { score, errors: B.errors, startedAt: B.startedAt, finishedAt: now() };
  logEvent(`teardown ${B.job.id} ${score}`); markDirty(); busy = null;
  app().innerHTML = `<div class="win" style="max-width:620px;margin:30px auto;text-align:center"><span class="label">Job complete</span><h2>${esc(B.job.title)}</h2>
    <div class="score">${score}%</div><p class="muted">${B.errors} mistake(s) × ${SCORING.teardownError} points</p>
    <div class="row" style="justify-content:center"><button class="btn primary" onclick="ebSave()">Save my file</button><button class="btn" id="more">More jobs</button></div></div>`;
  $('#more').onclick = () => go('teardown');
}

function judgeBtns(opts) { return `<div class="row" style="margin-top:10px">${opts.map((o, i) => `<button class="btn" data-j="${i}">${o}</button>`).join('')}</div>`; }

      <div class="gaugebox"><div class="blades">${set.map(w => `<button class="btn" data-w="${w}">${w.toFixed(2)}</button>`).join('')}</div><div id="feel" class="callout">Pick a ${plug ? 'wire' : 'blade'} to try.</div></div>

      <div class="gaugebox" style="max-width:360px">${dialSVG(T.v)}</div>
      <label class="f">Your reading (psi)</label><input id="rd" inputmode="numeric" placeholder="e.g. 55">
      <label class="f">Spec: ${esc(E.SPEC.compression)}. Verdict?</label>
      ${judgeBtns(['Healthy: compression is fine', 'Low: find the leak (valves, rings, gasket)'])}</div>`;
    app().querySelectorAll('[data-j]').forEach(b => b.onclick = () => {

function measureScore(oks, msg, extra) {
  const B = busy, n = oks.filter(Boolean).length;
  B.pts += n; B.max += oks.length; B.res.push({ task: B.tasks[B.i].k, ok: oks, msg, ...extra });
  const box = document.createElement('div');
  box.className = 'callout ' + (n === oks.length ? 'good' : 'bad');
  box.innerHTML = `${n === oks.length ? '✔ ' : '✘ '}${esc(msg)} <button class="btn primary" style="margin-left:10px" id="mnext">Next →</button>`;
  app().querySelector('.win').appendChild(box);
  app().querySelectorAll('[data-j], #sub, [data-w]').forEach(b => b.disabled = true);
  $('#mnext').onclick = () => { B.i++; measureTask(); window.scrollTo(0, 0); };
}
function measureDone() {
  const B = busy, score = Math.round(100 * B.pts / B.max);
  S.measure.attempts++; S.measure.best = Math.max(S.measure.best ?? 0, score); S.measure.last = { score, results: B.res, finishedAt: now() };
  logEvent('measure ' + score); markDirty(); busy = null;
  app().innerHTML = `<div class="win" style="max-width:620px;margin:30px auto;text-align:center"><span class="label">Round complete</span><div class="score">${score}%</div>
    <div style="text-align:left">${B.res.map(r => `<div class="callout ${r.ok.every(Boolean) ? 'good' : 'bad'}">${esc(r.msg)}</div>`).join('')}</div>
    <div class="row" style="justify-content:center"><button class="btn primary" onclick="ebSave()">Save my file</button><button class="btn" id="again">New round</button></div></div>`;
  $('#again').onclick = () => go('measure');
}
function caliperSVG(v) {
  const s = 12, start = Math.floor(v) - 5, X = mm => 30 + (mm - start) * s;
  let main = '', vern = '';
  for (let mm = start; mm <= start + 58; mm++) {
    const h = mm % 10 === 0 ? 30 : mm % 5 === 0 ? 22 : 14;
    main += `<line x1="${X(mm)}" x2="${X(mm)}" y1="90" y2="${90 - h}" stroke="#f6efff" stroke-width="1.5"/>`;
    if (mm % 10 === 0) main += `<text x="${X(mm)}" y="50" fill="#f6efff" font-size="15" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif">${mm}</text>`;
  }
  for (let k = 0; k <= 20; k++) {
    const x = X(v + 1.95 * k), h = k % 2 === 0 ? 24 : 14;
    vern += `<line x1="${x}" x2="${x}" y1="92" y2="${92 + h}" stroke="#ffd23f" stroke-width="1.5"/>`;
    if (k % 2 === 0) vern += `<text x="${x}" y="134" fill="#ffd23f" font-size="13" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif">${k / 2}</text>`;
  }
  return `<svg viewBox="0 0 760 150" style="width:100%;height:auto;display:block" role="img" aria-label="Vernier caliper scale">
    <rect x="10" y="30" width="740" height="62" fill="#2a1d4d" stroke="#000" stroke-width="2"/>
    <rect x="${X(v) - 14}" y="92" width="${1.95 * 20 * s + 28}" height="50" rx="4" fill="#3b2468" stroke="#000" stroke-width="2"/>
    <text x="14" y="24" fill="#c3b2e6" font-size="12" font-family="Atkinson Hyperlegible, sans-serif">main scale (mm)</text>
    ${main}${vern}</svg>`;
}
function dialSVG(v) {
  const cx = 160, cy = 160, R = 130, max = 200, A = p => (-225 + 270 * p / max) * Math.PI / 180;
  let t = '';
  for (let p = 0; p <= max; p += 5) {
    const a = A(p), L = p % 20 === 0 ? 18 : p % 10 === 0 ? 12 : 7;
    t += `<line x1="${cx + Math.cos(a) * R}" y1="${cy + Math.sin(a) * R}" x2="${cx + Math.cos(a) * (R - L)}" y2="${cy + Math.sin(a) * (R - L)}" stroke="#f6efff" stroke-width="${p % 20 === 0 ? 2.5 : 1.3}"/>`;
    if (p % 20 === 0) t += `<text x="${cx + Math.cos(a) * (R - 34)}" y="${cy + Math.sin(a) * (R - 34) + 5}" fill="#f6efff" font-size="15" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif">${p}</text>`;
  }
  const a = A(v);
  return `<svg viewBox="0 0 320 300" style="width:100%;height:auto;display:block" role="img" aria-label="Compression gauge dial">
    <circle cx="${cx}" cy="${cy}" r="${R + 10}" fill="#2a1d4d" stroke="#000" stroke-width="4"/>${t}
    <text x="${cx}" y="${cy + 60}" fill="#c3b2e6" font-size="14" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif">psi</text>
    <line x1="${cx}" y1="${cy}" x2="${cx + Math.cos(a) * (R - 12)}" y2="${cy + Math.sin(a) * (R - 12)}" stroke="#ff5d73" stroke-width="4" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="9" fill="#ff5d73" stroke="#000" stroke-width="2"/></svg>`;
}

function finishCase(why) {
  const R = busy, cs = caseById(R.id);
  const wasted = R.tests.filter(t => !cs.useful.includes(t)).length;
  const score = Math.max(0, 100 - wasted * SCORING.wastedTest - R.wrongFaults.length * SCORING.wrongFault - R.wrongRepairs.length * SCORING.wrongRepair);
  const rec = { score, tests: R.tests, wasted, wrongFaults: R.wrongFaults, wrongRepairs: R.wrongRepairs, explanation: why, startedAt: R.startedAt, finishedAt: now() };
  if (R.mode === 'cert') { S.cert.results[R.id] = rec; logEvent(`cert-case ${R.id} ${score}`); }
  else { const p = S.practice[R.id] || (S.practice[R.id] = { attempts: 0, best: null }); p.attempts++; p.best = Math.max(p.best ?? 0, score); p.last = rec; logEvent(`practice ${R.id} ${score}`); }
  markDirty(); const mode = R.mode; busy = null;
  app().innerHTML = `<div class="win" style="max-width:660px;margin:30px auto;text-align:center"><span class="label">Work order closed</span><div class="score">${score}%</div>
    <p class="muted">Tests run: ${rec.tests.length} (${wasted} didn't help: −${wasted * SCORING.wastedTest})<br>Wrong diagnoses: ${rec.wrongFaults.length} (−${rec.wrongFaults.length * SCORING.wrongFault})<br>Wrong repairs: ${rec.wrongRepairs.length} (−${rec.wrongRepairs.length * SCORING.wrongRepair})</p>
    ${mode === 'practice' ? `<div class="callout" style="text-align:left">Useful tests for this case: ${cs.useful.map(t => esc(E.TESTS.find(x => x.id === t).name)).join('; ')}.</div>` : ''}

  const c = $('#toCases'); if (c) c.onclick = () => go('diagnose');

function certHome() {
  const c = S.cert;
  if (c.status === 'done') return certSummary(false);
  const ready = casesDone() >= CERT_NEEDS;
  app().innerHTML = `<div class="win" style="max-width:700px;margin:0 auto"><span class="label">Certification</span><h2>Small engine diagnosis</h2>
    <p>${CERT_CASES} random cases. One attempt each, and the tests show results without the explanations. Wasted tests and wrong answers cost points, just like in practice. Your teacher marks this.</p>
    <div class="callout warm">Once you start a case you must finish it. When you finish, show your teacher the <b>My results</b> screen.</div>
    ${ready ? '' : `<div class="callout bad">Solve at least ${CERT_NEEDS} practice cases first (you have ${casesDone()}).</div>`}
    <button class="btn primary" id="cgo" ${ready ? '' : 'disabled'}>${c.status === 'in_progress' ? 'Continue certification' : 'Start certification'}</button></div>`;
  $('#cgo').onclick = () => {
    if (c.status === 'none') {
      if (!confirm('Start certification now?')) return;
      Object.assign(c, { status: 'in_progress', startedAt: now(), cases: shuffle(E.CASES.map(x => x.id)).slice(0, CERT_CASES), results: {} });
      logEvent('cert-start'); markDirty();
    }
    certContinue();
  };
}
function certContinue() {
  const c = S.cert, next = c.cases.find(id => !c.results[id]);
  if (next) return startCase(next, 'cert');
  const sc = c.cases.map(id => c.results[id].score);
  c.score = Math.round(sc.reduce((a, b) => a + b, 0) / sc.length); c.status = 'done'; c.finishedAt = now();
  logEvent('cert-done ' + c.score); markDirty(); certSummary(true);
}
function certSummary(fresh) {

    <p>${c.cases.map(id => `${esc(caseById(id).title)}: ${c.results[id].score}%`).join('<br>')}</p>

function fillAll() {
  const t = now(), rec = cs => ({ score: 100, tests: cs.useful, wasted: 0, wrongFaults: [], wrongRepairs: [], explanation: 'Filled in by the test menu.', startedAt: t, finishedAt: t });
  LEARN.forEach(m => S.learn[m.id] = { attempts: 1, best: 5, passed: true });
  JOBS.forEach(j => S.teardown[j.id] = { attempts: 1, best: 100, last: { score: 100, errors: 0, startedAt: t, finishedAt: t } });
  S.measure = { attempts: 1, best: 100 };
  E.CASES.forEach(cs => S.practice[cs.id] = { attempts: 1, best: 100, last: rec(cs) });
  return rec;
}
function testStudent(done) { S = blank('Test Student', 'Test'); if (done) fillAll(); logEvent('test student'); dirty = false; busy = null; }
function jump(t, fn) {
  $('#dbg').close();
  if (!S) testStudent(true);
  busy = null; tab = t; header(); fn(); window.scrollTo(0, 0);
}
function debugMenu() {
  const groups = [
    ['Test student', [
      ['New test student with nothing done', () => { testStudent(false); jump('home', home); }],
      ['New test student with Learn, Teardown, Measure and all practice cases done', () => { testStudent(true); jump('home', home); }],
      ['Show the "file was changed outside Engine Bay" warning', () => jump('home', () => { S.tampered = true; home(); })],
      ['My results screen (everything before certification done)', () => jump('results', results)],
      ['My results screen with certification finished', () => jump('results', () => { const rec = fillAll(); const cases = shuffle(E.CASES.map(x => x.id)).slice(0, CERT_CASES);
        S.cert = { status: 'done', startedAt: now(), finishedAt: now(), score: 100, cases, results: Object.fromEntries(cases.map(id => [id, rec(caseById(id))])) }; results(); })],
      ['Save this student\'s file (to try on the marks page)', () => { $('#dbg').close(); if (!S) testStudent(true); header(); save(); }]]],
    ['Learn: straight to the 5-question check', LEARN.map(m => [m.title, () => jump('learn', () => learnQuiz(m.id))])],
    ['Teardown: take apart', JOBS.map(j => [j.title, () => jump('teardown', () => startJob(j.id))])],
    ['Teardown: put back together (already taken apart; tests tools, questions and torque)', JOBS.map(j => [j.title, () => jump('teardown', () => {
      startJob(j.id); busy.off = new Set(j.parts); busy.phase = 'on';
      busy.log.push({ html: '<b>Test menu: already taken apart.</b> Rebuild: the last part off is the first part back on.' }); drawJob(); })])],
    ['Measure', [['Start a measuring round', () => jump('measure', () => { measureStart(); $('#mgo').click(); })]]],
    ['Diagnose: practice case', E.CASES.map(cs => [cs.title, () => jump('diagnose', () => startCase(cs.id, 'practice'))])],
    ['Certification', [
      ['Start screen (3 practice cases already solved)', () => jump('cert', () => { fillAll(); S.cert = { status: 'none', cases: [], results: {} }; certHome(); })],
      ['First certification case', () => jump('cert', () => { fillAll(); Object.assign(S.cert, { status: 'in_progress', startedAt: now(), cases: shuffle(E.CASES.map(x => x.id)).slice(0, CERT_CASES), results: {} }); certContinue(); })],
      ['Finished: score screen and the "see you next class" card', () => jump('cert', () => { const rec = fillAll();
        const cases = shuffle(E.CASES.map(x => x.id)).slice(0, CERT_CASES);
        S.cert = { status: 'in_progress', startedAt: now(), cases, results: Object.fromEntries(cases.map(id => [id, rec(caseById(id))])) }; certContinue(); })]]],
  ];
  const d = document.createElement('dialog');
  d.id = 'dbg'; d.style.maxWidth = '760px'; d.style.maxHeight = '88vh'; d.style.overflow = 'auto';
  d.innerHTML = `<div class="row"><span class="label" style="margin:0">Test menu</span><div class="eb-spacer"></div><button class="btn" id="dbgX">Close</button></div>
    <p class="muted" style="margin-top:6px">Only shows when the address ends in ?debug, so students never see it. Every button goes straight there. If no file is open, it makes a "Test Student" with everything before certification done.</p>
    ${groups.map(([h, btns], gi) => `<h3 style="margin:14px 0 6px">${esc(h)}</h3><div class="row" style="flex-wrap:wrap;gap:6px">${btns.map(([l], bi) => `<button class="btn" data-dbg="${gi}.${bi}">${esc(l)}</button>`).join('')}</div>`).join('')}`;
  document.body.appendChild(d);
  d.querySelector('#dbgX').onclick = () => d.close();
  d.querySelectorAll('[data-dbg]').forEach(b => { const [gi, bi] = b.dataset.dbg.split('.'); b.onclick = groups[gi][1][bi][1]; });
  const open = document.createElement('button');
  open.className = 'btn'; open.textContent = 'TEST MENU';
  open.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:50';
  open.onclick = () => d.showModal();
  document.body.appendChild(open);
}

// ================= boot =================
$('#fileInput').onchange = openFile;
$('#saveBtn').onclick = save;
if (/[?&#]debug\b/.test(location.search + location.hash)) debugMenu();
start();
})();

</script>
