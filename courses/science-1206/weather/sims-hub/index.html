<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather Dynamics | Science 1206</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#14202e;--ink2:#465569;--line:#d6dfea;--brand:#1d5fbf;--brand2:#e4eefc;--focus:#ffb000}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:14px 12px 26px}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin:0 0 10px}
.hd h1{font-size:1.45rem;line-height:1.2;margin:0}
.pill{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--brand2);color:#174a94;border-radius:99px;padding:3px 10px;white-space:nowrap}
.lead{flex-basis:100%;margin:2px 0 0;color:var(--ink2)}
h2{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:20px 0 8px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-decoration:none;color:inherit}
a.card:hover{border-color:var(--brand);box-shadow:0 2px 10px rgba(29,95,191,.15)}
a.card:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.n{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.05em;background:var(--brand2);color:#174a94;border-radius:99px;padding:2px 9px;margin-bottom:6px}
.t{font-weight:700;font-size:1rem;margin:0 0 3px;line-height:1.25}
.b{color:var(--ink2);font-size:.9rem;margin:0}
.card.off{opacity:.62}
.note{margin:16px 2px 0;font-size:.82rem;color:var(--ink2)}
</style></head>
<body><!--worldmap:start--><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap"><div style="max-width:1120px;margin:0 auto;padding:10px 12px 0;align-self:stretch;box-sizing:border-box"><a href="https://mrbecktech.github.io/site/" style="display:inline-block;font-family:'Press Start 2P','Courier New',monospace;font-size:10px;line-height:1;color:#ffd23f;background:#3a2463;text-decoration:none;padding:8px 10px;border:3px solid #000;border-radius:4px;box-shadow:inset 0 0 0 2px #5b3f94">&#9664; WORLD MAP</a></div><!--worldmap:end--><div class="wrap">
<div class="hd"><span class="pill">Science 1206 &middot; Chapter 1</span><h1>Weather Dynamics</h1>
<p class="lead">Eighteen interactive simulations for <i>Inquiring about Weather</i>. Pick one to explore.</p></div>
<div id="out"></div>
<p class="note">Each simulation opens in a new tab. Google Sites blocks an embedded page from replacing the tab it sits in, so a new tab is the only way these links can work.</p>
<p class="note" id="note"></p>
</div>
<script>
/* ==================================================================
   EDIT THIS BLOCK ONLY.
   BASE  = the address of your Grade 10 section, ending with a slash.
   SLUGS = the page name you give each simulation in Google Sites.
   A slug left as "" turns that card grey and makes it unclickable,
   so you can publish the hub before every page exists.
   ================================================================== */
const BASE = "https://sites.google.com/nlesd.ca/mrbeckswonderfulwebsite/science/grade-10/weather-simulators/";
const SLUGS = {"01": "energy-budget", "02": "heat-transfer", "03": "heat-sinks", "04": "atmosphere-pressure", "05": "humidity", "06": "water-cycle", "07": "air-masses", "08": "pressure-systems", "09": "coriolis-effect", "10": "global-winds", "11": "jet-streams", "12": "weather-fronts", "13": "surface-currents", "14": "deep-currents", "15": "el-nino-la-nina", "16": "thunderstorms-tornadoes", "17": "hurricanes", "18": "noreasters-blizzards"};
/* ================= nothing below here needs editing ================ */
const SIMS = [{"id": "01", "title": "Earth's Energy Budget and Albedo", "blurb": "Follow 100 units of sunlight: reflected, absorbed, re-radiated. Change surface colour, clouds and greenhouse gases.", "group": "1.1 The Atmosphere: Energy Transfer and Properties"}, {"id": "02", "title": "Conduction, Convection and Radiation", "blurb": "Watch particles carry thermal energy in a pot of water and in the atmosphere.", "group": "1.1 The Atmosphere: Energy Transfer and Properties"}, {"id": "03", "title": "Heat Sinks and Coastal Breezes", "blurb": "Sand vs water in the lab, then see why sea breezes and land breezes form.", "group": "1.1 The Atmosphere: Energy Transfer and Properties"}, {"id": "04", "title": "Layers of the Atmosphere and Air Pressure", "blurb": "Climb from sea level to space: temperature, pressure and density at every altitude.", "group": "1.1 The Atmosphere: Energy Transfer and Properties"}, {"id": "05", "title": "Humidity, Dew Point and Air Pressure", "blurb": "Warm air holds more water vapour. Cool a parcel of air until it hits its dew point.", "group": "1.1 The Atmosphere: Energy Transfer and Properties"}, {"id": "06", "title": "The Water Cycle and Energy", "blurb": "Follow water around the cycle, then see which changes of state absorb energy and which release it.", "group": "1.1 The Atmosphere: Energy Transfer and Properties"}, {"id": "07", "title": "Air Masses of North America", "blurb": "Build an air mass from its source region and see what each one brings to Newfoundland.", "group": "1.2 The Causes of Weather"}, {"id": "08", "title": "High and Low Pressure Systems", "blurb": "Drag a high and a low around the map and watch the wind spiral.", "group": "1.2 The Causes of Weather"}, {"id": "09", "title": "The Coriolis Effect", "blurb": "Draw a straight line on a spinning disk, then launch air across a rotating Earth.", "group": "1.2 The Causes of Weather"}, {"id": "10", "title": "Global Wind Systems", "blurb": "From one big convection cell to trade winds, westerlies and polar easterlies.", "group": "1.2 The Causes of Weather"}, {"id": "11", "title": "Jet Streams", "blurb": "View the polar and subtropical jets from above the North Pole. Where is St. John's?", "group": "1.2 The Causes of Weather"}, {"id": "12", "title": "Weather Fronts", "blurb": "Cold, warm, stationary and occluded fronts in cross-section.", "group": "1.2 The Causes of Weather"}, {"id": "13", "title": "Ocean Surface Currents", "blurb": "Five gyres, the Gulf Stream and the Labrador Current on a world map.", "group": "1.2 The Causes of Weather"}, {"id": "14", "title": "Deep Ocean Currents: The Conveyor Belt", "blurb": "Cold, salty water sinks. Test densities, then follow the great ocean conveyor belt.", "group": "1.2 The Causes of Weather"}, {"id": "15", "title": "El Niño and La Niña", "blurb": "Slide the Pacific between La Niña and El Niño and trace the chain reaction to North America.", "group": "Science Watch · page 38"}, {"id": "16", "title": "Thunderstorms and Tornadoes", "blurb": "Grow a thunderhead, then add wind shear to spin up a tornado.", "group": "1.2 Extreme Weather"}, {"id": "17", "title": "Hurricanes", "blurb": "Warm ocean, falling pressure, Coriolis spin. Feed a storm, then cut its energy supply.", "group": "1.2 Extreme Weather"}, {"id": "18", "title": "Nor'easters and Blizzards", "blurb": "Cold Arctic air meets the Gulf Stream. Then test what makes a snowstorm a blizzard.", "group": "1.2 Extreme Weather"}];
const out=document.getElementById("out");
let groups=[],seen={};
SIMS.forEach(s=>{if(!seen[s.group]){seen[s.group]=[];groups.push(s.group);}seen[s.group].push(s);});
out.innerHTML=groups.map(gname=>{
  const cards=seen[gname].map(s=>{
    const slug=(SLUGS[s.id]||"").trim();
    const inner='<span class="n">'+s.id+'</span><p class="t">'+s.title+'</p><p class="b">'+s.blurb+'</p>';
    return slug
      ? '<a class="card" target="_blank" rel="noopener" href="'+BASE+slug+'">'+inner+'</a>'
      : '<div class="card off">'+inner+'</div>';
  }).join("");
  return '<h2>'+gname+'</h2><div class="grid">'+cards+'</div>';
}).join("");
const missing=SIMS.filter(s=>!(SLUGS[s.id]||"").trim()).length;
document.getElementById("note").textContent = missing
  ? missing+" simulation(s) have no page name set yet, so their cards are greyed out."
  : "";
</script>
</body></html>
