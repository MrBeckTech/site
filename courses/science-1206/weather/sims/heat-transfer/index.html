<script>
/* Twilight Menu theme runtime: shared by every sim. Edit here, then run tools/apply-theme.mjs.
   1) Canvas colour remap: the sims were drawn for a light background. Rather than hand-editing ~400
      colour literals across 18 sims, this rewrites colours as they are assigned to the canvas:
        light, greyish backgrounds -> dark twilight panels (same hue)
        dark, greyish ink/text     -> light ink
        dark saturated accents     -> lightened so they read on dark
        white halos behind labels  -> dark halos
      Mid/bright science colours (warm reds, cold blues, etc.) pass through unchanged.
      Shape-aware: pale colours filling round shapes (clouds, snow, droplets) stay pale; pale boxes go dark.
      Per-sim control: <meta name="tw-white" content="panel"> darkens everything pale regardless of shape;
      content="keep" never touches pure white. <meta name="tw-map" content="old=new; old=new"> forces exact colours.
      <meta name="tw-canvas" content="off"> turns the remap off: for new sims drawn in theme colours.
   2) Title card: reads <meta name="tw-titlecard" content="LINE 1|LINE 2|LINE 3">. Shown once per tab session.
   NEW sims should use the theme colours directly; the remap is there to convert the existing ones. */
(function(){
  const meta=n=>{const m=document.querySelector(`meta[name="${n}"]`);return m?m.content:null;};
  // tw-white: "auto" (default) | "panel" (dark-mode everything) | "keep" (never touch white)
  const whiteMode=meta('tw-white')||'auto';
  const cache=new Map();
  // Per-sim exact overrides: <meta name="tw-map" content="rgba(255,255,255,.92)=#241845; #e3e9f1=#3a2c5c">
  const norm=c=>String(c).toLowerCase().replace(/\s+/g,'');
  const overrides=new Map((meta('tw-map')||'').split(';').map(x=>x.split('=').map(y=>y.trim())).filter(x=>x.length===2&&x[0]).map(([a,b])=>[norm(a),b]));
  function parse(c){
    if(typeof c!=='string')return null; c=c.trim().toLowerCase();
    let m;
    if(c[0]==='#'){let h=c.slice(1);if(h.length===3||h.length===4)h=[...h].map(x=>x+x).join('');
      if(h.length!==6&&h.length!==8)return null;
      return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16),h.length===8?parseInt(h.slice(6,8),16)/255:1];}
    if((m=c.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*(?:,\s*([\d.]+)\s*)?\)$/)))
      return [+m[1],+m[2],+m[3],m[4]==null?1:+m[4]];
    if(c==='white')return [255,255,255,1];
    if(c==='black')return [0,0,0,1];
    return null;
  }
  function toHsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;
    if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);
      h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h/=6;}
    return [h,s,l];}
  function hsl(h,s,l,a){const f=n=>{const k=(n+h*12)%12,q=s*Math.min(l,1-l);return Math.round(255*(l-q*Math.max(-1,Math.min(k-3,9-k,1))));};
    return `rgba(${f(0)},${f(8)},${f(4)},${a})`;}
  const isWhite=p=>p&&p[0]>=250&&p[1]>=250&&p[2]>=250;
  const chromaOf=p=>(Math.max(p[0],p[1],p[2])-Math.min(p[0],p[1],p[2]))/255;
  // "pale" = white or a washed-out tint: these are the colours that are either backgrounds or clouds/snow
  function isPale(c){const p=parse(c);if(!p)return false;if(isWhite(p))return true;const l=toHsl(p[0],p[1],p[2])[2];return l>=.72&&chromaOf(p)<.4;}
  function remap(c,kind){
    if(overrides.has(norm(c)))return overrides.get(norm(c));
    const key=kind+c; if(cache.has(key))return cache.get(key);
    const p=parse(c); let out=c;
    if(p){const [r,g,b,a]=p,[h,s,l]=toHsl(r,g,b);
      const chroma=chromaOf(p);
      const TH=.73;                                        // theme hue (twilight purple)
      if(isWhite(p)){
        if(whiteMode==='keep') out=c;
        else if(a<1) out=`rgba(22,13,43,${a})`;           // label halos (strokes) / veils over backgrounds
        else out=kind==='stroke'?c:'#241845';               // white panels -> dark; white outlines stay
      }
      else if(l>=.72&&chroma<.4) out=chroma<.05                                         // pale backgrounds, grid lines
        ? hsl(TH,.3,.09+(1-l)*.95,a) : hsl(h,Math.min(s,.32),.1+(1-l)*.95,a);
      else if(l<.5&&chroma<.3) out=chroma<.12                                           // ink, labels, grey strokes
        ? hsl(TH,.3,Math.min(.93,1.02-l*.8),a) : hsl(h,.35,Math.min(.9,1-l*.7),a);
      else if(l<.47) out=hsl(h,s,Math.min(.78,Math.max(.66,l+.25)),a);                 // dark accents -> lighter
    }
    cache.set(key,out); return out;
  }
  const C2=meta('tw-canvas')!=='off'&&window.CanvasRenderingContext2D&&CanvasRenderingContext2D.prototype;
  if(C2){
    const ORIG='__twFill', STACK='__twStack';
    const fd=Object.getOwnPropertyDescriptor(C2,'fillStyle');
    Object.defineProperty(C2,'fillStyle',{configurable:true,enumerable:fd.enumerable,get:fd.get,
      set(v){this[ORIG]=v;fd.set.call(this,typeof v==='string'?remap(v,'fill'):v);}});
    ['strokeStyle','shadowColor'].forEach(k=>{
      const d=Object.getOwnPropertyDescriptor(C2,k); if(!d||!d.set)return;
      Object.defineProperty(C2,k,{configurable:true,enumerable:d.enumerable,get:d.get,set(v){d.set.call(this,typeof v==='string'?remap(v,'stroke'):v);}});
    });
    // keep the remembered original fill colour in step with save()/restore()
    const sv=C2.save,rs=C2.restore;
    C2.save=function(){(this[STACK]||(this[STACK]=[])).push(this[ORIG]);return sv.call(this);};
    C2.restore=function(){if(this[STACK]&&this[STACK].length)this[ORIG]=this[STACK].pop();return rs.call(this);};
    // Shape awareness: round things (paths made only of arc/ellipse: clouds, snow, droplets, particles) keep their
    // pale colour; boxy things (rects, lines, rounded rects: panels, cards, backgrounds) go dark.
    const bp=C2.beginPath; C2.beginPath=function(){this.__twArc=false;this.__twBox=false;return bp.call(this);};
    ['arc','ellipse'].forEach(k=>{const f=C2[k];if(f)C2[k]=function(...a){this.__twArc=true;return f.apply(this,a);};});
    ['lineTo','rect','roundRect','arcTo','bezierCurveTo','quadraticCurveTo'].forEach(k=>{const f=C2[k];if(f)C2[k]=function(...a){this.__twBox=true;return f.apply(this,a);};});
    const fill=C2.fill;
    C2.fill=function(...a){
      const o=this[ORIG];
      if(whiteMode!=='panel'&&!(a[0]&&typeof a[0]==='object')&&this.__twArc&&!this.__twBox&&typeof o==='string'&&isPale(o)&&!overrides.has(norm(o))){
        const cur=fd.get.call(this); fd.set.call(this,o); const r=fill.apply(this,a); fd.set.call(this,cur); return r;}
      return fill.apply(this,a);
    };
    const fr=C2.fillRect;  // tiny white squares are snow/stars, not panels
    C2.fillRect=function(x,y,w,h){const o=this[ORIG];
      if(whiteMode!=='panel'&&Math.abs(w*h)<=36&&typeof o==='string'&&isPale(o)){const cur=fd.get.call(this);fd.set.call(this,o);const r=fr.call(this,x,y,w,h);fd.set.call(this,cur);return r;}
      return fr.call(this,x,y,w,h);};
    const G=window.CanvasGradient&&CanvasGradient.prototype;
    if(G){const add=G.addColorStop;G.addColorStop=function(o,c){return add.call(this,o,remap(c,'fill'));};}
  }
  window.twilightRemap=remap;

  /* World Map button: back to the site's landing page, above the sim */
  const addBack=()=>{if(document.querySelector('.tw-back'))return;
    const w=document.createElement('div');w.className='tw-back-wrap';
    w.innerHTML='<a class="tw-back" href="https://mrbecktech.github.io/site/">&#9664; WORLD MAP</a>';
    const app=document.getElementById('app');app?app.before(w):document.body.prepend(w);};
  document.readyState==='loading'?document.addEventListener('DOMContentLoaded',addBack):addBack();

  /* title card */
  const tc=meta('tw-titlecard');
  if(tc){let seen=false;try{seen=sessionStorage.getItem('tw-card:'+location.pathname+tc)==='1';}catch(e){}
    if(!seen&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
      const show=()=>{const el=document.createElement('div');el.className='tw-card';el.setAttribute('role','presentation');
        const [a,b,c]=tc.split('|');el.innerHTML=`<div class="l1"></div><div class="l2"></div><div class="l3"></div><div class="skip">click to skip</div>`;
        el.querySelector('.l1').textContent=a||'';el.querySelector('.l2').textContent=b||'';el.querySelector('.l3').textContent=c||'';
        document.body.appendChild(el);
        const close=()=>{el.classList.add('out');setTimeout(()=>el.remove(),500);};
        el.addEventListener('click',close);setTimeout(close,2200);
        try{sessionStorage.setItem('tw-card:'+location.pathname+tc,'1');}catch(e){}};
      document.readyState==='loading'?document.addEventListener('DOMContentLoaded',show):show();}}
})();
</script>
<!--twilight:end-->

<script>/* Shared helpers for the Science 1206 Weather Dynamics simulations. Self-contained: no external libraries. */
(function(){
'use strict';
const NS='http://www.w3.org/2000/svg', G=window;
G.TAU=Math.PI*2;
G.clamp=(v,a,b)=>v<a?a:v>b?b:v;
G.lerp=(a,b,t)=>a+(b-a)*t;

Sim({

  tag:'Section 1.1 · Figures 1.6 and 1.7',
  lead:'Thermal energy moves three ways. Watch the particles to see how each one works, in a pot of water and in the atmosphere.',
  source:'Based on Science 1206, Chapter 1, pp. 16–17 (thermal energy transfer).',
  alt:'Particle simulation of conduction, convection and radiation in a pot of water on a stove and in Earth’s atmosphere.',
  tabs:[['pot','Pot on a stove'],['air','In the atmosphere']],
  notice:[
    '<b>Conduction</b> happens only where particles touch: hot particles at the bottom collide with cooler ones and pass energy along.',
    '<b>Convection</b> starts when heated particles spread out, become less dense and rise. Cooler, denser fluid sinks to take their place, so a loop forms.',
    '<b>Radiation</b> needs no particles at all. Waves carry energy through empty space.',
    'In the atmosphere tab, turn greenhouse gases to 0%. The ground still warms, but the air above it warms much less, because the air is not good at absorbing visible light.'],
  terms:[
    ['Conduction','Thermal energy transfer between two objects or substances in direct contact.'],
    ['Convection','Thermal energy transfer by the movement of heated material from one place to another.'],
    ['Radiation','Thermal energy transfer in which atoms or molecules give off energy as electromagnetic waves.'],
    ['Heat','Thermal energy that is transferred from one object to another.']],
  questions:[
    ['Explain how conduction, convection and radiation transfer thermal energy when a pot of water is heated on a stove.','Conduction: the hot burner and pot bottom pass energy to the water particles touching them. Convection: the heated water expands, rises, cools at the top and sinks, forming currents. Radiation: the hot pot and burner give off infrared waves that warm the air and your hand nearby.'],
    ['Which method of energy transfer is most responsible for heating the air near Earth’s surface? Why?','Radiation. Sunlight passes through the air and warms the ground. The ground gives off longer-wave infrared, and greenhouse gases in the air absorb it. That absorption is the major source of thermal energy for the air near the surface.'],
    ['Why does warm air rise?','Warmer particles move faster and spread farther apart, so warm air is less dense than the cooler air around it. Less-dense fluids rise and denser fluids fall.']],
  init(ctx){

    const ps=[];let irs=[],flashes=[];
    const reg=()=>ctx.tab==='pot'?pots:air, R=()=>ctx.tab==='pot'?5.5:6.5;

      for(let i=0;i<n;i++)ps.push({x:rand(r.x0+6,r.x1-6),y:rand(r.y0+6,r.y1-6),vx:rand(-20,20),vy:rand(-20,20),T:.12,ghg:Math.random()<ghgFrac});irs=[];flashes=[];Tg=.1;}
    const rows=Readout([['a','Average temperature'],['b','Near the bottom / ground'],['t','Near the top']]);

    potCtl.append(Slider({label:'Burner power',min:0,max:1,step:.05,value:.7,fmt:v=>Math.round(v*100),unit:' %',onInput:v=>power=v}),
      Seg({label:'Highlight',value:'all',options:[['all','All three'],['cond','Conduction'],['conv','Convection'],['rad','Radiation']],onChange:v=>focus=v}));
    airCtl.append(Slider({label:'Sunlight',min:0,max:1,step:.05,value:.7,fmt:v=>Math.round(v*100),unit:' %',onInput:v=>sun=v}),
      Slider({label:'Greenhouse gases',min:0,max:1,step:.05,value:.6,fmt:v=>Math.round(v*100),unit:' %',hint:'Share of air particles that absorb infrared (ringed)',onInput:v=>{ghgFrac=v;ps.forEach(p=>p.ghg=Math.random()<ghgFrac);}}),

      const conv=(t)=>pot?(20+80*t).toFixed(0)+' °C':(-10+40*t).toFixed(0)+' °C';

    function particle(p,rad,t){g.beginPath();g.arc(p.x,p.y,rad,0,TAU);g.fillStyle=heat(p.T);g.fill();g.lineWidth=p.flash>0?3:1.2;g.strokeStyle=p.ghg&&ctx.tab==='air'?'#5a3a9a':'rgba(20,32,46,.55)';if(p.ghg&&ctx.tab==='air'){g.lineWidth=2.4;}g.stroke();}
    function drawPot(t,m){

      g.fillStyle='#d9d0c1';g.fillRect(0,430,800,70);

      if(ra){for(let i=0;i<3;i++){const y=250+i*46,ph=-t*8;wavy(g,232,y,120-i*10,y-10,{color:'#c8321f',w:3,amp:5,wl:16,phase:ph,alpha:ra*.9});wavy(g,568,y,680+i*10,y-10,{color:'#c8321f',w:3,amp:5,wl:16,phase:ph,alpha:ra*.9});}
        wavy(g,300,150,300,90,{color:'#c8321f',w:3,amp:5,wl:16,phase:-t*8,alpha:ra*.8});wavy(g,500,150,500,90,{color:'#c8321f',w:3,amp:5,wl:16,phase:-t*8,alpha:ra*.8});}
      /* burner */
      const bg=g.createLinearGradient(0,404,0,432);bg.addColorStop(0,heat(.6+.4*pw));bg.addColorStop(1,'#5a3a2a');
      g.fillStyle='#3a3a3f';rr(g,196,404,408,34,8);g.fill();g.fillStyle=bg;g.globalAlpha=.25+.75*pw;rr(g,208,410,384,18,6);g.fill();g.globalAlpha=1;
      /* pot */
      g.fillStyle='#8d97a3';rr(g,226,168,348,238,14);g.fill();
      g.fillStyle='#78838f';g.fillRect(200,215,26,14);g.fillRect(574,215,26,14);
      g.fillStyle='#e8f2fa';g.fillRect(pots.x0,pots.y0-18,pots.x1-pots.x0,pots.y1-pots.y0+18);
      /* water */
      g.fillStyle='rgba(120,175,225,.35)';g.fillRect(pots.x0,pots.y0,pots.x1-pots.x0,pots.y1-pots.y0);
      /* pot base atoms (conduction highlight) */
      const ca=dim('cond');
      for(let i=0;i<14;i++){const x=pots.x0+12+i*22.5+Math.sin(t*20+i)*pw*2.2,y=396+Math.cos(t*23+i*2)*pw*2;g.beginPath();g.arc(x,y,7,0,TAU);g.fillStyle=heat(.4+.6*pw);g.globalAlpha=ca;g.fill();g.globalAlpha=1;}
      g.save();g.beginPath();g.rect(pots.x0,pots.y0,pots.x1-pots.x0,pots.y1-pots.y0);g.clip();
      g.globalAlpha=Math.max(.3,dim('conv')*.0+ (focus==='all'||focus==='conv'?1:.55));ps.forEach(p=>particle(p,5.5,t));g.globalAlpha=1;g.restore();
      /* annotations */
      if(focus==='all'||focus==='cond'){for(let i=0;i<4;i++){const x=300+i*66;arrow(g,x,388,x,352,{color:'#8a2be2',w:3.5,alpha:ca*(.6+.4*Math.sin(t*4+i))});}
        txt(g,'CONDUCTION',400,436,{size:16,align:'center',color:'#5b1fa8'});
        txt(g,'contact: particles collide and pass energy on',400,456,{size:14,align:'center',color:'#5b1fa8',weight:500});}
      if(focus==='all'||focus==='conv'){const a=dim('conv');
        g.save();g.globalAlpha=a;g.lineWidth=5;g.lineCap='round';
        arrow(g,400,350,400,222,{color:'#d43a26',w:5,alpha:.85});arrow(g,258,240,258,340,{color:'#2a78d6',w:5,alpha:.85});arrow(g,542,240,542,340,{color:'#2a78d6',w:5,alpha:.85});
        g.restore();txt(g,'CONVECTION',690,372,{size:16,align:'center',color:'#a3210f'});txt(g,'hot water rises,\ncool water sinks',690,392,{size:13,align:'center',color:'#a3210f',weight:500});arrow(g,640,362,590,330,{color:'#a3210f',w:2.5,alpha:a});}
      if(focus==='all'||focus==='rad'){txt(g,'RADIATION',100,232,{size:16,align:'center',color:'#a3210f'});txt(g,'waves need no contact',100,250,{size:13,align:'center',color:'#a3210f',weight:500});}
      /* steam */
      const topT=Math.max(0,m.mean-.35);
      g.strokeStyle='rgba(120,130,140,'+Math.min(.5,topT)+')';g.lineWidth=5;g.lineCap='round';
      for(let i=0;i<5;i++){const x=290+i*55;g.beginPath();for(let y=0;y<50;y+=4)g.lineTo(x+Math.sin(y/9+t*2+i)*6,166-y);g.stroke();}
    }
    const pill=(str,x,y,col,size)=>{size=size||14;g.font='700 '+size+'px system-ui,sans-serif';
      const w=g.measureText(str).width+16;g.fillStyle='rgba(255,255,255,.93)';rr(g,x-8,y-size-4,w,size+12,7);g.fill();
      g.strokeStyle='rgba(214,223,234,.9)';g.lineWidth=1;g.stroke();txt(g,str,x,y,{size:size,color:col,weight:700,halo:false});};
    function drawAir(t,m){
      const r=air,sk=g.createLinearGradient(0,0,0,400);sk.addColorStop(0,'#5d8fce');sk.addColorStop(1,'#c9e2f5');g.fillStyle=sk;g.fillRect(0,0,800,400);
      const gt=heat(.25+.6*Tg);g.fillStyle=gt;g.fillRect(0,400,800,100);
      g.fillStyle='rgba(60,40,20,.12)';for(let i=0;i<50;i++)g.fillRect((i*67)%800,410+(i*29)%80,20,3);
      pill('Ground '+(-10+40*Tg).toFixed(0)+' °C',18,472,'#3a2410',15);
      /* sun + shortwave */
      const sx=680,sy=32;const sg=g.createRadialGradient(sx,sy,3,sx,sy,44);sg.addColorStop(0,'#fff6b0');sg.addColorStop(.4,'#ffd23a');sg.addColorStop(1,'rgba(255,210,58,0)');g.fillStyle=sg;g.beginPath();g.arc(sx,sy,44,0,TAU);g.fill();
      const sa=dim('rad')*Math.max(.15,sun);
      if(sun>.02)for(let i=0;i<7;i++){const x0=560+i*40,ph=(t*140+i*60)%340;g.strokeStyle='rgba(110,60,0,'+sa*.5+')';g.lineWidth=5;g.lineCap='round';
        const yy=60+ph;g.beginPath();g.moveTo(x0-yy*.18,yy-14);g.lineTo(x0-yy*.18-(-.18*14),yy);g.stroke();g.strokeStyle='rgba(255,194,26,'+sa+')';g.lineWidth=3;g.beginPath();g.moveTo(x0-yy*.18,yy-14);g.lineTo(x0-yy*.18+2.5,yy);g.stroke();}
      /* IR */
      for(const q of irs)wavy(g,q.x,q.y+10,q.x,q.y-12,{color:'#c8321f',w:2.6,amp:4,wl:9,phase:t*12,alpha:dim('rad')});
      g.save();g.globalAlpha=Math.max(.35,focus==='all'||focus==='conv'||focus==='cond'?1:.6);ps.forEach(p=>particle(p,6.5,t));g.restore();
      if(focus==='all'||focus==='cond'){pill('CONDUCTION: air touching the warm ground is heated by collisions',18,392,'#5b1fa8');}
      if(focus==='all'||focus==='conv'){arrow(g,120,330,120,140,{color:'#d43a26',w:8,head:22,alpha:.95});arrow(g,268,140,268,330,{color:'#2a78d6',w:8,head:22,alpha:.95});pill('CONVECTION: warm air rises, cool air sinks',18,120,'#a3210f');}
      if(focus==='all'||focus==='rad'){pill('RADIATION: sunlight warms the ground; greenhouse particles (ringed) absorb its infrared',18,44,'#0d2a52');}
    }
    ctx.setCaption('<b>Each circle is a particle</b> (blue = cool, orange/red = hot). Try the highlight buttons to isolate one method.');
    ctx.loop(()=>{const t=ctx.tab;if(t==='pot')note.say('Convection loop','Watch hot particles near the bottom rise in the middle while cooled particles sink at the sides.');
      else note.say(ghgFrac<.05?'No greenhouse gases':'Two ways the air is heated',ghgFrac<.05?'Sunlight warms the ground, but infrared escapes without warming the air. Only conduction near the ground heats the air.':'Air touching the ground is heated by conduction. Infrared from the ground is absorbed by ringed greenhouse-gas particles, which warms the air higher up too.',ghgFrac<.05?'warm':'');});
  }
});
