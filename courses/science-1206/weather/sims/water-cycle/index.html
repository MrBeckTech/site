<script>
/* Twilight Menu theme runtime: shared by every sim. Edit here, then run tools/apply-theme.mjs.
   1) Canvas colour remap: the sims were drawn for a light background. Rather than hand-editing ~400
      colour literals across 18 sims, this rewrites colours as they are assigned to the canvas:
        light, greyish backgrounds -> dark twilight panels (same hue)
        dark, greyish ink/text     -> light ink
        dark saturated accents     -> lightened so they read on dark
        white halos behind labels  -> dark halos
      Mid/bright science colours (warm reds, cold blues, etc.) pass through unchanged.
      Shape-aware: pale colours filling round shapes (clouds, snow, droplets) stay pale; pale boxes go dark.
      Per-sim control: <meta name="tw-white" content="panel"> darkens everything pale regardless of shape;
      content="keep" never touches pure white. <meta name="tw-map" content="old=new; old=new"> forces exact colours.
   2) Title card: reads <meta name="tw-titlecard" content="LINE 1|LINE 2|LINE 3">. Shown once per tab session.
   NEW sims should use the theme colours directly; the remap is there to convert the existing ones. */
(function(){
  const meta=n=>{const m=document.querySelector(`meta[name="${n}"]`);return m?m.content:null;};
  // tw-white: "auto" (default) | "panel" (dark-mode everything) | "keep" (never touch white)
  const whiteMode=meta('tw-white')||'auto';
  const cache=new Map();
  // Per-sim exact overrides: <meta name="tw-map" content="rgba(255,255,255,.92)=#241845; #e3e9f1=#3a2c5c">
  const norm=c=>String(c).toLowerCase().replace(/\s+/g,'');
  const overrides=new Map((meta('tw-map')||'').split(';').map(x=>x.split('=').map(y=>y.trim())).filter(x=>x.length===2&&x[0]).map(([a,b])=>[norm(a),b]));
  function parse(c){
    if(typeof c!=='string')return null; c=c.trim().toLowerCase();
    let m;
    if(c[0]==='#'){let h=c.slice(1);if(h.length===3||h.length===4)h=[...h].map(x=>x+x).join('');
      if(h.length!==6&&h.length!==8)return null;
      return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16),h.length===8?parseInt(h.slice(6,8),16)/255:1];}
    if((m=c.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*(?:,\s*([\d.]+)\s*)?\)$/)))
      return [+m[1],+m[2],+m[3],m[4]==null?1:+m[4]];
    if(c==='white')return [255,255,255,1];
    if(c==='black')return [0,0,0,1];
    return null;
  }
  function toHsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;
    if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);
      h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h/=6;}
    return [h,s,l];}
  function hsl(h,s,l,a){const f=n=>{const k=(n+h*12)%12,q=s*Math.min(l,1-l);return Math.round(255*(l-q*Math.max(-1,Math.min(k-3,9-k,1))));};
    return `rgba(${f(0)},${f(8)},${f(4)},${a})`;}
  const isWhite=p=>p&&p[0]>=250&&p[1]>=250&&p[2]>=250;
  const chromaOf=p=>(Math.max(p[0],p[1],p[2])-Math.min(p[0],p[1],p[2]))/255;
  // "pale" = white or a washed-out tint: these are the colours that are either backgrounds or clouds/snow
  function isPale(c){const p=parse(c);if(!p)return false;if(isWhite(p))return true;const l=toHsl(p[0],p[1],p[2])[2];return l>=.72&&chromaOf(p)<.4;}
  function remap(c,kind){
    if(overrides.has(norm(c)))return overrides.get(norm(c));
    const key=kind+c; if(cache.has(key))return cache.get(key);
    const p=parse(c); let out=c;
    if(p){const [r,g,b,a]=p,[h,s,l]=toHsl(r,g,b);
      const chroma=chromaOf(p);
      const TH=.73;                                        // theme hue (twilight purple)
      if(isWhite(p)){
        if(whiteMode==='keep') out=c;
        else if(a<1) out=`rgba(22,13,43,${a})`;           // label halos (strokes) / veils over backgrounds
        else out=kind==='stroke'?c:'#241845';               // white panels -> dark; white outlines stay
      }
      else if(l>=.72&&chroma<.4) out=chroma<.05                                         // pale backgrounds, grid lines
        ? hsl(TH,.3,.09+(1-l)*.95,a) : hsl(h,Math.min(s,.32),.1+(1-l)*.95,a);
      else if(l<.5&&chroma<.3) out=chroma<.12                                           // ink, labels, grey strokes
        ? hsl(TH,.3,Math.min(.93,1.02-l*.8),a) : hsl(h,.35,Math.min(.9,1-l*.7),a);
      else if(l<.47) out=hsl(h,s,Math.min(.78,Math.max(.66,l+.25)),a);                 // dark accents -> lighter
    }
    cache.set(key,out); return out;
  }
  const C2=window.CanvasRenderingContext2D&&CanvasRenderingContext2D.prototype;
  if(C2){
    const ORIG='__twFill', STACK='__twStack';
    const fd=Object.getOwnPropertyDescriptor(C2,'fillStyle');
    Object.defineProperty(C2,'fillStyle',{configurable:true,enumerable:fd.enumerable,get:fd.get,
      set(v){this[ORIG]=v;fd.set.call(this,typeof v==='string'?remap(v,'fill'):v);}});
    ['strokeStyle','shadowColor'].forEach(k=>{
      const d=Object.getOwnPropertyDescriptor(C2,k); if(!d||!d.set)return;
      Object.defineProperty(C2,k,{configurable:true,enumerable:d.enumerable,get:d.get,set(v){d.set.call(this,typeof v==='string'?remap(v,'stroke'):v);}});
    });
    // keep the remembered original fill colour in step with save()/restore()
    const sv=C2.save,rs=C2.restore;
    C2.save=function(){(this[STACK]||(this[STACK]=[])).push(this[ORIG]);return sv.call(this);};
    C2.restore=function(){if(this[STACK]&&this[STACK].length)this[ORIG]=this[STACK].pop();return rs.call(this);};
    // Shape awareness: round things (paths made only of arc/ellipse: clouds, snow, droplets, particles) keep their
    // pale colour; boxy things (rects, lines, rounded rects: panels, cards, backgrounds) go dark.
    const bp=C2.beginPath; C2.beginPath=function(){this.__twArc=false;this.__twBox=false;return bp.call(this);};
    ['arc','ellipse'].forEach(k=>{const f=C2[k];if(f)C2[k]=function(...a){this.__twArc=true;return f.apply(this,a);};});
    ['lineTo','rect','roundRect','arcTo','bezierCurveTo','quadraticCurveTo'].forEach(k=>{const f=C2[k];if(f)C2[k]=function(...a){this.__twBox=true;return f.apply(this,a);};});
    const fill=C2.fill;
    C2.fill=function(...a){
      const o=this[ORIG];
      if(whiteMode!=='panel'&&!(a[0]&&typeof a[0]==='object')&&this.__twArc&&!this.__twBox&&typeof o==='string'&&isPale(o)&&!overrides.has(norm(o))){
        const cur=fd.get.call(this); fd.set.call(this,o); const r=fill.apply(this,a); fd.set.call(this,cur); return r;}
      return fill.apply(this,a);
    };
    const fr=C2.fillRect;  // tiny white squares are snow/stars, not panels
    C2.fillRect=function(x,y,w,h){const o=this[ORIG];
      if(whiteMode!=='panel'&&Math.abs(w*h)<=36&&typeof o==='string'&&isPale(o)){const cur=fd.get.call(this);fd.set.call(this,o);const r=fr.call(this,x,y,w,h);fd.set.call(this,cur);return r;}
      return fr.call(this,x,y,w,h);};
    const G=window.CanvasGradient&&CanvasGradient.prototype;
    if(G){const add=G.addColorStop;G.addColorStop=function(o,c){return add.call(this,o,remap(c,'fill'));};}
  }
  window.twilightRemap=remap;

  /* World Map button: back to the site's landing page, above the sim */
  const addBack=()=>{if(document.querySelector('.tw-back'))return;
    const w=document.createElement('div');w.className='tw-back-wrap';
    w.innerHTML='<a class="tw-back" href="https://mrbecktech.github.io/site/">&#9664; WORLD MAP</a>';
    const app=document.getElementById('app');app?app.before(w):document.body.prepend(w);};
  document.readyState==='loading'?document.addEventListener('DOMContentLoaded',addBack):addBack();

  /* title card */
  const tc=meta('tw-titlecard');
  if(tc){let seen=false;try{seen=sessionStorage.getItem('tw-card:'+location.pathname+tc)==='1';}catch(e){}
    if(!seen&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
      const show=()=>{const el=document.createElement('div');el.className='tw-card';el.setAttribute('role','presentation');
        const [a,b,c]=tc.split('|');el.innerHTML=`<div class="l1"></div><div class="l2"></div><div class="l3"></div><div class="skip">click to skip</div>`;
        el.querySelector('.l1').textContent=a||'';el.querySelector('.l2').textContent=b||'';el.querySelector('.l3').textContent=c||'';
        document.body.appendChild(el);
        const close=()=>{el.classList.add('out');setTimeout(()=>el.remove(),500);};
        el.addEventListener('click',close);setTimeout(close,2200);
        try{sessionStorage.setItem('tw-card:'+location.pathname+tc,'1');}catch(e){}};
      document.readyState==='loading'?document.addEventListener('DOMContentLoaded',show):show();}}
})();
</script>
<!--twilight:end-->

<script>/* Shared helpers for the Science 1206 Weather Dynamics simulations. Self-contained: no external libraries. */
(function(){
'use strict';
const NS='http://www.w3.org/2000/svg', G=window;
G.TAU=Math.PI*2;
G.clamp=(v,a,b)=>v<a?a:v>b?b:v;
G.lerp=(a,b,t)=>a+(b-a)*t;
G.rand=(a,b)=>a+Math.random()*(b-a);
G.$=(s,r)=>(r||document).querySelector(s);
G.smooth=(t)=>{t=clamp(t,0,1);return t*t*(3-2*t);};

function setAttrs(e,a){

Sim({
  title:'The Water Cycle and Energy',
  tag:'Section 1.1 · Figure 1.10 · Activity 1-1D',
  lead:'Water never leaves the planet: it keeps changing state and changing address. Follow it around the cycle, then see where thermal energy is absorbed and where it is released.',
  source:'Based on Science 1206, Chapter 1, pp. 21–22 (the role of water in transferring energy, Figure 1.10, Activity 1-1D). The landscape is schematic; the changes of state and the direction of energy transfer are the textbook’s.',
  alt:'A landscape showing evaporation from the ocean, cloud formation, precipitation, snow and ice, run-off and ground water, with numbered parts you can click, and a second view of the six changes of state between solid water, liquid water and water vapour showing which absorb and which release thermal energy.',
  tabs:[['cycle','The cycle'],['energy','Energy and changes of state']],
  notice:[
    '<b>A closed loop.</b> The total amount of water on Earth never changes. It just moves between the ocean, the air, the land and the ice, changing state as it goes.',
    '<b>Energy moves with it.</b> Evaporation <b>absorbs</b> thermal energy from the ocean and the air. When the vapour condenses, often hundreds of kilometres away, that energy is <b>released</b>. That is how the water cycle carries energy around the world.',
    '<b>Evaporative cooling.</b> Escaping molecules take energy with them, so the water left behind cools. This is one reason the ocean’s temperature stays so steady.',
    'Try a <b>cold day</b>. Less evaporation, and precipitation falls as snow instead of rain.',
    'On the second tab, the arrows pointing <b>right</b> (top row) absorb energy and the arrows pointing <b>left</b> (bottom row) release it. Sublimation and deposition are the pair the textbook diagram leaves out.'],
  terms:[
    ['Water cycle','The continuous circulation of water between the hydrosphere and the atmosphere by evaporation and condensation. It moves both water and thermal energy.'],
    ['Evaporation','Liquid water becoming water vapour. It absorbs thermal energy.'],
    ['Condensation','Water vapour becoming liquid water. It releases thermal energy.'],
    ['Sublimation','Ice becoming water vapour without melting first. It absorbs thermal energy.'],
    ['Deposition','Water vapour becoming ice without becoming liquid first. It releases thermal energy. Frost forms this way.'],
    ['Evaporative cooling','The cooling of the water left behind when the most energetic molecules escape as vapour.']],
  questions:[
    ['Name the changes of state that absorb thermal energy, and the ones that release it.','Absorb: melting, evaporation and sublimation. Release: freezing, condensation and deposition.'],
    ['How does the water cycle transfer thermal energy from one place to another?','Evaporation absorbs energy where the water starts. The vapour can travel a great distance before it condenses, and condensation releases that energy into the surroundings at the new location.'],
    ['Water has a low albedo and a high specific heat capacity. Why does that keep the ocean’s temperature steady?','A low albedo means it absorbs about 95 % of the sunlight that reaches it, and a high specific heat capacity means a large amount of energy changes its temperature only slightly. Evaporative cooling also carries energy away.'],
    ['The textbook says one change of state is missing from Figure 1.10. Which change is it, and what does it do with energy?','The direct change between ice and water vapour. It is really a pair: sublimation (ice to vapour) absorbs energy, and deposition (vapour to ice) releases it.']],
  init(ctx){
    const C=ctx.canvas(800,500),g=C.g;
    const hash=(i)=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
    let warm=true,speed=1,nums=true,pick=null,clock=0,hover=null;
    let epick=null,ehover=null;

    /* ---------------- controls ---------------- */
    const sDay=Seg({label:'Kind of day',value:'w',options:[['w','Warm day'],['c','Cold day']],onChange:v=>{warm=v==='w';upd();}});
    const sSp=Slider({label:'Speed',min:.25,max:2,step:.25,value:1,fmt:v=>'×'+v.toFixed(2),onInput:v=>{speed=v;}});
    const cN=Check({label:'Show the numbers',value:true,onChange:v=>{nums=v;}});
    ctx.panel(['cycle']).append(sDay,sSp,cN);

    const PARTS=[
      {id:1,n:'Sun',x:118,y:78,r:42,
       body:'Energy from the Sun drives the whole cycle. It warms the ocean and the land, and it supplies the energy that liquid water needs in order to evaporate.'},
      {id:2,n:'Evaporation',x:300,y:352,r:46,
       body:'Liquid water at the ocean surface absorbs energy and becomes invisible water vapour. The molecules that escape carry energy away, so the water left behind cools. This is <b>evaporative cooling</b>.'},
      {id:3,n:'Cloud',x:432,y:150,r:56,
       body:'As the vapour rises it cools. Below its dew point it <b>condenses</b> onto tiny particles and forms cloud droplets. Condensation <b>releases</b> the energy the water absorbed when it evaporated, often far from where it started.'},
      {id:4,n:'Precipitation',x:560,y:250,r:44,
       body:'When the droplets grow heavy enough they fall as rain, or as snow and hail if the air is cold enough. This returns water to the land and the ocean.'},
      {id:5,n:'Snow and ice',x:672,y:206,r:46,
       body:'On high ground and in winter, water is stored as snow and ice. Melting <b>absorbs</b> energy; freezing <b>releases</b> it. Ice can also turn straight to vapour by <b>sublimation</b>.'},
      {id:6,n:'Run-off',x:612,y:372,r:40,
       body:'Water that does not soak in runs downhill over the surface, into brooks and rivers, and back to the sea. It carries no change of state, only water.'},
      {id:7,n:'Ground water',x:404,y:446,r:44,
       body:'Some water soaks into the soil and rock and moves slowly underground. It can be stored for years before it seeps back into rivers, ponds or the sea.'},
      {id:8,n:'Ocean',x:150,y:420,r:52,
       body:'The ocean holds most of Earth’s water. Because water has a low albedo it absorbs about 95 % of the sunlight reaching it, and its high specific heat capacity means it warms and cools slowly.'}];

    const eList=[
      {id:'melt',n:'Melting',from:'Solid',to:'Liquid',dir:1,body:'Ice becomes liquid water. Energy is <b>absorbed</b> to break the molecules out of their fixed positions.'},
      {id:'freeze',n:'Freezing',from:'Liquid',to:'Solid',dir:-1,body:'Liquid water becomes ice. Energy is <b>released</b> into the surroundings as the molecules lock into place.'},
      {id:'evap',n:'Evaporation',from:'Liquid',to:'Vapour',dir:1,body:'Liquid water becomes vapour. A large amount of energy is <b>absorbed</b> to pull the molecules apart from one another.'},
      {id:'cond',n:'Condensation',from:'Vapour',to:'Liquid',dir:-1,body:'Vapour becomes liquid water. That large amount of energy is <b>released</b> again. This is what powers clouds and storms.'},
      {id:'subl',n:'Sublimation',from:'Solid',to:'Vapour',dir:1,body:'Ice becomes vapour without melting first. Energy is <b>absorbed</b>. This is the change missing from Figure 1.10.'},
      {id:'depo',n:'Deposition',from:'Vapour',to:'Solid',dir:-1,body:'Vapour becomes ice without becoming liquid first. Energy is <b>released</b>. Frost on a cold window forms this way.'}];
    const eBtns=eList.map(e=>Btn(e.n,()=>{epick=e.id;upd();},'wide'));
    ctx.panel(['energy']).append(...eBtns);

    const roC=Readout([['a','Kind of day'],['b','Evaporation'],['c','Precipitation falls as'],['d','Selected part']]);
    const roE=Readout([['a','Change of state'],['b','Water goes from'],['c','To'],['d','Thermal energy']]);
    const note=Callout();

    const CAP={cycle:'<b>Click any numbered part</b> of the diagram (or press Tab then Enter) to read what happens there. The arrows show which way the water moves.',

    }
    ctx.onTab=()=>{showRo();ctx.setCaption(CAP[ctx.tab]);upd();};
    showRo();ctx.setCaption(CAP.cycle);upd();
    ctx.onReset=()=>{warm=true;sDay.set('w',true);speed=1;sSp.set(1,true);nums=true;cN.set(true,true);pick=null;epick=null;upd();};

    /* ---------------- interaction ---------------- */
    const near=(p,list)=>{let best=null,bd=1e9;for(const q of list){const d=Math.hypot(p.x-q.x,p.y-q.y);if(d<q.r&&d<bd){bd=d;best=q;}}return best;};
    C.cv.style.cursor='pointer';
    C.cv.addEventListener('pointermove',e=>{const p=C.pos(e);
      if(ctx.tab==='cycle')hover=near(p,PARTS);else ehover=near(p,eHot());});
    C.cv.addEventListener('pointerleave',()=>{hover=null;ehover=null;});
    C.cv.addEventListener('click',e=>{const p=C.pos(e);
      if(ctx.tab==='cycle'){const q=near(p,PARTS);if(q){pick=q.id;upd();}}
      else{const q=near(p,eHot());if(q){epick=q.id;upd();}}});

    /* ---------------- tab 1: the cycle ---------------- */
    const SEA=372,GY=396;
    function drawCycle(dt){

      const t=clock;
      /* sky */
      const sk=g.createLinearGradient(0,0,0,SEA);sk.addColorStop(0,warm?'#6ea8de':'#8fa9c4');sk.addColorStop(1,warm?'#cfe4f5':'#dde6ef');
      g.fillStyle=sk;g.fillRect(0,0,800,SEA);
      /* sun */
      const sg=g.createRadialGradient(118,78,6,118,78,52);sg.addColorStop(0,'#fff6b0');sg.addColorStop(.4,'#ffd23a');sg.addColorStop(1,'rgba(255,210,58,0)');
      g.fillStyle=sg;g.beginPath();g.arc(118,78,52,0,TAU);g.fill();
      g.fillStyle='#f6c024';g.beginPath();g.arc(118,78,24,0,TAU);g.fill();
      /* mountain */
      g.fillStyle='#7a6a55';g.beginPath();g.moveTo(560,SEA);g.lineTo(700,150);g.lineTo(800,SEA);g.closePath();g.fill();
      g.fillStyle='#eef3f7';g.beginPath();g.moveTo(700,150);g.lineTo(742,246);g.lineTo(714,232);g.lineTo(692,254);g.lineTo(668,230);g.lineTo(650,248);g.closePath();g.fill();
      /* land */
      g.fillStyle='#5e8a4a';g.fillRect(360,SEA,440,GY-SEA);
      g.fillStyle='#8a6b4a';g.fillRect(360,GY,440,500-GY);
      g.fillStyle='rgba(255,255,255,.18)';for(let i=0;i<26;i++)g.fillRect(366+((i*53)%420),GY+12+((i*31)%78),16,3);
      /* sea */
      const og=g.createLinearGradient(0,SEA,0,500);og.addColorStop(0,'#2f7fc0');og.addColorStop(1,'#12406f');g.fillStyle=og;g.fillRect(0,SEA,360,500-SEA);
      g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=2;
      for(let i=0;i<5;i++){g.beginPath();for(let x=0;x<=360;x+=8)g.lineTo(x,SEA+16+i*22+Math.sin(x/22+t*1.6+i)*3);g.stroke();}
      /* clouds */
      const cw=warm?1:.75;
      [[432,150,1.15],[520,126,.85],[356,132,.8]].forEach(([x,y,s2],i)=>cloud(g,x,y+Math.sin(t*.5+i)*3,s2*cw,warm?'rgba(255,255,255,.97)':'rgba(226,232,240,.97)'));
      /* evaporation: rising vapour from the sea */
      const ev=warm?1:.45;
      for(let i=0;i<22;i++){const ph=((t*.28*ev+i*.045)%1),x=60+((i*37)%280)+Math.sin(t+i)*7,y=SEA-ph*(SEA-186);
        g.globalAlpha=(1-ph)*.75*ev;g.fillStyle='#e8863a';g.beginPath();g.arc(x,y,3.4,0,TAU);g.fill();}
      g.globalAlpha=1;
      arrow(g,258,SEA-26,300,214,{color:'#d1701f',w:4,head:13});
      /* transport arrow toward the cloud */
      arrow(g,336,148,398,144,{color:'#d1701f',w:4,head:13});
      /* precipitation */
      for(let i=0;i<30;i++){const ph=((t*.75+i*.033)%1),x=470+((i*29)%150),y=196+ph*(SEA-206);
        if(warm){g.strokeStyle='rgba(28,88,184,.85)';g.lineWidth=2;g.beginPath();g.moveTo(x,y);g.lineTo(x-3,y+9);g.stroke();}
        else{g.fillStyle='rgba(255,255,255,.95)';g.strokeStyle='#5b7fb0';g.lineWidth=.9;g.beginPath();g.arc(x+Math.sin(t*2+i)*4,y,3,0,TAU);g.fill();g.stroke();}}
      /* run-off + ground water arrows */
      arrow(g,700,300,612,364,{color:'#1a6fc4',w:4,head:13});
      arrow(g,596,384,392,384,{color:'#1a6fc4',w:4,head:13});
      arrow(g,540,446,372,446,{color:'#2a5f96',w:4,head:13});
      g.setLineDash([6,5]);g.strokeStyle='rgba(30,70,130,.55)';g.lineWidth=2;g.beginPath();g.moveTo(370,432);g.lineTo(790,432);g.stroke();g.setLineDash([]);
      txt(g,'water table',742,426,{size:10,align:'right',color:'#2a3f5c',weight:700,haloColor:'rgba(255,255,255,.8)',haloW:5});
      /* labels */
      txt(g,'OCEAN',22,SEA+26,{size:12,color:'#fff',weight:800,haloColor:'rgba(10,40,80,.5)'});
      txt(g,'LAND',368,SEA+22,{size:12,color:'#fff',weight:800,haloColor:'rgba(20,60,20,.5)'});
      /* hotspots */
      PARTS.forEach(p=>{
        const on=pick===p.id,hv=hover&&hover.id===p.id;
        if(on||hv){g.fillStyle=on?'rgba(29,95,191,.18)':'rgba(29,95,191,.10)';g.beginPath();g.arc(p.x,p.y,p.r,0,TAU);g.fill();
          g.strokeStyle=on?'#1d5fbf':'rgba(29,95,191,.5)';g.lineWidth=on?3:2;g.stroke();}
        if(!nums&&!on&&!hv)return;
        const R=on?15:13;
        g.fillStyle=on?'#1d5fbf':'#fff';g.strokeStyle=on?'#12407f':'#1d5fbf';g.lineWidth=2.5;
        g.beginPath();g.arc(p.x,p.y,R,0,TAU);g.fill();g.stroke();
        txt(g,String(p.id),p.x,p.y+5,{size:14,align:'center',color:on?'#fff':'#1d5fbf',weight:800,halo:false});
        if(on||hv)txt(g,p.n,p.x,p.y-R-7,{size:12.5,align:'center',color:'#14202e',weight:800,haloColor:'rgba(255,255,255,.9)',haloW:6});});
      /* key */
      g.fillStyle='rgba(255,255,255,.92)';rr(g,372,466,414,26,7);g.fill();g.strokeStyle='#d6dfea';g.lineWidth=1;g.stroke();
      arrow(g,382,479,402,479,{color:'#d1701f',w:3,head:9});txt(g,'water rising as vapour',408,483,{size:11,color:'#14202e',weight:700,halo:false});
      arrow(g,570,479,590,479,{color:'#1a6fc4',w:3,head:9});txt(g,'water coming back',596,483,{size:11,color:'#14202e',weight:700,halo:false});
    }

    /* ---------------- tab 2: changes of state ---------------- */
    const BY=210,BH=100,BW=130,CX=[140,400,660],SUBY=150,DEPY=370;
    const BOX=[{k:'Solid',sub:'ice and snow'},{k:'Liquid',sub:'liquid water'},{k:'Vapour',sub:'water vapour'}];
    const eHot=()=>[
      {id:'melt',x:270,y:196,r:66},{id:'freeze',x:270,y:324,r:66},
      {id:'evap',x:530,y:196,r:66},{id:'cond',x:530,y:324,r:66},
      {id:'subl',x:400,y:SUBY,r:80},{id:'depo',x:400,y:DEPY,r:80}];
    function drawEnergy(dt){
      if(dt>0)clock+=dt*speed;
      g.fillStyle='#f4f8fc';g.fillRect(0,0,800,500);
      /* the three states */
      BOX.forEach((b,i)=>{const x=CX[i];
        g.fillStyle='#fff';rr(g,x-BW/2,BY,BW,BH,12);g.fill();g.strokeStyle='#8494a8';g.lineWidth=2.5;g.stroke();
        txt(g,b.k,x,BY+30,{size:19,align:'center',color:'#14202e',weight:800,halo:false});
        txt(g,b.sub,x,BY+48,{size:11,align:'center',color:'#465569',weight:600,halo:false});
        for(let k=0;k<9;k++){let dx,dy;
          if(i===0){dx=(k%3)*12;dy=((k/3)|0)*11;}
          else if(i===1){dx=(k%3)*12+Math.sin(clock*1.4+k)*3;dy=((k/3)|0)*11+Math.cos(clock*1.2+k)*3;}
          else{dx=hash(k+13)*44;dy=hash(k+53)*26;}
          g.fillStyle='#5f88b8';g.beginPath();g.arc(x-22+dx,BY+62+dy,3.2,0,TAU);g.fill();}});
      const E=(id)=>eList.find(x=>x.id===id);
      const label=(e,lx,ly,w)=>{const on=epick===e.id,hv=ehover&&ehover.id===e.id,col=e.dir>0?'#d1701f':'#1a6fc4';
        const W=w||126,H=on?44:38;
        g.fillStyle='#fff';rr(g,lx-W/2,ly-H/2,W,H,9);g.fill();
        g.strokeStyle=on?col:(hv?'#8494a8':'#d6dfea');g.lineWidth=on?3:1.4;g.stroke();
        txt(g,e.n,lx,ly-3,{size:on?14:13,align:'center',color:'#14202e',weight:800,halo:false});
        txt(g,e.dir>0?'absorbs energy':'releases energy',lx,ly+13,{size:10,align:'center',color:col,weight:800,halo:false});};
      const line=(e,x0,y0,x1,y1)=>{const on=epick===e.id,col=e.dir>0?'#d1701f':'#1a6fc4';
        arrow(g,x0,y0,x1,y1,{color:col,w:on?7:5,head:on?19:15});};
      /* melting / freezing / evaporation / condensation, in the gaps */
      line(E('melt'),205,BY+20,335,BY+20);      label(E('melt'),270,196);
      line(E('freeze'),335,BY+BH-20,205,BY+BH-20); label(E('freeze'),270,324);
      line(E('evap'),465,BY+20,595,BY+20);      label(E('evap'),530,196);
      line(E('cond'),595,BY+BH-20,465,BY+BH-20); label(E('cond'),530,324);
      /* sublimation across the top, deposition across the bottom */
      const stub=(x,y0,y1,col)=>{g.strokeStyle=col;g.lineWidth=5;g.lineCap='round';g.beginPath();g.moveTo(x,y0);g.lineTo(x,y1);g.stroke();};
      stub(CX[0],BY,SUBY,'#d1701f');stub(CX[2],SUBY,CX[2]&&SUBY,'#d1701f');
      {const on=epick==='subl';g.strokeStyle='#d1701f';g.lineWidth=on?7:5;g.lineCap='round';
        g.beginPath();g.moveTo(CX[0],SUBY);g.lineTo(CX[2],SUBY);g.stroke();
        arrow(g,CX[2],SUBY+4,CX[2],BY-2,{color:'#d1701f',w:on?7:5,head:on?19:15});}
      label(E('subl'),400,SUBY,150);
      stub(CX[2],BY+BH,DEPY,'#1a6fc4');
      {const on=epick==='depo';g.strokeStyle='#1a6fc4';g.lineWidth=on?7:5;g.lineCap='round';
        g.beginPath();g.moveTo(CX[2],DEPY);g.lineTo(CX[0],DEPY);g.stroke();
        arrow(g,CX[0],DEPY-4,CX[0],BY+BH+2,{color:'#1a6fc4',w:on?7:5,head:on?19:15});}
      label(E('depo'),400,DEPY,150);
      /* legends */
      txt(g,'ABSORBS ENERGY',22,34,{size:11,color:'#b5480f',weight:800,halo:false});
      txt(g,'melting · evaporation · sublimation',22,50,{size:11,color:'#465569',weight:600,halo:false});
      txt(g,'RELEASES ENERGY',22,452,{size:11,color:'#12407f',weight:800,halo:false});
      txt(g,'freezing · condensation · deposition',22,468,{size:11,color:'#465569',weight:600,halo:false});
    }

    ctx.loop((dt)=>{
      C.begin();
      if(ctx.tab==='cycle')drawCycle(dt);else drawEnergy(dt);
    });
  }
});
</script>
