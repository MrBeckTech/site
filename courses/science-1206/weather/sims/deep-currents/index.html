<html lang="en"><head><meta charset="utf-8">

<title>Deep Ocean Currents: The Conveyor Belt | Science 1206</title>

<style>:root{
  --bg:#f4f7fb; --card:#ffffff; --ink:#14202e; --ink2:#465569; --line:#d6dfea;
  --brand:#1d5fbf; --brand2:#e4eefc; --cool:#2a78d6; --warm:#eb6834; --good:#137a3a; --bad:#b42318;

}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);

.hd{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin:0 0 10px}
.hd h1{font-size:1.45rem;line-height:1.2;margin:0}

.lead{flex-basis:100%;margin:2px 0 0;color:var(--ink2)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:12px;align-items:start}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.stagecard{padding:8px}

.stage canvas,.stage svg{display:block;width:100%;height:auto;border-radius:10px;background:#eaf3fb;touch-action:none;user-select:none;-webkit-user-select:none}

.caption b{color:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.tab{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:650;padding:8px 14px;border-radius:10px;cursor:pointer;min-height:40px}
.tab[aria-selected=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.ctlcard{display:flex;flex-direction:column;gap:8px}
.ctl-head{display:flex;justify-content:space-between;align-items:center;gap:8px}

.ctl{margin:6px 0 10px}

.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.small{padding:5px 10px;min-height:34px;font-size:.88rem}
.btn.wide{width:100%}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.segbtn{flex:1 1 auto;padding:7px 10px;font-size:.92rem}
.segbtn[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}

.callout.bad{border-color:var(--bad);background:#fdf0ee}

.foot{margin:14px 4px 0;font-size:.82rem;color:var(--ink2)}

a{color:var(--tw-sky)}

<script>
/* Twilight Menu theme runtime: shared by every sim. Edit here, then run tools/apply-theme.mjs.
   1) Canvas colour remap: the sims were drawn for a light background. Rather than hand-editing ~400
      colour literals across 18 sims, this rewrites colours as they are assigned to the canvas:
        light, greyish backgrounds -> dark twilight panels (same hue)
        dark, greyish ink/text     -> light ink
        dark saturated accents     -> lightened so they read on dark
        white halos behind labels  -> dark halos
      Mid/bright science colours (warm reds, cold blues, etc.) pass through unchanged.
      Shape-aware: pale colours filling round shapes (clouds, snow, droplets) stay pale; pale boxes go dark.
      Per-sim control: <meta name="tw-white" content="panel"> darkens everything pale regardless of shape;
      content="keep" never touches pure white. <meta name="tw-map" content="old=new; old=new"> forces exact colours.
   2) Title card: reads <meta name="tw-titlecard" content="LINE 1|LINE 2|LINE 3">. Shown once per tab session.
   NEW sims should use the theme colours directly; the remap is there to convert the existing ones. */
(function(){
  const meta=n=>{const m=document.querySelector(`meta[name="${n}"]`);return m?m.content:null;};
  // tw-white: "auto" (default) | "panel" (dark-mode everything) | "keep" (never touch white)
  const whiteMode=meta('tw-white')||'auto';
  const cache=new Map();
  // Per-sim exact overrides: <meta name="tw-map" content="rgba(255,255,255,.92)=#241845; #e3e9f1=#3a2c5c">
  const norm=c=>String(c).toLowerCase().replace(/\s+/g,'');
  const overrides=new Map((meta('tw-map')||'').split(';').map(x=>x.split('=').map(y=>y.trim())).filter(x=>x.length===2&&x[0]).map(([a,b])=>[norm(a),b]));
  function parse(c){
    if(typeof c!=='string')return null; c=c.trim().toLowerCase();
    let m;
    if(c[0]==='#'){let h=c.slice(1);if(h.length===3||h.length===4)h=[...h].map(x=>x+x).join('');
      if(h.length!==6&&h.length!==8)return null;
      return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16),h.length===8?parseInt(h.slice(6,8),16)/255:1];}
    if((m=c.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*(?:,\s*([\d.]+)\s*)?\)$/)))
      return [+m[1],+m[2],+m[3],m[4]==null?1:+m[4]];
    if(c==='white')return [255,255,255,1];
    if(c==='black')return [0,0,0,1];
    return null;
  }
  function toHsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;
    if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);
      h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h/=6;}
    return [h,s,l];}
  function hsl(h,s,l,a){const f=n=>{const k=(n+h*12)%12,q=s*Math.min(l,1-l);return Math.round(255*(l-q*Math.max(-1,Math.min(k-3,9-k,1))));};
    return `rgba(${f(0)},${f(8)},${f(4)},${a})`;}
  const isWhite=p=>p&&p[0]>=250&&p[1]>=250&&p[2]>=250;
  const chromaOf=p=>(Math.max(p[0],p[1],p[2])-Math.min(p[0],p[1],p[2]))/255;
  // "pale" = white or a washed-out tint: these are the colours that are either backgrounds or clouds/snow
  function isPale(c){const p=parse(c);if(!p)return false;if(isWhite(p))return true;const l=toHsl(p[0],p[1],p[2])[2];return l>=.72&&chromaOf(p)<.4;}
  function remap(c,kind){
    if(overrides.has(norm(c)))return overrides.get(norm(c));
    const key=kind+c; if(cache.has(key))return cache.get(key);
    const p=parse(c); let out=c;
    if(p){const [r,g,b,a]=p,[h,s,l]=toHsl(r,g,b);
      const chroma=chromaOf(p);
      const TH=.73;                                        // theme hue (twilight purple)
      if(isWhite(p)){
        if(whiteMode==='keep') out=c;
        else if(a<1) out=`rgba(22,13,43,${a})`;           // label halos (strokes) / veils over backgrounds
        else out=kind==='stroke'?c:'#241845';               // white panels -> dark; white outlines stay
      }
      else if(l>=.72&&chroma<.4) out=chroma<.05                                         // pale backgrounds, grid lines
        ? hsl(TH,.3,.09+(1-l)*.95,a) : hsl(h,Math.min(s,.32),.1+(1-l)*.95,a);
      else if(l<.5&&chroma<.3) out=chroma<.12                                           // ink, labels, grey strokes
        ? hsl(TH,.3,Math.min(.93,1.02-l*.8),a) : hsl(h,.35,Math.min(.9,1-l*.7),a);
      else if(l<.47) out=hsl(h,s,Math.min(.78,Math.max(.66,l+.25)),a);                 // dark accents -> lighter
    }
    cache.set(key,out); return out;
  }
  const C2=window.CanvasRenderingContext2D&&CanvasRenderingContext2D.prototype;
  if(C2){
    const ORIG='__twFill', STACK='__twStack';
    const fd=Object.getOwnPropertyDescriptor(C2,'fillStyle');
    Object.defineProperty(C2,'fillStyle',{configurable:true,enumerable:fd.enumerable,get:fd.get,
      set(v){this[ORIG]=v;fd.set.call(this,typeof v==='string'?remap(v,'fill'):v);}});
    ['strokeStyle','shadowColor'].forEach(k=>{
      const d=Object.getOwnPropertyDescriptor(C2,k); if(!d||!d.set)return;
      Object.defineProperty(C2,k,{configurable:true,enumerable:d.enumerable,get:d.get,set(v){d.set.call(this,typeof v==='string'?remap(v,'stroke'):v);}});
    });
    // keep the remembered original fill colour in step with save()/restore()
    const sv=C2.save,rs=C2.restore;
    C2.save=function(){(this[STACK]||(this[STACK]=[])).push(this[ORIG]);return sv.call(this);};
    C2.restore=function(){if(this[STACK]&&this[STACK].length)this[ORIG]=this[STACK].pop();return rs.call(this);};
    // Shape awareness: round things (paths made only of arc/ellipse: clouds, snow, droplets, particles) keep their
    // pale colour; boxy things (rects, lines, rounded rects: panels, cards, backgrounds) go dark.
    const bp=C2.beginPath; C2.beginPath=function(){this.__twArc=false;this.__twBox=false;return bp.call(this);};
    ['arc','ellipse'].forEach(k=>{const f=C2[k];if(f)C2[k]=function(...a){this.__twArc=true;return f.apply(this,a);};});
    ['lineTo','rect','roundRect','arcTo','bezierCurveTo','quadraticCurveTo'].forEach(k=>{const f=C2[k];if(f)C2[k]=function(...a){this.__twBox=true;return f.apply(this,a);};});
    const fill=C2.fill;
    C2.fill=function(...a){
      const o=this[ORIG];
      if(whiteMode!=='panel'&&!(a[0]&&typeof a[0]==='object')&&this.__twArc&&!this.__twBox&&typeof o==='string'&&isPale(o)&&!overrides.has(norm(o))){
        const cur=fd.get.call(this); fd.set.call(this,o); const r=fill.apply(this,a); fd.set.call(this,cur); return r;}
      return fill.apply(this,a);
    };
    const fr=C2.fillRect;  // tiny white squares are snow/stars, not panels
    C2.fillRect=function(x,y,w,h){const o=this[ORIG];
      if(whiteMode!=='panel'&&Math.abs(w*h)<=36&&typeof o==='string'&&isPale(o)){const cur=fd.get.call(this);fd.set.call(this,o);const r=fr.call(this,x,y,w,h);fd.set.call(this,cur);return r;}
      return fr.call(this,x,y,w,h);};
    const G=window.CanvasGradient&&CanvasGradient.prototype;
    if(G){const add=G.addColorStop;G.addColorStop=function(o,c){return add.call(this,o,remap(c,'fill'));};}
  }
  window.twilightRemap=remap;

  /* title card */
  const tc=meta('tw-titlecard');
  if(tc){let seen=false;try{seen=sessionStorage.getItem('tw-card:'+location.pathname+tc)==='1';}catch(e){}
    if(!seen&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
      const show=()=>{const el=document.createElement('div');el.className='tw-card';el.setAttribute('role','presentation');
        const [a,b,c]=tc.split('|');el.innerHTML=`<div class="l1"></div><div class="l2"></div><div class="l3"></div><div class="skip">click to skip</div>`;
        el.querySelector('.l1').textContent=a||'';el.querySelector('.l2').textContent=b||'';el.querySelector('.l3').textContent=c||'';
        document.body.appendChild(el);
        const close=()=>{el.classList.add('out');setTimeout(()=>el.remove(),500);};
        el.addEventListener('click',close);setTimeout(close,2200);
        try{sessionStorage.setItem('tw-card:'+location.pathname+tc,'1');}catch(e){}};
      document.readyState==='loading'?document.addEventListener('DOMContentLoaded',show):show();}}
})();
</script>
<!--twilight:end-->

<script>/* Shared helpers for the Science 1206 Weather Dynamics simulations. Self-contained: no external libraries. */
(function(){
'use strict';
const NS='http://www.w3.org/2000/svg', G=window;
G.TAU=Math.PI*2;
G.clamp=(v,a,b)=>v<a?a:v>b?b:v;
G.lerp=(a,b,t)=>a+(b-a)*t;
G.rand=(a,b)=>a+Math.random()*(b-a);
G.$=(s,r)=>(r||document).querySelector(s);
G.smooth=(t)=>{t=clamp(t,0,1);return t*t*(3-2*t);};

function setAttrs(e,a){
  for(const k in a){const v=a[k]; if(v==null||v===false)continue;
    if(k==='class')e.setAttribute('class',v);
    else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k==='html')e.innerHTML=v;
    else if(k.slice(0,2)==='on'&&typeof v==='function')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);}
}
function addKids(e,kids){for(const k of kids.flat(Infinity)){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(k));}}
G.h=(t,a,...k)=>{const e=document.createElement(t);if(a)setAttrs(e,a);addKids(e,k);return e;};

      g.beginPath();g.moveTo(OX0,OY0);g.lineTo(OX0,OY1-30);g.lineTo(OX0+60,OY1);g.lineTo(OX1-90,OY1);g.lineTo(OX1,OY1-10);g.lineTo(OX1,OY0);g.strokeStyle='#5b6b7d';g.lineWidth=3;g.stroke();
      /* sea floor */
      g.fillStyle='#8a6a48';g.beginPath();g.moveTo(OX0-30,OY1+30);g.lineTo(OX0-30,OY1-45);g.lineTo(OX0,OY1-30);g.lineTo(OX0+60,OY1);g.lineTo(OX1-90,OY1);g.lineTo(OX1,OY1-10);g.lineTo(OX1+30,OY1-20);g.lineTo(OX1+30,OY1+30);g.closePath();g.fill();
      /* depth ticks */
      for(let k=0;k<=4;k++){const y=OY0+k*(OY1-OY0)/4.6;txt(g,k+' km',OX0-8,y+4,{size:11,align:'right',color:'#465569',weight:600,halo:false});g.strokeStyle='rgba(255,255,255,.35)';g.setLineDash([3,5]);g.lineWidth=1;g.beginPath();g.moveTo(OX0,y);g.lineTo(OX1,y);g.stroke();g.setLineDash([]);}
      /* ice + sinking */
      g.fillStyle='#f4f8fc';g.strokeStyle='#8aa6c4';g.lineWidth=1.5;for(let i=0;i<5;i++){const x=OX1-120+i*22;g.beginPath();g.moveTo(x,OY0);g.lineTo(x+8,OY0-14-(i%2)*5);g.lineTo(x+22,OY0);g.closePath();g.fill();g.stroke();}
      txt(g,'Sea ice forms: salt is left behind',OX1-30,OY0-26,{size:12,align:'right',color:'#1b3f80',weight:800});
      /* cooling + fresh labels */
      txt(g,'NORTH (Greenland)',OX1-2,OY1+26,{size:11,align:'right',color:'#465569',weight:700,halo:false});txt(g,'SOUTH (Antarctica)',OX0,OY1+26,{size:11,color:'#465569',weight:700,halo:false});
      txt(g,'Warm surface water flows north',OX0+270,YS-12,{size:12,color:'#9a3c0c',weight:800});
      txt(g,'Cold deep water flows south',OX0+50,YD+22,{size:12,color:'#eaf3ff',weight:800,haloColor:'rgba(20,50,100,.7)'});
      /* flow */
      const L=loop.len,alpha=.25+.75*st;
      /* rail */
      g.lineWidth=16;g.lineCap='round';g.lineJoin='round';g.strokeStyle='rgba(255,255,255,'+(.35*alpha)+')';g.beginPath();loopPts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();
      for(const f of SIDEDOTS){const d=((f+phase)%1)*L,pos=loop.at(d);let col;
        const seg1=OX1-70-(OX0+40);
        if(d<seg1){col=heat(clamp(.85-.75*d/seg1,0,1));}else if(d<seg1+(YD-YS)){col=heat(.12);}else col=heat(.08);
        g.beginPath();g.arc(pos[0],pos[1],6,0,TAU);g.fillStyle=col;g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();}
      /* sink arrow */
      const sx=OX1-70;g.globalAlpha=alpha;arrow(g,sx,YS+8,sx,YD-8,{color:'#0d2f6b',w:7,head:20});g.globalAlpha=1;
      txt(g,'Cold, salty water sinks',sx-14,(YS+YD)/2,{size:12,align:'right',color:'#0d2f6b',weight:800});
      /* upwelling */
      g.globalAlpha=.85;for(const x of [OX0+120,OX0+260,OX0+400]){arrow(g,x,YD-20,x,YS+34,{color:'rgba(23,102,63,.85)',w:3,head:11});}g.globalAlpha=1;
      txt(g,'Slow upwelling',OX0+260,(YS+YD)/2+22,{size:12,align:'center',color:'#17663f',weight:800});
      /* status tag */
      const tag=st>.7?'Conveyor: strong':st>.25?'Conveyor: weakened':st>.02?'Conveyor: nearly stopped':'Conveyor: stopped';
      g.font='800 13px system-ui';const w=g.measureText(tag).width+18;g.fillStyle=st>.7?'#137a3a':st>.25?'#b26a00':'#b42318';rr(g,OX0+8,OY0+8,w,26,8);g.fill();g.fillStyle='#fff';g.textAlign='left';g.fillText(tag,OX0+17,OY0+26);
    }
    /* ---- readouts ---- */
    let lastN='';
    function conUpdate(){
      const S=35-.9*fresh/100,rho=dens(nT,S),st=strengthOf(nT,S);
      roC.set('t',nT.toFixed(1)+' °C');roC.set('s',S.toFixed(2)+' ‰');roC.set('d',rho.toFixed(2)+' kg/m³');
      roC.set('k',st>.7?'Strong':st>.25?'Weak':st>.02?'Very weak':'None');roC.set('v',Math.round(st*100)+' % of normal');
      const key=Math.round(st*20)+'';
      if(key!==lastN){lastN=key;
        if(st>.7)note.say('Normal conveyor','Surface water is cold and salty enough to sink. The sinking pulls warm surface water north to take its place.','good');
        else if(st>.25)note.say('A weaker conveyor','Less-dense surface water sinks less easily, so less warm water is pulled north. Scientists are watching for changes like this.','warm');
        else note.say('The water is too light to sink','Warm or fresh surface water floats. With no deep water formation, the conveyor would nearly stop, and the northward flow of warm water would weaken.','bad');}
      return st;
    }
    ctx.onTab=()=>{syncTabUI();lastN='';if(ctx.tab==='lab')labNote();};
    ctx.onReset=()=>{A={T:4,S:35};B={T:25,S:35};sPre.set('w',true);sAT.set(4,true);sAS.set(35,true);sBT.set(25,true);sBS.set(35,true);reset();nT=0;fresh=0;sTn.set(0,true);sFr.set(0,true);lastN='';};
    syncTabUI();labNote();
    let lastL=0;
    ctx.loop((dt)=>{
      if(dt>0)clock+=dt;
      C.begin();g.fillStyle='#f4f8fc';g.fillRect(0,0,800,430);
      const tab=ctx.tab;
      if(tab==='lab'){labNote();drawLab(dt);}
      else{const st=conUpdate();if(tab==='map')drawMap(st);else drawSide(st,dt);}
    });
    ctx.setCaption('<b>Density lab.</b> Cold and salty water is dense. Set up each side, then open the gate and watch which water sinks.');
    const cap={lab:'<b>Density lab.</b> Cold and salty water is dense. Set up each side, then open the gate and watch which water sinks.',map:'<b>The great ocean conveyor belt.</b> Warm surface water (orange) flows to the North Atlantic, sinks, and returns as cold deep water (blue dashes).',side:'<b>Side view of the Atlantic.</b> Cool the northern surface water or add fresh water and watch the conveyor respond.'};
    const oT=ctx.onTab;ctx.onTab=(id)=>{oT(id);ctx.setCaption(cap[id]);};
  }
});
</script>
