<script>
/* Twilight Menu theme runtime: shared by every sim. Edit here, then run tools/apply-theme.mjs.
   1) Canvas colour remap: the sims were drawn for a light background. Rather than hand-editing ~400
      colour literals across 18 sims, this rewrites colours as they are assigned to the canvas:
        light, greyish backgrounds -> dark twilight panels (same hue)
        dark, greyish ink/text     -> light ink
        dark saturated accents     -> lightened so they read on dark
        white halos behind labels  -> dark halos
      Mid/bright science colours (warm reds, cold blues, etc.) pass through unchanged.
      Shape-aware: pale colours filling round shapes (clouds, snow, droplets) stay pale; pale boxes go dark.
      Per-sim control: <meta name="tw-white" content="panel"> darkens everything pale regardless of shape;
      content="keep" never touches pure white. <meta name="tw-map" content="old=new; old=new"> forces exact colours.
   2) Title card: reads <meta name="tw-titlecard" content="LINE 1|LINE 2|LINE 3">. Shown once per tab session.
   NEW sims should use the theme colours directly; the remap is there to convert the existing ones. */
(function(){
  const meta=n=>{const m=document.querySelector(`meta[name="${n}"]`);return m?m.content:null;};
  // tw-white: "auto" (default) | "panel" (dark-mode everything) | "keep" (never touch white)
  const whiteMode=meta('tw-white')||'auto';
  const cache=new Map();
  // Per-sim exact overrides: <meta name="tw-map" content="rgba(255,255,255,.92)=#241845; #e3e9f1=#3a2c5c">
  const norm=c=>String(c).toLowerCase().replace(/\s+/g,'');
  const overrides=new Map((meta('tw-map')||'').split(';').map(x=>x.split('=').map(y=>y.trim())).filter(x=>x.length===2&&x[0]).map(([a,b])=>[norm(a),b]));
  function parse(c){
    if(typeof c!=='string')return null; c=c.trim().toLowerCase();
    let m;
    if(c[0]==='#'){let h=c.slice(1);if(h.length===3||h.length===4)h=[...h].map(x=>x+x).join('');
      if(h.length!==6&&h.length!==8)return null;
      return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16),h.length===8?parseInt(h.slice(6,8),16)/255:1];}
    if((m=c.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*(?:,\s*([\d.]+)\s*)?\)$/)))
      return [+m[1],+m[2],+m[3],m[4]==null?1:+m[4]];
    if(c==='white')return [255,255,255,1];
    if(c==='black')return [0,0,0,1];
    return null;
  }
  function toHsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;
    if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);
      h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h/=6;}
    return [h,s,l];}
  function hsl(h,s,l,a){const f=n=>{const k=(n+h*12)%12,q=s*Math.min(l,1-l);return Math.round(255*(l-q*Math.max(-1,Math.min(k-3,9-k,1))));};
    return `rgba(${f(0)},${f(8)},${f(4)},${a})`;}
  const isWhite=p=>p&&p[0]>=250&&p[1]>=250&&p[2]>=250;
  const chromaOf=p=>(Math.max(p[0],p[1],p[2])-Math.min(p[0],p[1],p[2]))/255;
  // "pale" = white or a washed-out tint: these are the colours that are either backgrounds or clouds/snow
  function isPale(c){const p=parse(c);if(!p)return false;if(isWhite(p))return true;const l=toHsl(p[0],p[1],p[2])[2];return l>=.72&&chromaOf(p)<.4;}
  function remap(c,kind){
    if(overrides.has(norm(c)))return overrides.get(norm(c));
    const key=kind+c; if(cache.has(key))return cache.get(key);
    const p=parse(c); let out=c;
    if(p){const [r,g,b,a]=p,[h,s,l]=toHsl(r,g,b);
      const chroma=chromaOf(p);
      const TH=.73;                                        // theme hue (twilight purple)
      if(isWhite(p)){
        if(whiteMode==='keep') out=c;
        else if(a<1) out=`rgba(22,13,43,${a})`;           // label halos (strokes) / veils over backgrounds
        else out=kind==='stroke'?c:'#241845';               // white panels -> dark; white outlines stay
      }
      else if(l>=.72&&chroma<.4) out=chroma<.05                                         // pale backgrounds, grid lines
        ? hsl(TH,.3,.09+(1-l)*.95,a) : hsl(h,Math.min(s,.32),.1+(1-l)*.95,a);
      else if(l<.5&&chroma<.3) out=chroma<.12                                           // ink, labels, grey strokes
        ? hsl(TH,.3,Math.min(.93,1.02-l*.8),a) : hsl(h,.35,Math.min(.9,1-l*.7),a);
      else if(l<.47) out=hsl(h,s,Math.min(.78,Math.max(.66,l+.25)),a);                 // dark accents -> lighter
    }
    cache.set(key,out); return out;
  }
  const C2=window.CanvasRenderingContext2D&&CanvasRenderingContext2D.prototype;
  if(C2){
    const ORIG='__twFill', STACK='__twStack';
    const fd=Object.getOwnPropertyDescriptor(C2,'fillStyle');
    Object.defineProperty(C2,'fillStyle',{configurable:true,enumerable:fd.enumerable,get:fd.get,
      set(v){this[ORIG]=v;fd.set.call(this,typeof v==='string'?remap(v,'fill'):v);}});
    ['strokeStyle','shadowColor'].forEach(k=>{
      const d=Object.getOwnPropertyDescriptor(C2,k); if(!d||!d.set)return;
      Object.defineProperty(C2,k,{configurable:true,enumerable:d.enumerable,get:d.get,set(v){d.set.call(this,typeof v==='string'?remap(v,'stroke'):v);}});
    });
    // keep the remembered original fill colour in step with save()/restore()
    const sv=C2.save,rs=C2.restore;
    C2.save=function(){(this[STACK]||(this[STACK]=[])).push(this[ORIG]);return sv.call(this);};
    C2.restore=function(){if(this[STACK]&&this[STACK].length)this[ORIG]=this[STACK].pop();return rs.call(this);};
    // Shape awareness: round things (paths made only of arc/ellipse: clouds, snow, droplets, particles) keep their
    // pale colour; boxy things (rects, lines, rounded rects: panels, cards, backgrounds) go dark.
    const bp=C2.beginPath; C2.beginPath=function(){this.__twArc=false;this.__twBox=false;return bp.call(this);};
    ['arc','ellipse'].forEach(k=>{const f=C2[k];if(f)C2[k]=function(...a){this.__twArc=true;return f.apply(this,a);};});
    ['lineTo','rect','roundRect','arcTo','bezierCurveTo','quadraticCurveTo'].forEach(k=>{const f=C2[k];if(f)C2[k]=function(...a){this.__twBox=true;return f.apply(this,a);};});
    const fill=C2.fill;
    C2.fill=function(...a){
      const o=this[ORIG];
      if(whiteMode!=='panel'&&!(a[0]&&typeof a[0]==='object')&&this.__twArc&&!this.__twBox&&typeof o==='string'&&isPale(o)&&!overrides.has(norm(o))){
        const cur=fd.get.call(this); fd.set.call(this,o); const r=fill.apply(this,a); fd.set.call(this,cur); return r;}
      return fill.apply(this,a);
    };
    const fr=C2.fillRect;  // tiny white squares are snow/stars, not panels
    C2.fillRect=function(x,y,w,h){const o=this[ORIG];
      if(whiteMode!=='panel'&&Math.abs(w*h)<=36&&typeof o==='string'&&isPale(o)){const cur=fd.get.call(this);fd.set.call(this,o);const r=fr.call(this,x,y,w,h);fd.set.call(this,cur);return r;}
      return fr.call(this,x,y,w,h);};
    const G=window.CanvasGradient&&CanvasGradient.prototype;
    if(G){const add=G.addColorStop;G.addColorStop=function(o,c){return add.call(this,o,remap(c,'fill'));};}
  }
  window.twilightRemap=remap;

  /* title card */
  const tc=meta('tw-titlecard');
  if(tc){let seen=false;try{seen=sessionStorage.getItem('tw-card:'+location.pathname+tc)==='1';}catch(e){}
    if(!seen&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
      const show=()=>{const el=document.createElement('div');el.className='tw-card';el.setAttribute('role','presentation');
        const [a,b,c]=tc.split('|');el.innerHTML=`<div class="l1"></div><div class="l2"></div><div class="l3"></div><div class="skip">click to skip</div>`;
        el.querySelector('.l1').textContent=a||'';el.querySelector('.l2').textContent=b||'';el.querySelector('.l3').textContent=c||'';
        document.body.appendChild(el);
        const close=()=>{el.classList.add('out');setTimeout(()=>el.remove(),500);};
        el.addEventListener('click',close);setTimeout(close,2200);
        try{sessionStorage.setItem('tw-card:'+location.pathname+tc,'1');}catch(e){}};
      document.readyState==='loading'?document.addEventListener('DOMContentLoaded',show):show();}}
})();
</script>
<!--twilight:end-->

<script>/* Shared helpers for the Science 1206 Weather Dynamics simulations. Self-contained: no external libraries. */
(function(){
'use strict';
const NS='http://www.w3.org/2000/svg', G=window;
G.TAU=Math.PI*2;
G.clamp=(v,a,b)=>v<a?a:v>b?b:v;
G.lerp=(a,b,t)=>a+(b-a)*t;
G.rand=(a,b)=>a+Math.random()*(b-a);
G.$=(s,r)=>(r||document).querySelector(s);
G.smooth=(t)=>{t=clamp(t,0,1);return t*t*(3-2*t);};

function setAttrs(e,a){
  for(const k in a){const v=a[k]; if(v==null||v===false)continue;
    if(k==='class')e.setAttribute('class',v);
    else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k==='html')e.innerHTML=v;
    else if(k.slice(0,2)==='on'&&typeof v==='function')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);}
}
function addKids(e,kids){for(const k of kids.flat(Infinity)){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(k));}}
G.h=(t,a,...k)=>{const e=document.createElement(t);if(a)setAttrs(e,a);addKids(e,k);return e;};
G.s=(t,a,...k)=>{const e=document.createElementNS(NS,t);if(a)setAttrs(e,a);addKids(e,k);return e;};

/* colour: cold blue -> pale -> warm orange -> hot red (never the only cue: sims also label) */
const STOPS=[[42,120,214],[160,200,236],[246,240,222],[245,170,92],[212,58,38]];

/* polyline path follower: PolyPath(pts).at(distance) -> [x,y,segmentIndex], wraps around */
G.PolyPath=(pts)=>{const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));const len=cum[cum.length-1];

Sim({
  title:"Earth's Energy Budget and Albedo",
  tag:'Section 1.1 · Figure 1.4',
  lead:'Follow 100 units of incoming sunlight. Where does each unit go, and why does Earth stay at a steady temperature?',
  source:'Based on Science 1206, Chapter 1, pp. 13–16 (Earth’s energy budget, albedo, greenhouse effect).',
  alt:'Animation of sunlight being reflected, absorbed and re-radiated as infrared by Earth and its atmosphere.',
  notice:[
    'Every unit of sunlight that arrives is eventually sent back to space. <b>Energy in = energy out</b>, so the average temperature stays steady.',
    '<b>The four numbers are an average.</b> Figure 1.4’s 25 / 20 / 5 / 50 describes the whole Earth over a whole year. Change the surface or the cloud cover here and the split changes, because you are now looking at one place rather than the average of all of them. The button brings the textbook case back.',
    'Switch the surface to <b>snow</b>: it reflects most sunlight (high albedo), so less is absorbed and the estimated temperature drops.',
    'Raise the <b>greenhouse gases</b>. Red infrared photons now bounce back down more often before escaping, so the surface stays warmer.',
    'The atmosphere lets <b>visible light</b> pass through, but it absorbs some of the <b>infrared</b> that the warm ground gives off.'],
  terms:[
    ['Radiation','Thermal energy transfer in which atoms or molecules give off energy as electromagnetic waves.'],
    ['Albedo','How much sunlight a surface reflects. Snow is about 70–80%; a summer crop field about 20% or less.'],
    ['Global average','A single figure standing for the whole Earth across a whole year. Figure 1.4’s four numbers are global averages, so no one place and no one day matches them exactly.'],
    ['Greenhouse gases','Water vapour, carbon dioxide and methane. They absorb infrared radiation and give it off in all directions, including back to Earth’s surface.'],
    ['Energy budget','The balance between the solar energy Earth absorbs and the energy it radiates back to space.']],
  questions:[
    ['Describe what happens to the solar energy that reaches Earth’s surface.','About half of the sun’s energy (50%) is absorbed by land and water. Some (5%) is reflected. The absorbed energy warms the surface, which then gives off infrared radiation. Some of that infrared is absorbed by greenhouse gases and radiated back down before the rest escapes to space.'],
    ['Why is the surface temperature steady even though the Sun keeps sending energy?','Earth radiates as much energy into space as it absorbs from the Sun. That balance is the energy budget.'],
    ['Without a natural greenhouse effect, the average temperature would be about −18°C instead of 14°C. Set the slider to see it.','Slide greenhouse gases to 0%. Life as we know it could not exist. But adding <i>more</i> greenhouse gases traps extra heat, which is why a build-up of these gases is a concern.']],
  init(ctx){
    const C=ctx.canvas(800,500),g=C.g;
    const SY=340, CLOUDY=150, ATMY=228, GHGY=262, SUN=[690,52];
    const SURF={mix:{n:'Land + sea (average)',a:5/55},ocean:{n:'Ocean',a:.05},forest:{n:'Forest',a:.12},crops:{n:'Crop field',a:.20},bare:{n:'Bare rock',a:.30},snow:{n:'Snow',a:.75}};
    const slots=[[50,150],[215,128],[380,156],[540,132],[680,160],[135,196]];
    let surf='mix', cover=50, ghg=1;
    /* the four numbers of Figure 1.4 (p. 14). The sim opens here. */
    const FIG={cr:25,a:20,sr:5,sa:50};
    const atFig=()=>cover===50&&surf==='mix';
    const rows=Readout([['fig','Figure 1.4'],['c','Clouds & particles reflect'],['a','Atmosphere absorbs'],['sr','Surface reflects'],['sa','Surface absorbs'],['rf','Sunlight reflected to space'],['ir','Infrared sent to space'],['out','Total energy out'],['t','Estimated surface temp.']]);
    const note=Callout();
    const calc=()=>{const cr=cover/2,a=20,arr=100-cr-a,sr=arr*SURF[surf].a,sa=arr-sr;return{cr,a,sr,sa,ir:100-cr-sr,T:-18+32*ghg+0.7*(sa-50)};};
    const upd=()=>{const m=calc();rows.set('fig',atFig()?'Matches':'Changed');rows.set('c',m.cr.toFixed(0)+' %');rows.set('a',m.a+' %');const n1=v=>(Math.abs(v-Math.round(v))<.05?v.toFixed(0):v.toFixed(1));rows.set('sr',n1(m.sr)+' %');rows.set('sa',n1(m.sa)+' %');
      rows.set('rf',(m.cr+m.sr).toFixed(0)+' %');rows.set('ir',m.ir.toFixed(0)+' %');rows.set('out','100 %');rows.set('t',m.T.toFixed(0)+' °C');
      figWrap.hidden=atFig();
      if(!atFig()){
        const bits=[];
        if(surf!=='mix')bits.push('the surface to <b>'+SURF[surf].n.toLowerCase()+'</b> (albedo '+Math.round(SURF[surf].a*100)+' %)');
        if(cover!==50)bits.push('cloud cover to <b>'+cover+' %</b>');
        note.say('Why these numbers are not the textbook’s. ',
          'You have changed '+bits.join(' and ')+'. Figure 1.4 is a <b>global average</b>: the whole Earth, day and night, right through the year, with every surface and every amount of cloud averaged together. No single place matches it. Here '+Math.round(m.sr)+' % is reflected by the surface and '+Math.round(m.sa)+' % is absorbed, instead of the average 5 % and 50 %. Average this place together with the oceans, forests, deserts and ice and you get the textbook’s four numbers back.',
          'warm');
        return;}
      const hi=SURF[surf].a>=.5;
      note.say(ghg<.05?'No greenhouse effect':(ghg>1.05?'Enhanced greenhouse effect':'This is the textbook case'),
        ghg<.05?'With no greenhouse gases the infrared escapes quickly. The average temperature would be near −18 °C.':
        ghg>1.05?'More infrared is sent back down, so the surface warms. (Exaggerated here for demonstration.)':
        'These are the four numbers of Figure 1.4: 25 % reflected by clouds and particles, 20 % absorbed in the atmosphere, 5 % reflected by land and sea, 50 % absorbed by the surface. Energy in (100) equals energy out (100), so the average temperature does not keep rising.',
        ghg<.05?'':ghg>1.05?'warm':'good');};
    let segSurf,sldCover,sldGhg;
    const toFig=()=>{surf='mix';cover=50;segSurf.set('mix',true);sldCover.set(50,true);upd();};
    const figBtn=Btn('Back to the textbook values (Figure 1.4)',()=>toFig(),'primary wide');
    const figWrap=h('div',{style:{gridColumn:'1 / -1'}},Btn('Back to the textbook values (Figure 1.4)',()=>toFig(),'primary wide'));
    const figPanel=h('div',{class:'hint',style:{lineHeight:'1.5',marginTop:'2px'}},
      h('b',null,'Figure 1.4 (p. 14) — learn these four:'),h('br'),
      '25 % reflected by clouds and particles',h('br'),
      '20 % absorbed by particles in the atmosphere',h('br'),
      '5 % reflected by land and sea',h('br'),
      '50 % reaches and is absorbed by the surface');
    ctx.controls.append(
      figBtn, figPanel,
      segSurf=Seg({label:'Surface (albedo)',value:'mix',options:Object.entries(SURF).map(([k,v])=>[k,v.n]),onChange:v=>{surf=v;upd();}}),
      sldCover=Slider({label:'Cloud cover',min:0,max:100,step:5,value:50,unit:' %',onInput:v=>{cover=v;upd();}}),
      sldGhg=Slider({label:'Greenhouse gases',min:0,max:1.3,step:.05,value:1,fmt:v=>Math.round(v*100),unit:' %',hint:'100% = today’s natural level',onInput:v=>{ghg=v;upd();}}),
      h('p',{class:'hint'},'Change the surface or the cloud cover and the four numbers change with them. Press the button above to come back to the textbook case.'));
    ctx.info.append(rows,note,figWrap);
    upd();

    /* photons */
    class P{constructor(x,y,kind){this.x=x;this.y=y;this.kind=kind;this.wait=0;this.done=false;this.next=null;this.speed=250;this.dist=0;this.vx=0;this.vy=1;}
      go(x,y,kind,sp,next){this.tx=x;this.ty=y;if(kind)this.kind=kind;this.speed=sp||250;this.next=next||null;const d=Math.hypot(x-this.x,y-this.y)||1;this.vx=(x-this.x)/d;this.vy=(y-this.y)/d;this.dist=d;}
      step(dt){if(this.wait>0){this.wait-=dt;return;}const st=this.speed*dt;if(st>=this.dist){this.x=this.tx;this.y=this.ty;this.dist=0;const n=this.next;this.next=null;if(n)n(this);else this.done=true;}else{this.x+=this.vx*st;this.y+=this.vy*st;this.dist-=st;}}}
    let ph=[],acc=0,glow=[];
    const pG=()=>clamp(.6*ghg,0,.85);
    const irUp=(p)=>{p.go(p.x+rand(-25,25),GHGY,'ir',150,layer);};
    const layer=(p)=>{if(Math.random()<pG()){p.wait=.28;glow.push({x:p.x,y:p.y,t:.5});
        if(Math.random()<.5)p.go(p.x+rand(-30,30),SY,'ir',150,(q)=>{q.wait=.3;q.next=null;glow.push({x:q.x,y:q.y,t:.5});q.go(q.x,q.y-1,'ir',150,irUp);});
        else p.go(p.x+rand(-40,40),-30,'ir',170);}
      else p.go(p.x+rand(-40,40),-30,'ir',170);};
    const nClouds=()=>Math.round(cover/100*6);
    function spawn(){
      const m=calc(),r=Math.random()*100,p=new P(SUN[0]+rand(-12,12),SUN[1]+rand(-6,6),'vis');
      const groundHit=()=>{const gx=rand(60,740);return[gx,SY];};
      if(r<m.cr&&nClouds()>0){const c=slots[Math.floor(rand(0,nClouds()))],hx=c[0]+30,hy=c[1]-16,dx=hx-p.x,dy=hy-p.y,L=Math.hypot(dx,dy);
        p.go(hx,hy,'vis',260,(q)=>q.go(q.x+dx/L*700,q.y-dy/L*700,'vis',260));}
      else if(r<m.cr+m.a||(r<m.cr&&nClouds()===0)){const gx=rand(80,740),t=(ATMY-p.y)/(SY-p.y),ax=lerp(p.x,gx,t);
        p.go(ax,ATMY,'vis',260,(q)=>{q.wait=.15;glow.push({x:q.x,y:q.y,t:.5});q.go(q.x+rand(-60,60),-30,'ir',170);});}
      else if(r<m.cr+m.a+m.sr){const[gx]=groundHit(),dx=gx-p.x,dy=SY-p.y,L=Math.hypot(dx,dy);
        p.go(gx,SY,'vis',260,(q)=>q.go(q.x+dx/L*700,q.y-dy/L*700,'vis',260));}
      else{const[gx]=groundHit();p.go(gx,SY,'vis',260,(q)=>{q.wait=.35;glow.push({x:q.x,y:q.y,t:.6});q.go(q.x,q.y-1,'ir',150,irUp);});}
      ph.push(p);}
    ctx.onReset=()=>{ph=[];glow=[];surf='mix';cover=50;ghg=1;segSurf.set('mix',true);sldCover.set(50,true);sldGhg.set(1,true);upd();};
    const mol=[];for(let i=0;i<30;i++)mol.push({x:30+i*25.5+rand(-8,8),y:GHGY+rand(-14,14),k:i%3,ph:rand(0,TAU)});

    const surfaceFill=()=>{const k=surf;
      if(k==='mix')return null;
      return{ocean:'#2b6ea8',forest:'#2f6b3f',crops:'#a8b545',bare:'#8a7a6a',snow:'#f3f8fc'}[k];};
    ctx.loop((dt,t)=>{
      acc+=dt*6;while(acc>=1){acc-=1;spawn();}
      ph.forEach(p=>p.step(dt));ph=ph.filter(p=>!p.done);glow.forEach(o=>o.t-=dt);glow=glow.filter(o=>o.t>0);
      C.begin();
      const sk=g.createLinearGradient(0,0,0,SY);sk.addColorStop(0,'#0d1f4d');sk.addColorStop(.16,'#3f6fb5');sk.addColorStop(.55,'#9cc7ea');sk.addColorStop(1,'#d3e9f7');
      g.fillStyle=sk;g.fillRect(0,0,800,SY);
      g.fillStyle='rgba(255,255,255,.75)';for(let i=0;i<30;i++){g.fillRect((i*137)%800,(i*53)%50,1.6,1.6);}
      /* greenhouse layer */
      g.fillStyle='rgba(255,120,80,'+(.05+.12*Math.min(ghg,1.3))+')';g.fillRect(0,GHGY-24,800,48);
      const nm=Math.round(ghg/1.3*30);
      for(let i=0;i<nm;i++){const m=mol[i],x=m.x,y=m.y+Math.sin(t*1.3+m.ph)*3;g.fillStyle='#5a4a7a';g.strokeStyle='#5a4a7a';g.lineWidth=2;
        if(m.k===0){g.beginPath();g.moveTo(x-7,y);g.lineTo(x+7,y);g.stroke();g.beginPath();g.arc(x-8,y,4,0,TAU);g.arc(x+8,y,4,0,TAU);g.fill();g.beginPath();g.arc(x,y,4.5,0,TAU);g.fillStyle='#222';g.fill();}
        else if(m.k===1){g.beginPath();g.arc(x,y,5,0,TAU);g.fill();g.beginPath();g.arc(x-6,y+5,3,0,TAU);g.arc(x+6,y+5,3,0,TAU);g.fillStyle='#8a7cb0';g.fill();}
        else{g.beginPath();g.arc(x,y,4.5,0,TAU);g.fillStyle='#222';g.fill();[[-7,0],[7,0],[0,-7],[0,7]].forEach(d=>{g.beginPath();g.arc(x+d[0],y+d[1],2.6,0,TAU);g.fillStyle='#8a7cb0';g.fill();});}}
      txt(g,'Greenhouse gases (H₂O, CO₂, CH₄)',790,GHGY+40,{size:14,align:'right',color:'#4a3a6a'});
      /* clouds */
      for(let i=0;i<nClouds();i++){cloud(g,slots[i][0],slots[i][1],1,'rgba(255,255,255,.96)');}
      /* sun */
      const sg=g.createRadialGradient(SUN[0],SUN[1],4,SUN[0],SUN[1],48);sg.addColorStop(0,'#fff6b0');sg.addColorStop(.35,'#ffd23a');sg.addColorStop(1,'rgba(255,210,58,0)');
      g.fillStyle=sg;g.beginPath();g.arc(SUN[0],SUN[1],48,0,TAU);g.fill();g.fillStyle='#ffd23a';g.beginPath();g.arc(SUN[0],SUN[1],22,0,TAU);g.fill();
      txt(g,'Sun: 100 units',SUN[0]-40,SUN[1]-22,{size:15,align:'right'});
      /* surface */
      const sf=surfaceFill();
      if(!sf){g.fillStyle='#2b6ea8';g.fillRect(0,SY,400,160);g.fillStyle='#3f8a55';g.fillRect(400,SY,400,160);
        g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=2;for(let i=0;i<5;i++){g.beginPath();for(let x=0;x<=400;x+=10)g.lineTo(x,SY+14+i*22+Math.sin(x/16+t*2+i)*3);g.stroke();}}
      else{g.fillStyle=sf;g.fillRect(0,SY,800,160);g.strokeStyle='rgba(0,0,0,.15)';g.lineWidth=2;
        if(surf==='ocean'){g.strokeStyle='rgba(255,255,255,.35)';for(let i=0;i<5;i++){g.beginPath();for(let x=0;x<=800;x+=10)g.lineTo(x,SY+14+i*22+Math.sin(x/16+t*2+i)*3);g.stroke();}}
        if(surf==='forest'){for(let x=10;x<800;x+=26){g.fillStyle='#1f4d2c';g.beginPath();g.moveTo(x,SY+2);g.lineTo(x+11,SY+34);g.lineTo(x-11,SY+34);g.fill();}}
        if(surf==='crops'){g.strokeStyle='rgba(90,100,20,.5)';for(let x=0;x<800;x+=16){g.beginPath();g.moveTo(x,SY+4);g.lineTo(x-30,SY+160);g.stroke();}}
        if(surf==='bare'){g.fillStyle='rgba(60,45,35,.3)';for(let i=0;i<40;i++){g.beginPath();g.arc((i*97)%800,SY+20+(i*41)%130,4+(i%4),0,TAU);g.fill();}}
        if(surf==='snow'){g.fillStyle='rgba(170,200,225,.5)';for(let i=0;i<40;i++){g.beginPath();g.ellipse((i*97)%800,SY+15+(i*41)%130,16,3,0,0,TAU);g.fill();}}}
      txt(g,SURF[surf].n+' · albedo '+Math.round(SURF[surf].a*100)+'%',14,SY+150,{size:16,color:surf==='snow'?'#123':'#fff',halo:false});
      /* glows */
      glow.forEach(o=>{g.fillStyle='rgba(255,140,60,'+(o.t*1.2)+')';g.beginPath();g.arc(o.x,o.y,10+(.6-o.t)*20,0,TAU);g.fill();});
      /* photons */
      ph.forEach(p=>{if(p.wait>0&&p.kind==='ir'&&p.y>SY-4)return;
        if(p.kind==='vis'){g.strokeStyle='rgba(110,60,0,.6)';g.lineWidth=6;g.lineCap='round';g.beginPath();g.moveTo(p.x-p.vx*18,p.y-p.vy*18);g.lineTo(p.x,p.y);g.stroke();
          g.strokeStyle='#ffc21a';g.lineWidth=3.4;g.beginPath();g.moveTo(p.x-p.vx*18,p.y-p.vy*18);g.lineTo(p.x,p.y);g.stroke();}
        else{wavy(g,p.x-p.vx*26,p.y-p.vy*26,p.x,p.y,{color:'#c8321f',w:2.6,amp:4.5,wl:11,phase:t*12});}});
      /* labels */
      const m=calc();
      {/* always say whether what is on screen is the textbook case */
        const ok=atFig(),lab=ok?'MATCHES FIGURE 1.4':'CHANGED FROM FIGURE 1.4';
        g.font='800 11px system-ui,sans-serif';const bw=g.measureText(lab).width+20;
        g.fillStyle=ok?'rgba(19,122,58,.94)':'rgba(181,72,15,.94)';rr(g,12,14,bw,23,7);g.fill();
        txt(g,lab,22,30,{size:11,color:'#fff',weight:800,halo:false});}
      const pill=(str,x,y,al)=>{g.font='700 15px system-ui,sans-serif';const w=g.measureText(str).width+16;rr(g,al==='r'?x-w:x,y-15,w,24,8);g.fillStyle='rgba(255,255,255,.92)';g.fill();g.strokeStyle='#9db4d3';g.lineWidth=1;g.stroke();txt(g,str,al==='r'?x-w+8:x+8,y+2,{size:15,halo:false});};
      pill(m.cr.toFixed(0)+'% reflected by clouds & particles',12,96);
      pill(m.a+'% absorbed by the atmosphere',12,ATMY+2);
      pill(m.sr.toFixed(0)+'% reflected by surface',12,SY-22);
      pill(m.sa.toFixed(0)+'% absorbed by surface',12,SY+28);
      /* legend */
      g.fillStyle='rgba(255,255,255,.92)';rr(g,548,392,240,92,10);g.fill();g.strokeStyle='#9db4d3';g.stroke();
      g.strokeStyle='rgba(110,60,0,.6)';g.lineWidth=6;g.beginPath();g.moveTo(580,414);g.lineTo(610,414);g.stroke();g.strokeStyle='#ffc21a';g.lineWidth=3.4;g.beginPath();g.moveTo(580,414);g.lineTo(610,414);g.stroke();
      txt(g,'Sunlight (visible)',620,419,{size:15,halo:false});
      wavy(g,580,442,610,442,{color:'#c8321f',w:2.6,amp:4.5,wl:11});txt(g,'Infrared (heat)',620,447,{size:15,halo:false});
      txt(g,'Glow = energy absorbed',580,472,{size:13,color:'#465569',halo:false});
    });
    ctx.setCaption('<b>Each streak is a bundle of energy.</b> Bright yellow = sunlight. Red waves = infrared. Try snow, then remove the greenhouse gases.');
  }
