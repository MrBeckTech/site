<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Element Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1b1030; --panel:#2c1a4d; --panel2:#3a2463; --edge:#000; --rim:#6b4fa8;
  --ink:#f6efff; --mute:#c3b2e6; --gold:#ffd23f; --mint:#5df2a4; --coral:#ff5d73; --sky:#6ad3ff;
  --pix:'Press Start 2P', 'Courier New', monospace;
  --txt:'VT323', 'Courier New', monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--ink)}
body{font-family:var(--txt);font-size:22px;line-height:1.25;
  background-image:radial-gradient(#ffffff10 1px,transparent 1px);background-size:6px 6px}
#app{max-width:920px;margin:0 auto;padding:10px;min-height:600px}
h1,h2,h3,.pix{font-family:var(--pix);font-weight:400;letter-spacing:0}
h2{font-size:15px;margin:0 0 10px;color:var(--gold);line-height:1.5}
h3{font-size:11px;margin:16px 0 6px;color:var(--sky);line-height:1.6}
sub,sup{font-size:.7em;line-height:0}
b{color:var(--gold);font-weight:400}
.box{background:var(--panel);border:4px solid var(--edge);box-shadow:inset 0 0 0 3px var(--rim),5px 5px 0 #000;padding:14px 16px}
.btn{font-family:var(--pix);font-size:11px;line-height:1.4;background:var(--gold);color:#241500;border:4px solid #000;
  box-shadow:inset -4px -4px 0 #c99500,inset 4px 4px 0 #fff2a8;padding:12px 14px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translate(2px,2px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.alt{background:var(--sky);box-shadow:inset -4px -4px 0 #2f8fbf,inset 4px 4px 0 #d4f4ff}
.btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:inset -4px -4px 0 #20123a,inset 4px 4px 0 #5a3d8f}
button:focus-visible,input:focus-visible{outline:3px dashed var(--mint);outline-offset:3px}
img.spr{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--mute)}
.hp{height:12px;border:3px solid #000;background:#14091f;position:relative}
.hp>i{display:block;height:100%;background:var(--mint);transition:width .45s steps(8)}
.hp.mid>i{background:var(--gold)} .hp.low>i{background:var(--coral)}
.xp{height:6px;border:2px solid #000;background:#14091f;margin-top:3px}
.xp>i{display:block;height:100%;background:var(--sky)}
.sym{font-family:var(--pix);font-size:10px;background:#000;color:var(--gold);padding:4px 6px;display:inline-block;line-height:1.4}

/* title */
.title{text-align:center}
.logo{font-family:var(--pix);font-size:clamp(26px,7vw,52px);line-height:1.15;margin:18px 0 6px;color:var(--gold);
  text-shadow:4px 4px 0 #b3256b,8px 8px 0 #000}
.tag{color:var(--mute);margin:0 0 16px}
.parade{display:flex;justify-content:center;gap:6px;margin:6px 0 16px;flex-wrap:wrap}
.parade img{width:64px;animation:bob 1.2s steps(2) infinite}
.parade img:nth-child(2n){animation-delay:.6s}
@keyframes bob{50%{transform:translateY(-6px)}}
.field{display:block;max-width:420px;margin:0 auto 14px;text-align:left}
.field label{font-family:var(--pix);font-size:10px;display:block;margin-bottom:6px;color:var(--sky)}
.field input{width:100%;font-family:var(--txt);font-size:26px;padding:8px 10px;background:#120a22;color:var(--ink);border:4px solid #000;box-shadow:inset 0 0 0 3px var(--rim)}
.starters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 16px}
.starter{background:var(--panel2);border:4px solid #000;padding:10px 8px;cursor:pointer;color:var(--ink);font-family:var(--txt);font-size:20px;text-align:center}
.starter img{width:88px;margin:0 auto 6px}
.starter.on{box-shadow:inset 0 0 0 4px var(--gold);background:#4a2f7d}
.starter .nm{font-family:var(--pix);font-size:10px;margin:6px 0;color:var(--gold)}
.err{color:var(--coral);min-height:26px}

/* dialogue */
.talk{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:start}
.talk img{width:96px}
.talk .who{font-family:var(--pix);font-size:10px;color:var(--sky);margin-bottom:6px}

/* map */
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hud .stat{font-family:var(--pix);font-size:10px;line-height:1.6}
.team{display:flex;gap:8px;flex-wrap:wrap}
.mem{background:var(--panel2);border:3px solid #000;padding:6px;width:96px;text-align:center;font-size:18px}
.mem img{width:48px;margin:0 auto}
button.mem{cursor:pointer;color:var(--ink);font-family:var(--txt)}
.mem.inp{box-shadow:inset 0 0 0 3px var(--gold)}
.mem .hp{height:8px;border-width:2px;margin-top:3px}
.zone{margin-top:12px;position:relative}
.zone .zt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.zone.lock{opacity:.5}
.path{display:flex;align-items:center;gap:0;margin-top:10px;flex-wrap:wrap}
.node{width:96px;height:96px;background:#120a22;border:4px solid #000;display:grid;place-items:center;position:relative;cursor:pointer;padding:0;color:var(--ink)}
.node img{width:64px}
.node .lbl{position:absolute;bottom:-4px;left:-4px;right:-4px;background:#000;font-family:var(--pix);font-size:8px;padding:3px 0;color:var(--mute)}
.node.cur{box-shadow:inset 0 0 0 4px var(--gold);animation:pulse 1s steps(2) infinite}
.node.done .lbl{color:var(--mint)}
.node:disabled{cursor:default}
.node.lockn img{filter:brightness(0) opacity(.6)}
@keyframes pulse{50%{box-shadow:inset 0 0 0 4px #fff}}
.link{width:28px;height:8px;background:repeating-linear-gradient(90deg,var(--rim) 0 6px,transparent 6px 10px)}

/* battle */
.arena{position:relative;height:250px;border:4px solid #000;overflow:hidden;box-shadow:5px 5px 0 #000}
.arena .ground{position:absolute;left:0;right:0;bottom:0;height:70px;background:repeating-linear-gradient(90deg,#0003 0 16px,transparent 16px 32px)}
.ehud,.phud{position:absolute;width:min(46%,280px);padding:8px 10px}
.ehud{left:10px;top:10px} .phud{right:10px;bottom:10px}
.hn{display:flex;justify-content:space-between;align-items:center;gap:6px;font-family:var(--pix);font-size:10px;margin-bottom:6px;line-height:1.5}
.espr{position:absolute;right:8%;top:22px;width:120px}
.espr.big{width:150px;top:10px}
.pspr{position:absolute;left:8%;bottom:14px;width:120px}
.shadow{position:absolute;height:14px;background:#0005;border-radius:50%}
.lunge-r{animation:lr .35s steps(3)} @keyframes lr{50%{transform:translate(40px,-14px)}}
.lunge-l{animation:ll .35s steps(3)} @keyframes ll{50%{transform:translate(-40px,14px)}}
.hurt{animation:hurt .5s steps(2)} @keyframes hurt{0%,50%{opacity:.2;transform:translateX(-6px)}25%,75%{opacity:1;transform:translateX(6px)}}
.faint{animation:faint .6s steps(4) forwards} @keyframes faint{to{transform:translateY(60px);opacity:0}}
.dmg{position:absolute;font-family:var(--pix);font-size:16px;color:#fff;text-shadow:3px 3px 0 #000;animation:up 1s steps(6) forwards;pointer-events:none}
.dmg.crit{color:var(--gold);font-size:20px}
@keyframes up{to{transform:translateY(-40px);opacity:0}}
.msg{margin-top:10px;min-height:56px;font-size:24px}
.qbox{margin-top:10px}
.prompt{font-size:26px;margin:0 0 10px}
.prompt .muted{font-size:21px}
.visual{display:flex;justify-content:center;margin:0 0 10px}
.visual svg{max-width:100%;height:auto}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.pics{grid-template-columns:1fr 1fr!important}
.opt svg{width:100%;max-width:190px;height:auto;display:block;margin:0 auto}
.opts.pics .opt{flex-direction:column;align-items:center}
.opt{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel2);color:var(--ink);border:4px solid #000;
  box-shadow:inset -4px -4px 0 #20123a,inset 4px 4px 0 #5a3d8f;padding:10px 12px;font-family:var(--txt);font-size:26px;cursor:pointer;min-height:58px}
.opt:hover:not(:disabled){background:#4a2f7d}
.opt .k{font-family:var(--pix);font-size:10px;background:#000;color:var(--gold);padding:4px 6px;flex:none}
.opt.right{background:#1f6b4a;box-shadow:inset 0 0 0 4px var(--mint)}
.opt.wrong{background:#7a1f33;box-shadow:inset 0 0 0 4px var(--coral)}
.opt.gone{opacity:.15}
.opt:disabled{cursor:default}
.fb{margin-top:12px;border-top:4px dashed var(--rim);padding-top:10px}
.fb .head{font-family:var(--pix);font-size:12px;line-height:1.6;margin-bottom:6px}
.fb .head.ok{color:var(--mint)} .fb .head.no{color:var(--coral)}
.why{font-size:22px;background:#120a22;border:3px solid #000;padding:10px 12px;margin:8px 0 12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.swap{display:flex;gap:6px;flex-wrap:wrap}
.swap button{background:var(--panel2);border:3px solid #000;padding:3px;cursor:pointer;position:relative}
.swap button.on{box-shadow:inset 0 0 0 3px var(--gold)}
.swap button:disabled{opacity:.35;cursor:default}
.swap img{width:36px}

/* modal */
.veil{position:fixed;inset:0;background:#0b0616e0;display:grid;place-items:center;padding:12px;z-index:50}
.modal{max-width:760px;width:100%;max-height:92vh;overflow:auto}
.modal ul{margin:6px 0;padding-left:22px}
.modal li{margin:4px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{font-size:9px;padding:8px 10px}
table.t{border-collapse:collapse;width:100%;font-size:21px;margin:6px 0}
table.t td,table.t th{border:2px solid #000;padding:3px 8px;text-align:left;background:#120a22}
table.t th{background:#000;color:var(--sky);font-family:var(--pix);font-size:9px;font-weight:400}
.join{text-align:center}
.join img{width:140px;margin:6px auto;animation:bob 1.2s steps(2) infinite}
.diag{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.diag figure{margin:0;text-align:center;font-size:19px;color:var(--mute)}

/* end */
.cert{text-align:center;border-width:6px}
.grade{background:#120a22;border:4px solid #000;box-shadow:inset 0 0 0 3px var(--gold);padding:10px;margin:10px auto;max-width:360px}
.grade .gl{font-family:var(--pix);font-size:10px;color:var(--sky)}
.grade .gv{font-family:var(--pix);font-size:clamp(34px,9vw,54px);color:var(--gold);text-shadow:4px 4px 0 #b3256b;margin:8px 0 2px}
.grade .rank{margin:6px 0 0}
.bonus.low{color:#2b0a10;background:var(--coral)}
.bonus{font-family:var(--pix);font-size:10px;line-height:1.6;color:#052b18;background:var(--mint);border:4px solid #000;padding:8px;margin:8px auto;max-width:520px}
.code{font-family:var(--pix);font-size:12px;margin:8px 0;line-height:1.6}.code b{font-size:16px;letter-spacing:3px;background:#000;padding:4px 8px}
.cert .rank{font-family:var(--pix);font-size:clamp(16px,4vw,26px);color:var(--gold);text-shadow:3px 3px 0 #b3256b;margin:10px 0}
.big3{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.big3 div{background:#120a22;border:3px solid #000;padding:8px}
.big3 .v{font-family:var(--pix);font-size:16px;color:var(--mint);margin-top:6px}
.endteam{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:10px 0}
.endteam div{font-size:17px}
.endteam img{width:56px;margin:0 auto}
@media (max-width:620px){.endteam img{width:40px}.endteam div{font-size:14px}.cert .snap{margin-top:8px}}
.snap{font-family:var(--pix);font-size:11px;line-height:1.7;color:#241500;background:var(--gold);border:4px solid #000;padding:10px;margin-top:12px}

/* duel */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.duo .field{margin:0 0 8px}
.dgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.dc{background:var(--panel2);border:3px solid #000;padding:4px;cursor:pointer}
.dc.on{box-shadow:inset 0 0 0 3px var(--gold);background:#4a2f7d}
.dc img{width:100%;max-width:48px;margin:0 auto}
.dcn{font-family:var(--pix);font-size:9px;color:var(--gold);margin-top:8px;line-height:1.6}
.arena .box.turn{box-shadow:inset 0 0 0 3px var(--gold),0 0 0 4px var(--gold)}
.dturn{font-family:var(--pix);font-size:12px;color:var(--gold);margin:0 0 10px;line-height:1.6}
.dturn.steal{color:var(--coral)}
.cert .logo{overflow-wrap:anywhere}

@media (max-width:620px){
  .duo{grid-template-columns:1fr}
  .rpt .big3,.cert .big3{grid-template-columns:repeat(4,1fr);gap:4px}.rpt .big3 div,.cert .big3 div{padding:4px;font-size:15px}.rpt .big3 .v,.cert .big3 .v{font-size:11px}
  .rpt table.t,.cert table.t{font-size:18px}.rpt p{font-size:19px}
  body{font-size:20px}
  .opts{grid-template-columns:1fr}
  .arena{height:220px}
  .espr{width:92px;right:4%} .espr.big{width:110px}
  .pspr{width:92px;left:4%}
  .ehud,.phud{width:58%}
  .starters{grid-template-columns:1fr}
  .starter{display:grid;grid-template-columns:72px 1fr;text-align:left;gap:10px;align-items:center}
  .starter img{width:64px;margin:0}
  .node{width:78px;height:78px} .node img{width:50px} .link{width:14px}
  .big3{grid-template-columns:1fr 1fr}
  .talk{grid-template-columns:64px 1fr} .talk img{width:64px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body><!--worldmap:start--><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap"><div style="position:fixed;top:12px;left:12px;z-index:50"><a href="https://mrbecktech.github.io/site/" style="display:inline-block;font-family:'Press Start 2P','Courier New',monospace;font-size:10px;line-height:1;color:#ffd23f;background:#3a2463;text-decoration:none;padding:8px 10px;border:3px solid #000;border-radius:4px;box-shadow:inset 0 0 0 2px #5b3f94">&#9664; WORLD MAP</a></div><!--worldmap:end-->
<div id="app"></div>
<script>
(function(){
"use strict";
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const R=a=>a[Math.floor(Math.random()*a.length)];
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):a, lcm=(a,b)=>a*b/gcd(a,b);
const fm=f=>String(f).replace(/(\d+)/g,'<sub>$1</sub>');
const chg=c=>{const m=Math.abs(c);return (m===1?'':m)+(c>0?'+':'−')};
const chgTxt=c=>Math.abs(c)+(c>0?'+':'−');
const ion=(f,c)=>fm(f)+'<sup>'+chg(c)+'</sup>';
const ROMAN=['','I','II','III','IV','V','VI','VII'];
const PREF=['','mono','di','tri','tetra','penta','hexa','hepta','octa','nona','deca'];
const strip=h=>/<svg/.test(h)?String(h):String(h).replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim().toLowerCase();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function mc(correct,distract,n){
  n=n||4;const seen=new Set([strip(correct)]),ops=[correct];
  for(const d of shuffle(distract)){if(ops.length>=n)break;if(d===''||d==null)continue;const k=strip(d);if(!seen.has(k)){seen.add(k);ops.push(d)}}
  const sh=shuffle(ops);return {options:sh,ans:sh.indexOf(correct)};
}
function Q(key,prompt,visual,correct,distract,why,n){const m=mc(correct,distract,n);return {key,prompt,visual,options:m.options,ans:m.ans,why}}
const nums=(ans,list)=>list.concat([ans+1,ans+2,ans-1,ans+3,ans-2,ans+4]).filter(x=>x>=0&&x!==ans).map(String);

/* ============ chemistry data ============ */
const EL=[null,['H','hydrogen',1],['He','helium',4],['Li','lithium',7],['Be','beryllium',9],['B','boron',11],['C','carbon',12],['N','nitrogen',14],['O','oxygen',16],['F','fluorine',19],['Ne','neon',20],['Na','sodium',23],['Mg','magnesium',24],['Al','aluminum',27],['Si','silicon',28],['P','phosphorus',31],['S','sulfur',32],['Cl','chlorine',35],['Ar','argon',40],['K','potassium',39],['Ca','calcium',40]];
const ZOF={};EL.forEach((e,i)=>{if(e)ZOF[e[0]]=i});
function shells(n){const cap=[2,8,8,8];const r=[];for(const c of cap){if(n<=0)break;const t=Math.min(c,n);r.push(t);n-=t}return r}
const arrStr=a=>a.join(', ');
const ION={Li:1,Be:2,N:-3,O:-2,F:-1,Na:1,Mg:2,Al:3,P:-3,S:-2,Cl:-1,K:1,Ca:2};
const ionList=Object.keys(ION);
const NOBLE={2:['He','helium'],10:['Ne','neon'],18:['Ar','argon']};
const ROOT={N:'nitr',O:'ox',F:'fluor',P:'phosph',S:'sulf',Cl:'chlor'};

function bohrSVG(o){
  const sh=o.sh,N=sh.length,r0=44,st=22,rmax=r0+st*(N-1),pad=o.bracket?34:12;
  const W=2*(rmax+pad)+(o.bracket?18:0),H=2*(rmax+12),cx=W/2-(o.bracket?9:0),cy=H/2;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${Math.min(W,300)}" role="img" aria-label="${o.label||'Bohr-Rutherford diagram'}" xmlns="http://www.w3.org/2000/svg" font-family="VT323,monospace">`;
  sh.forEach((cnt,i)=>{const r=r0+st*i;s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#8f78c4" stroke-width="2"/>`;
    for(let k=0;k<cnt;k++){const a=(-90+360*k/cnt)*Math.PI/180;s+=`<rect x="${(cx+r*Math.cos(a)-5).toFixed(1)}" y="${(cy+r*Math.sin(a)-5).toFixed(1)}" width="10" height="10" fill="#ffd23f" stroke="#000" stroke-width="2"/>`}});
  s+=`<circle cx="${cx}" cy="${cy}" r="27" fill="#ff5d73" stroke="#000" stroke-width="3"/>`;
  if(o.hide){s+=`<text x="${cx}" y="${cy+9}" text-anchor="middle" font-size="28" fill="#fff">?</text>`}
  else{s+=`<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="19" fill="#fff">${o.p}p</text><text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="19" fill="#fff">${o.n}n</text>`}
  if(o.bracket){const L=cx-rmax-16,Rr=cx+rmax+16,T=cy-rmax-6,B=cy+rmax+6;
    s+=`<polyline points="${L+10},${T} ${L},${T} ${L},${B} ${L+10},${B}" fill="none" stroke="#f6efff" stroke-width="4"/>`;
    s+=`<polyline points="${Rr-10},${T} ${Rr},${T} ${Rr},${B} ${Rr-10},${B}" fill="none" stroke="#f6efff" stroke-width="4"/>`;
    s+=`<text x="${Rr+4}" y="${T+14}" font-size="26" fill="#ffd23f">${o.charge}</text>`}
  return s+'</svg>';
}

/* ============ zone 1: atoms, Bohr & ion diagrams ============ */
function g_pne(){
  const z=rint(1,20),[s,nm,A]=EL[z],kind=R(['protons','neutrons','electrons']),n=A-z,ans={protons:z,neutrons:n,electrons:z}[kind];
  return Q('pne'+z+kind,`A neutral atom of <b>${nm}-${A}</b> (<sup>${A}</sup>${s}). How many <b>${kind}</b> does it have?`,'',String(ans),nums(ans,[z,n,A,A+z]),
  `${nm[0].toUpperCase()+nm.slice(1)} has atomic number <b>${z}</b>, and the atomic number is the proton count → <b>${z} proton${z>1?'s':''}</b>.<br>Neutral atom → electrons = protons = <b>${z}</b>.<br>The mass number (${A}) counts protons + neutrons together, so neutrons = ${A} − ${z} = <b>${n}</b>.`);
}
function arrWhy(z,nm,e,lead){const sh=shells(e);return `${lead||`${nm} has atomic number ${z} → ${z} protons, and an atom has the same number of electrons → <b>${e} electrons</b>.`}<br>Fill energy levels from the inside out: level 1 holds up to 2, level 2 up to 8, level 3 up to 8, then level 4.<br>${sh.join(' + ')} = ${e} → <b>${arrStr(sh)}</b>`}
function g_arr(){
  const z=rint(3,20),[s,nm]=EL[z],sh=shells(z);
  const ds=[shells(z-1),shells(z+1),shells(z+2),shells(z-2)].map(arrStr);
  if(sh.length>1)ds.push(arrStr(sh.slice().reverse()));
  if(z>10)ds.push(arrStr([2,z-2]));

const NOTES=[
`<h2>Bohr Burrow notes</h2>
<h3>Drawing a Bohr-Rutherford diagram</h3><ul>
<li><b>Protons</b> = atomic number. Write them in the nucleus as "__p".</li>
<li><b>Neutrons</b> = mass number (atomic mass rounded) − atomic number. Write them in the nucleus as "__n". Sodium: 23 − 11 = 12n.</li>
<li><b>Electrons</b>: an atom has the same number of electrons as protons (so the charges cancel). Draw them on rings around the nucleus, filling from the inside out: 1st ring up to 2, 2nd up to 8, 3rd up to 8, 4th gets the rest (for the first 20 elements).</li>
<li><b>Valence electrons</b> are the electrons on the outermost ring. Aluminum: 2, 8, 3 → 3 valence electrons.</li></ul>
<h3>Drawing an ion diagram</h3><p>Atoms gain or lose electrons so their outer ring is full, like the nearest noble gas. The nucleus never changes — only electrons move.</p><ul>
<li><b>Metals</b> (few valence electrons) lose them → positive ion. Mg: 2, 8, 2 loses 2 → 2, 8.</li>
<li><b>Non-metals</b> (many valence electrons) gain until the outer ring holds 8 → negative ion. O: 2, 6 gains 2 → 2, 8.</li>
<li>Redraw with the new electrons, put the whole diagram in <b>square brackets</b>, and write the charge at the top right. <b>Charge = protons − electrons</b>: Mg 12 − 10 = 2+, O 8 − 10 = 2−.</li></ul>${ex1}`,
`<h2>Ion Caverns notes</h2>
<h3>What makes a compound ionic?</h3><p>This zone covers <b>Type 1</b> (binary, metal with one charge) and <b>Type 2</b> (multivalent metals). Polyatomic Peaks is <b>Type 3</b>.</p>
<p>A <b>metal</b> transfers electrons to a <b>non-metal</b>. The metal becomes a positive ion, the non-metal a negative ion, and the opposite charges attract.</p>
<h3>Common charges</h3>
<table class="t"><tr><th>Group</th><th>Charge</th><th>Examples</th></tr>
<tr><td>Group 1</td><td>1+</td><td>Li⁺ Na⁺ K⁺</td></tr><tr><td>Group 2</td><td>2+</td><td>Mg²⁺ Ca²⁺ Ba²⁺</td></tr>
<tr><td>Al (Group 13)</td><td>3+</td><td>Al³⁺</td></tr><tr><td>Ag, Zn, Cd</td><td>one charge each</td><td>Ag⁺ Zn²⁺ Cd²⁺</td></tr>
<tr><td>Group 15</td><td>3−</td><td>N³⁻ nitride, P³⁻ phosphide</td></tr><tr><td>Group 16</td><td>2−</td><td>O²⁻ oxide, S²⁻ sulfide, Se²⁻ selenide</td></tr>
<tr><td>Group 17</td><td>1−</td><td>F⁻ Cl⁻ Br⁻ I⁻ (…ide)</td></tr><tr><td>hydrogen (with a metal)</td><td>1−</td><td>H⁻ hydride, e.g. MgH₂</td></tr></table>
<h3>Naming (formula → name)</h3><p>Metal's full name + non-metal root + <b>"-ide"</b>. CaCl₂ → calcium chloride. <b>Never use prefixes</b> for ionic compounds — the charges already decide the ratio.</p>
<h3>Formulas (name → formula)</h3><p>Write both ions with charges, then find how many of each make the total charge zero (criss-cross the charge numbers and <b>reduce</b>). Aluminum oxide: Al³⁺ and O²⁻ → 2 × (+3) = +6 and 3 × (−2) = −6 → Al₂O₃. Magnesium oxide: Mg²⁺ and O²⁻ already balance → MgO (not Mg₂O₂).</p>
<h3>Multivalent metals</h3><p>Some metals have more than one possible charge (Fe²⁺/Fe³⁺, Cu⁺/Cu²⁺, Pb²⁺/Pb⁴⁺, Sn²⁺/Sn⁴⁺, Ni²⁺/Ni³⁺, Co²⁺/Co³⁺, Cr³⁺/Cr²⁺, Au³⁺/Au⁺, Pd²⁺/Pd⁴⁺ — check the ion chart on the back of your periodic table). The <b>Roman numeral</b> in the name is the charge on one ion, not how many: iron(III) = Fe³⁺, so Fe₂O₃ is iron(III) oxide. Ag⁺, Zn²⁺ and Cd²⁺ have only one charge, so they never get a numeral. Don't just read the subscripts backwards: PbO₂ has 2 × O²⁻ = 4−, so it's lead(IV) oxide, not lead(II). To name FeCl₃, work backwards: 3 Cl⁻ = 3−, so the one iron must be 3+ → iron(III) chloride.</p>`,
`<h2>Polyatomic Peaks notes</h2>
<h3>What is a polyatomic ion? (Type 3)</h3><p>A group of atoms bonded together that carries <b>one overall charge</b> and acts like a single ion. You never change the atoms inside it.</p>${polyTable}
<p>The positive ones are ammonium NH₄⁺ (used in this game) and hydronium H₃O⁺. Your periodic table's back page has the full list.</p><h3>Naming</h3><p>Name the cation, then the anion — exactly like binary ionic compounds, using the ion's name from the table. NaOH → sodium hydroxide. NH₄Cl → ammonium chloride. No prefixes. With a multivalent metal, use the polyatomic ion's <b>total</b> charge to find the numeral: Fe(OH)₃ → 3 × OH⁻ = 3− → iron(III) hydroxide.</p>
<p>"-ate" ions have one more oxygen than the matching "-ite" ion (nitrate NO₃⁻, nitrite NO₂⁻). "per-…-ate" has one more than "-ate"; "hypo-…-ite" has one less than "-ite". Adding "hydrogen" makes an ion one less negative (SO₄²⁻ → HSO₄⁻). "-ide" is for single-element ions, except hydroxide and cyanide. Watch the look-alikes: phosphate PO₄³⁻ vs phosphide P³⁻.</p>
<h3>Formulas</h3><p>Balance charges like any ionic compound. If you need <b>more than one</b> polyatomic ion, put it in <b>brackets</b> with the number outside: calcium hydroxide → Ca²⁺ and OH⁻ → Ca(OH)₂. Without brackets, CaOH₂ would mean one O and two H — a different thing.</p>`,
`<h2>Covalent Citadel notes</h2>
<h3>What makes a compound molecular?</h3><p>Only <b>non-metals</b>. They <b>share</b> electrons instead of transferring them, so there are no ion charges to balance. Instead, prefixes tell you how many atoms of each.</p>
<table class="t"><tr><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>mono</td><td>di</td><td>tri</td><td>tetra</td><td>penta</td></tr>
<tr><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th></tr><tr><td>hexa</td><td>hepta</td><td>octa</td><td>nona</td><td>deca</td></tr></table>
<h3>Naming rules</h3><ul>
<li>The element farther <b>left</b> on the periodic table goes first.</li>
<li>First element: full name, with a prefix only if there are 2 or more (never "mono" on the first element).</li>
<li>Second element: always a prefix + root + "-ide".</li>
<li>Before "oxide", drop the final "a" or "o" of the prefix: monoxide, tetroxide, pentoxide (but dioxide and trioxide keep their "i").</li>
<li>Compounds with hydrogen first use <b>no prefixes</b>: HCl = hydrogen chloride, H₂S = hydrogen sulfide.</li>
<li>Formulas: prefixes become subscripts directly. Never criss-cross or reduce: dinitrogen tetroxide is N₂O₄.</li></ul>
<h3>Diatomic elements</h3><p>H₂, O₂, N₂, Cl₂, Br₂, I₂, F₂ exist as pairs when pure — "HONClBrIF".</p>
<h3>Common names to memorize</h3><p>water H₂O, hydrogen peroxide H₂O₂, ammonia NH₃, methane CH₄, glucose C₆H₁₂O₆, sucrose C₁₂H₂₂O₁₁, ozone O₃, laughing gas N₂O.</p>`];

   <div class="tools"><button class="btn alt" id="hint">🧪 Hint (${S.hints})</button><button class="btn ghost" id="bnotes">📖 Notes</button><span class="muted">Switch:</span><div class="swap" id="swap"></div></div>`);
  bindMute();
  $('#espr').innerHTML=img(nd.c,'espr'+(c.boss?' big':''),false);
  $('#hint').onclick=useHint;$('#bnotes').onclick=()=>notes(z<4?z:3);
  drawPlayer();updHUD();
  say(nd.t==='wild'?`A wild ${c.name} (${c.sym}) appeared!`:nd.t==='boss'?`Zone boss ${c.name} (${c.sym}) blocks the path!`:`UNBONDIUM rises from the Void! Every topic counts now.`);
  nextQ();
}
function drawPlayer(){const m=S.team[S.act];$('#pspr').innerHTML=img(m.id,'pspr',true);drawSwap();updHUD()}
function drawSwap(){const sw=$('#swap');if(!sw)return;sw.innerHTML=S.party.map(i=>[S.team[i],i]).map(([m,i])=>`<button data-sw="${i}" class="${i===S.act?'on':''}" ${m.hp<=0||i===S.act?'disabled':''} title="${CR[m.id].name} Lv ${m.lvl}" aria-label="Switch to ${CR[m.id].name}">${img(m.id,'',true)}</button>`).join('');
  sw.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{if(B.answered&&B.q)return;S.act=+b.dataset.sw;sfx.blip();drawPlayer();say(`Go, ${CR[S.team[S.act].id].name}!`)})}
function setBar(el,v,mx){const pc=Math.max(0,v/mx*100);el.querySelector('i').style.width=pc+'%';el.classList.toggle('mid',pc<50&&pc>=20);el.classList.toggle('low',pc<20)}
function updHUD(){if(!B)return;const m=S.team[S.act];setBar($('#ehp'),B.hp,B.max);setBar($('#php'),m.hp,maxHP(m));$('#pxp i').style.width=(m.xp/4*100)+'%';
  $('#pn').textContent=CR[m.id].name;const hs=$('#hs');if(hs)hs.innerHTML=`⭐ ${S.score} &nbsp; ✔ ${S.total?Math.round(S.correct/S.total*100):0}% &nbsp; 🧪 ${S.hints}`;$('#pl').textContent='Lv '+m.lvl;const h=$('#hint');if(h){h.textContent=`🧪 Hint (${S.hints})`;h.disabled=!S.hints||B.answered||(B.q&&B.q.options.length<3)||B.hinted}}
function say(t){const m=$('#msg');if(m)m.innerHTML=t}
function anim(sel,cls){const e=app.querySelector(sel);if(!e)return;e.classList.remove(cls);void e.offsetWidth;e.classList.add(cls)}
function floatDmg(who,d,crit){const a=app.querySelector('.arena'),e=app.querySelector(who==='e'?'.espr':'.pspr');if(!a||!e)return;const r=e.getBoundingClientRect(),ar=a.getBoundingClientRect();
  const s=document.createElement('div');s.className='dmg'+(crit?' crit':'');s.textContent='-'+d+(crit?'!':'');s.style.left=(r.left-ar.left+r.width/2-20)+'px';s.style.top=(r.top-ar.top)+'px';a.appendChild(s);setTimeout(()=>s.remove(),1000)}
function pickQ(){
  const pool=B.nd.t==='final'?FINALG:(B.nd.t==='boss'?POOLS[B.nd.z][2]:POOLS[B.nd.z][B.nd.t==='wild'&&NODES[B.i-1]&&NODES[B.i-1].z===B.nd.z?1:0]);
  let q,g;for(let k=0;k<25;k++){g=R(pool);q=g();if(!S.used.includes(q.key))break}
  S.used.push(q.key);if(S.used.length>400)S.used=S.used.slice(-300);q.topic=TOPIC.get(g);return q;
}
function nextQ(){
  B.q=pickQ();B.answered=false;B.hinted=false;const q=B.q;
  $('#qb').innerHTML=`<p class="prompt">${q.prompt}</p>${q.visual?`<div class="visual">${q.visual}</div>`:''}<div class="opts${/<svg/.test(q.options[0])?' pics':''}">${q.options.map((o,i)=>`<button class="opt" data-o="${i}"><span class="k">${i+1}</span><span>${o}</span></button>`).join('')}</div><div id="fb"></div>`;
  app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>answer(+b.dataset.o));
  if((S.miss||0)>=2&&q.options.length>2&&!B.assisted){B.assisted=true;B.hinted=true;shuffle(q.options.map((o,i)=>i).filter(i=>i!==q.ans)).slice(0,2).forEach(i=>{const b=app.querySelector(`[data-o="${i}"]`);b.classList.add('gone');b.disabled=true});say('Prof. Proton steps in (once per battle): two wrong answers are crossed out!')}
  updHUD();drawSwap();
}
function useHint(){if(!S.hints||B.answered||B.hinted||B.q.options.length<3)return;S.hints--;S.hu++;B.hinted=true;
  const wrong=shuffle(B.q.options.map((o,i)=>i).filter(i=>i!==B.q.ans)).slice(0,2);
  wrong.forEach(i=>{const b=app.querySelector(`[data-o="${i}"]`);b.classList.add('gone');b.disabled=true});sfx.blip();updHUD()}
function answer(k){
  if(B.answered)return;B.answered=true;const q=B.q,ok=k===q.ans,m=S.team[S.act],nm=CR[m.id].name,z=B.nd.z;
  app.querySelectorAll('[data-o]').forEach(b=>{b.disabled=true;const i=+b.dataset.o;if(i===q.ans)b.classList.add('right');else if(i===k)b.classList.add('wrong')});
  S.stats[q.topic].t++;S.total++;let extra='';
  if(ok){S.miss=0;S.correct++;S.pts+=B.hinted?0.5:1;S.stats[q.topic].c++;S.streak++;S.best=Math.max(S.best,S.streak);
    const crit=S.streak>=3;let d=10+(m.lvl-1);if(crit)d=Math.round(d*1.25);S.score+=100+(crit?50:0);
    B.hp=Math.max(0,B.hp-d);sfx.good();anim('.pspr','lunge-r');setTimeout(()=>{anim('.espr','hurt');floatDmg('e',d,crit);sfx.hit();updHUD()},300);
    say(crit?`🔥 ${S.streak} in a row! ${nm} lands a critical hit for ${d}!`:`${nm} attacks for ${d} damage!`);
    m.xp++;if(m.xp>=4){m.xp=0;m.lvl++;m.hp=Math.min(maxHP(m),m.hp+12);extra=`⭐ ${nm} grew to Lv ${m.lvl}!`;setTimeout(sfx.lvl,500)}
  }else{S.streak=0;S.miss=(S.miss||0)+1;const d=B.nd.t==='final'?16:9+3*z+(B.nd.t==='boss'?5:0);m.hp=Math.max(0,m.hp-d);sfx.bad();
    anim('.espr','lunge-l');setTimeout(()=>{anim('.pspr','hurt');floatDmg('p',d);updHUD()},300);
    say(`${B.c.name} strikes back for ${d} damage!`);if(m.hp<=0)extra=`💫 ${nm} fainted!`}
  const right=q.options[q.ans];
  $('#fb').innerHTML=`<div class="fb"><div class="head ${ok?'ok':'no'}">${ok?'✓ Correct!':'✗ Not quite. The answer is: '+right}</div>${extra?`<p style="margin:4px 0">${extra}</p>`:''}<div class="why">${q.why}</div><button class="btn" id="go">${B.hp<=0?'Finish the battle':'Next question'}</button></div>`;
  $('#go').onclick=cont;
  if(!ok)readLock($('#go'));
  setTimeout(()=>{const g=$('#go');if(g){if(!g.disabled)g.focus({preventScroll:true});g.scrollIntoView({block:'nearest',behavior:'smooth'})}},50);updHUD();
}
function readLock(gb){const label=gb.textContent;let t=LOCK;gb.disabled=true;gb.textContent=`Read the explanation… ${t}`;const iv=setInterval(()=>{t--;if(!document.body.contains(gb)){clearInterval(iv);return}if(t<=0){clearInterval(iv);gb.disabled=false;gb.textContent=label;gb.focus({preventScroll:true})}else gb.textContent=`Read the explanation… ${t}`},LOCK>1?1000:150)}
function cont(){
  if(B.over)return;const g=$('#go');if(g)g.disabled=true;
  if(B.hp<=0){B.over=true;return victory()}
  const m=S.team[S.act];
  if(m.hp<=0){const nx=S.party.find(j=>S.team[j].hp>0);
    if(nx==null){S.ko++;S.party.forEach(j=>{S.team[j].hp=maxHP(S.team[j])});S.act=S.party[0];B.hp=B.max;B.assisted=false;drawPlayer();anim('.espr','lunge-l');
      say(`💫 Your whole party fainted! Prof. Proton heals your team, but ${B.c.name} is back to full HP and the battle starts over. Read the explanations — guessing won't get you through.`)}
    else{S.act=nx;drawPlayer();say(`Go, ${CR[S.team[nx].id].name}!`)}}
  save();nextQ();
}
function victory(){
  sfx.win();anim('.espr','faint');const nd=B.nd,z=nd.z;S.prog=B.i+1;
  if(nd.t==='final'){S.done=true;S.fin=Date.now();save();setTimeout(endGame,700);return}
  let join='';
  if(!S.team.some(t=>t.id===nd.c)){const nm={id:nd.c,lvl:z+2,xp:0,hp:0};nm.hp=maxHP(nm);S.team.push(nm);const inP=S.party.length<3;if(inP)S.party.push(S.team.length-1);
    join=`<div class="join">${img(nd.c,'',true)}<p><b>${CR[nd.c].name} (${CR[nd.c].sym})</b> ${inP?'joined your battle party':'joined your collection — swap it into your party on the map'} at Lv ${nm.lvl}!</p></div>`}
  let heal;
  if(nd.t==='boss'){S.team.forEach(t=>t.hp=maxHP(t));S.hints++;heal=`Zone cleared! Everyone is fully healed and you found a 🧪 Hint (now ${S.hints}).`}
  else{S.team.forEach(t=>t.hp=Math.min(maxHP(t),t.hp+Math.ceil(maxHP(t)/2)));heal='Your team rests and recovers half their HP.'}
  save();
  setTimeout(()=>modal(`<h2>${CR[nd.c].name} was defeated!</h2>${join}<p>${heal}</p><div class="row"><button class="btn" data-close>Back to the map</button></div>`,map),650);
}

/* ============ grade ============ */
const PASS=50;
const gradeOf=st=>st.total?Math.round(st.pts/st.total*100):0;
const rankOf=g=>g>=90?'Grand Alchemist':g>=80?'Element Master':g>=70?'Bond Builder':g>=60?'Ion Apprentice':'Atom Cadet';
function h32(str,seed){let h=seed>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h>>>0}
function checkCode(name,grade,correct,total,best){const k=['eq',String(name).trim().toLowerCase().replace(/\s+/g,' '),grade,correct,total,best,'nd-1206'].join('|');
  const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let n=(h32(k,2166136261)^h32(k.split('').reverse().join(''),374761393))>>>0,o='';for(let i=0;i<6;i++){o+=A[n%A.length];n=Math.floor(n/A.length)+h32(o+k,i+7)%97}return o}
const fmtDate=t=>{const d=new Date(t);return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})+', '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})};
function teacherCheck(){
  const m=modal(`<h2>Teacher: verify a result</h2><p class="muted">Copy these from the student's screenshot. If anything on the screen was edited, the code won't match.</p>
   <div class="field"><label for="tn">Name (as shown)</label><input id="tn"></div>
   <div class="row"><div class="field" style="flex:1"><label for="tg">Grade %</label><input id="tg" inputmode="numeric"></div><div class="field" style="flex:1"><label for="tc">Correct</label><input id="tc" inputmode="numeric"></div><div class="field" style="flex:1"><label for="tt">Questions</label><input id="tt" inputmode="numeric"></div></div>
   <div class="row"><div class="field" style="flex:1"><label for="tb">Best streak</label><input id="tb" inputmode="numeric"></div><div class="field" style="flex:1"><label for="tk">Check code</label><input id="tk" style="text-transform:uppercase"></div></div>
   <p id="tr" style="min-height:30px"></p>
   <div class="row"><button class="btn" id="tv">Check</button><button class="btn ghost" data-close>Close</button></div>`);
  m.v.querySelector('#tv').onclick=()=>{const g=id=>m.v.querySelector(id).value.trim();
    const ok=checkCode(g('#tn'),+g('#tg'),+g('#tc'),+g('#tt'),+g('#tb'))===g('#tk').toUpperCase();
    const gg=+g('#tg');m.v.querySelector('#tr').innerHTML=ok?`<b style="color:var(--mint)">✓ Valid — these numbers match the code.</b><br>${gg>=PASS?`Grade ${gg}% → QUEST COMPLETE badge earned.`:`Grade ${gg}% → finished, but below ${PASS}% (no QUEST COMPLETE badge).`}`:'<b style="color:var(--coral)">✗ Doesn’t match. Check for typos; otherwise the screenshot may have been edited.</b>'};
}

/* ============ end ============ */
function report(){
  const acc=S.total?Math.round(S.correct/S.total*100):0,mins=Math.max(1,Math.round((Date.now()-S.t0)/60000));

   <p>Now in: <b>${ZONES[NODES[Math.min(S.prog,NODES.length-1)].z].name}</b> · Zones cleared: <b>${cleared} of 4</b> · Battles won: <b>${S.prog} of ${NODES.length}</b></p>
   <div class="big3"><div>Grade so far<div class="v">${gradeOf(S)}%</div></div><div>Correct<div class="v">${S.correct}/${S.total}</div></div><div>Hints used<div class="v">${S.hu}</div></div><div>Play time<div class="v">${mins}m</div></div></div>
   <table class="t"><tr><th>Topic</th><th>Correct</th><th>Accuracy</th></tr>${S.stats.map((x,i)=>`<tr><td>${TOPICS[i]}</td><td>${x.c}/${x.t}</td><td>${x.t?Math.round(x.c/x.t*100)+'%':'—'}</td></tr>`).join('')}</table>

   <div class="big3"><div>Correct<div class="v">${S.correct}/${S.total}</div></div><div>Hints used<div class="v">${S.hu}</div></div><div>Best streak<div class="v">${S.best}</div></div><div>Score<div class="v">${S.score}</div></div></div>
   <table class="t"><tr><th>Topic</th><th>Correct</th><th>Accuracy</th></tr>${S.stats.map((s,i)=>`<tr><td>${TOPICS[i]}</td><td>${s.c}/${s.t}</td><td>${s.t?Math.round(s.c/s.t*100):0}%</td></tr>`).join('')}</table>
   <p class="muted" style="margin:6px 0">Raw accuracy ${acc}% · Play time ${mins} min · Team wipe-outs ${S.ko}</p>

  $('#again').onclick=()=>{const m=modal(`<h2>Start over?</h2><p>This clears your score screen. Make sure you've taken your screenshot first.</p><div class="row"><button class="btn" id="yes">Yes, start over</button><button class="btn ghost" data-close>Cancel</button></div>`);

/* ============ duel: 2 players, one screen, no grade ============ */
// Turns alternate. Right answer: your creature attacks. Wrong: the other player may steal the same question.
// The duel ends only at the end of a round, so both players always get the same number of turns.
const DPICK=Object.keys(CR).filter(id=>id!=='prof');
const DLEN=[['Quick',40],['Standard',60],['Long',100]];
const DMG=10,CRIT=15,STEAL=5;
function duelSetup(cfg){
  S=null;B=null;D=null;
  cfg=cfg||{p:[{name:'',id:'natrix'},{name:'',id:'oxyfin'}],topics:[0,1,2,3],len:1};
  const pick=k=>`<div><div class="field"><label for="dn${k}">Player ${k+1} (or team) name</label><input id="dn${k}" maxlength="20" autocomplete="off" placeholder="Player ${k+1}" value="${esc(cfg.p[k].name)}"></div>
   <div class="dgrid">${DPICK.map(id=>`<button class="dc${id===cfg.p[k].id?' on':''}" data-dc="${k}" data-id="${id}" aria-pressed="${id===cfg.p[k].id}" aria-label="${CR[id].name} for player ${k+1}" title="${CR[id].name} (${CR[id].sym})">${img(id,'',k===0)}</button>`).join('')}</div>
   <div class="dcn" id="dcn${k}">${CR[cfg.p[k].id].name} (${CR[cfg.p[k].id].sym})</div></div>`;
  view(`<div class="title"><div class="logo" style="font-size:clamp(22px,5vw,38px)">DUEL MODE</div>
   <p class="tag">Two players (or two teams) take turns. A right answer makes your creature attack.<br>Miss, and your opponent can <b>steal</b> the question for a smaller hit.</p></div>
   <div class="box"><div class="duo">${pick(0)}${pick(1)}</div>
   <h3>Topics</h3><div class="row">${TOPICS.map((t,i)=>`<button class="btn${cfg.topics.includes(i)?'':' ghost'}" data-tp="${i}" aria-pressed="${cfg.topics.includes(i)}" style="font-size:9px">${t}</button>`).join('')}</div>
   <h3>Length</h3><div class="row">${DLEN.map(([n,hp],i)=>`<button class="btn${i===cfg.len?'':' ghost'}" data-len="${i}" aria-pressed="${i===cfg.len}" style="font-size:9px">${n} (${hp} HP)</button>`).join('')}</div>
   <p class="muted" style="margin:12px 0 4px">Right answer: ${DMG} damage (${CRIT} after 3 in a row). Steal: ${STEAL} damage. Nothing here is graded or saved.</p>
   <div class="err" id="err"></div>
   <div class="row" style="justify-content:center"><button class="btn ghost" id="dback">◀ Back</button><button class="btn" id="go">⚔ Start duel</button></div></div>`);
  app.querySelectorAll('[data-dc]').forEach(b=>b.onclick=()=>{const k=+b.dataset.dc;cfg.p[k].id=b.dataset.id;sfx.blip();
    app.querySelectorAll(`[data-dc="${k}"]`).forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b)});$('#dcn'+k).textContent=`${CR[b.dataset.id].name} (${CR[b.dataset.id].sym})`});
  app.querySelectorAll('[data-tp]').forEach(b=>b.onclick=()=>{const i=+b.dataset.tp,T=cfg.topics;T.includes(i)?T.splice(T.indexOf(i),1):T.push(i);
    b.classList.toggle('ghost',!T.includes(i));b.setAttribute('aria-pressed',T.includes(i));sfx.blip()});
  app.querySelectorAll('[data-len]').forEach(b=>b.onclick=()=>{cfg.len=+b.dataset.len;app.querySelectorAll('[data-len]').forEach(x=>{x.classList.toggle('ghost',x!==b);x.setAttribute('aria-pressed',x===b)});sfx.blip()});
  $('#dback').onclick=title;
  $('#go').onclick=()=>{if(!cfg.topics.length){$('#err').textContent='Pick at least one topic.';return}
    [0,1].forEach(k=>cfg.p[k].name=$('#dn'+k).value.trim());cfg.topics.sort();duelStart(cfg)};
}
function duelStart(cfg){
  const hp=DLEN[cfg.len][1],first=Math.random()<.5?0:1;
  D={cfg,first,turn:first,round:1,phase:'',q:null,used:[],mute:D?D.mute:false,
    pool:[...new Set(cfg.topics.flatMap(z=>POOLS[z].flat()))],
    p:cfg.p.map((x,k)=>({name:x.name||`Player ${k+1}`,id:x.id,hp,max:hp,c:0,t:0,sw:0,st:0,streak:0,best:0}))};
  duelArena();say(`${esc(D.p[first].name)} goes first (picked at random). ${duelPrompt()}`);
}
function duelArena(){
  const cfg=D.cfg,Z=ZONES[cfg.topics.length===1?cfg.topics[0]:4],P=D.p;
  const hud=k=>`<div class="${k?'ehud':'phud'} box" id="dh${k}"><div class="hn"><span>${esc(P[k].name)}</span><span class="sym" id="dv${k}"></span></div><div class="hp" id="dhp${k}"><i></i></div><div class="muted" style="font-size:18px;margin-top:2px">${CR[P[k].id].name}</div></div>`;
  view(`<div class="hud"><div class="stat">⚔ DUEL · Round <span id="drd">1</span></div><div class="row"><button class="btn ghost" id="dquit">Quit</button><button class="btn ghost" id="mute" aria-label="Toggle sound">${D.mute?'🔇':'🔊'}</button></div></div>
   <div class="arena" style="background:${Z.bg}"><div class="ground" style="background-color:${Z.gr}"></div>
   ${hud(1)}${img(P[1].id,'espr',false)}${img(P[0].id,'pspr',true)}${hud(0)}</div>
   <div class="box msg" id="msg" aria-live="polite"></div>
   <div class="box qbox" id="qb"></div>
   <div class="tools"><button class="btn ghost" id="bnotes">📖 Notes</button><span class="muted">Keys 1–4 answer for whoever's turn it is.</span></div>`);
  $('#mute').onclick=()=>{D.mute=!D.mute;$('#mute').textContent=D.mute?'🔇':'🔊'};
  $('#bnotes').onclick=()=>notes(cfg.topics[0]);
  $('#dquit').onclick=()=>{const m=modal(`<h2>Quit the duel?</h2><p>This duel isn't saved.</p><div class="row"><button class="btn" id="yes">Yes, quit</button><button class="btn ghost" data-close>Keep playing</button></div>`);
    m.v.querySelector('#yes').onclick=()=>{m.close();D=null;title()}};
  dNext();
}
function suddenDeath(){
  D.p.forEach(p=>p.hp=1);D.turn=D.first;D.round++;duelArena();
  say(`⚡ SUDDEN DEATH! Both creatures are back with 1 HP. Any hit knocks out, and both players still get one turn per round. ${duelPrompt()}`);
}
function duelPrompt(){return `<b>${esc(D.p[D.turn].name)}</b>, answer to make ${CR[D.p[D.turn].id].name} attack!`}
function dUpd(){
  const who=D.phase==='steal'?1-D.turn:D.turn;
  D.p.forEach((p,k)=>{setBar($('#dhp'+k),p.hp,p.max);$('#dv'+k).textContent=`${p.hp}/${p.max}`;$('#dh'+k).classList.toggle('turn',D.phase!=='done'&&k===who)});
  $('#drd').textContent=D.round;
}
function dPick(){
  let q,g;for(let k=0;k<25;k++){g=R(D.pool);q=g();if(!D.used.includes(q.key))break}
  D.used.push(q.key);if(D.used.length>300)D.used=D.used.slice(-200);q.topic=TOPIC.get(g);return q;
}
function dNext(){
  D.q=dPick();D.phase='ask';const q=D.q;
  $('#qb').innerHTML=`<div class="dturn" id="dturn">▶ ${esc(D.p[D.turn].name)}: your turn</div><p class="prompt">${q.prompt}</p>${q.visual?`<div class="visual">${q.visual}</div>`:''}<div class="opts${/<svg/.test(q.options[0])?' pics':''}">${q.options.map((o,i)=>`<button class="opt" data-o="${i}"><span class="k">${i+1}</span><span>${o}</span></button>`).join('')}</div><div id="fb"></div>`;
  app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>dAnswer(+b.dataset.o));
  dUpd();
}
function dHit(k,d,crit){
  const t=D.p[1-k];t.hp=Math.max(0,t.hp-d);
  anim(k?'.espr':'.pspr',k?'lunge-l':'lunge-r');setTimeout(()=>{anim(k?'.pspr':'.espr','hurt');floatDmg(k?'p':'e',d,crit);sfx.hit();dUpd()},300);
}
function dAnswer(k){
  if(D.phase!=='ask'&&D.phase!=='steal')return;
  const q=D.q,ok=k===q.ans,b=app.querySelector(`[data-o="${k}"]`);
  if(D.phase==='ask'){const a=D.p[D.turn],o=D.p[1-D.turn];a.t++;
    if(ok){a.c++;a.streak++;a.best=Math.max(a.best,a.streak);const crit=a.streak>=3,d=crit?CRIT:DMG;sfx.good();dHit(D.turn,d,crit);
      say(crit?`🔥 ${a.streak} in a row! ${CR[a.id].name} lands a critical hit for ${d}!`:`${CR[a.id].name} attacks for ${d} damage!`);return dReveal(true)}
    a.streak=0;sfx.bad();b.classList.add('wrong');b.disabled=true;
    if(q.options.length<3){say(`✗ Not quite, ${esc(a.name)}.`);return dReveal(false)}
    D.phase='steal';const t=$('#dturn');t.textContent=`▶ ${o.name}: STEAL!`;t.classList.add('steal');
    say(`✗ Not quite! <b>${esc(o.name)}</b>, steal it: pick the right answer for a ${STEAL}-damage hit.`);dUpd();return}
  const s=D.p[1-D.turn];s.st++;
  if(ok){s.sw++;sfx.good();dHit(1-D.turn,STEAL,false);say(`${esc(s.name)} steals it! ${CR[s.id].name} hits for ${STEAL}.`);return dReveal(false,true)}
  else{sfx.bad();say('No steal: neither player got that one.')}
  dReveal(false);
}
function dReveal(firstOk,stole){
  D.phase='done';const q=D.q,last=D.turn!==D.first,over=last&&D.p.some(p=>p.hp<=0),nx=D.p[1-D.turn];
  app.querySelectorAll('[data-o]').forEach(b=>{b.disabled=true;if(+b.dataset.o===q.ans)b.classList.add('right')});
  $('#fb').innerHTML=`<div class="fb"><div class="head ${firstOk||stole?'ok':'no'}">${firstOk?'✓ Correct!':(stole?'✓ Stolen! The answer is: ':'✗ The answer is: ')+q.options[q.ans]}</div><div class="why">${q.why}</div><button class="btn" id="go">${over?'See who won':`Next turn: ${esc(nx.name)}`}</button></div>`;
  $('#go').onclick=dCont;
  if(!firstOk)readLock($('#go'));
  setTimeout(()=>{const g=$('#go');if(g){if(!g.disabled)g.focus({preventScroll:true});g.scrollIntoView({block:'nearest',behavior:'smooth'})}},50);dUpd();
}
function dCont(){
  if(D.phase!=='done')return;const g=$('#go');if(g)g.disabled=true;
  if(D.turn!==D.first&&D.p.some(p=>p.hp<=0))return dEnd();
  D.turn=1-D.turn;if(D.turn===D.first)D.round++;
  dNext();const a=D.p[D.turn],o=D.p[1-D.turn],lastT=D.turn!==D.first;
  say(lastT&&a.hp<=0&&o.hp>0?`${CR[a.id].name} is down, but rounds are fair: <b>${esc(a.name)}</b> gets one last turn. Knock out ${CR[o.id].name} to force a draw!`
    :lastT&&o.hp<=0&&a.hp>0?`${CR[o.id].name} is down! Last turn of the round: <b>${esc(a.name)}</b>, answer right to win. Miss, and ${esc(o.name)} can steal back to try for a draw.`
    :duelPrompt());
}
function dEnd(){
  D.phase='over';const P=D.p,w=P[0].hp<=0&&P[1].hp<=0?-1:P[0].hp<=0?1:0;
  sfx.win();if(w>=0)anim(w?'.pspr':'.espr','faint');else{anim('.pspr','faint');anim('.espr','faint')}
  const row=(l,f)=>`<tr><td>${l}</td>${P.map(p=>`<td>${f(p)}</td>`).join('')}</tr>`;
  setTimeout(()=>{view(`<div class="box cert">
   <div class="logo" style="font-size:clamp(20px,5vw,34px);margin:6px 0">${w<0?'IT’S A DRAW!':esc(P[w].name)+' WINS!'}</div>
   <p class="muted" style="margin:0">${w<0?'Both creatures went down in the same round.':`${CR[P[w].id].name} is still standing after ${D.round} round${D.round>1?'s':''}.`}</p>
   <div class="endteam">${P.map((p,k)=>`<div>${img(p.id,'',k===0)}${esc(p.name)}<br>${CR[p.id].name}</div>`).join('')}</div>
   <table class="t"><tr><th></th>${P.map(p=>`<th>${esc(p.name)}</th>`).join('')}</tr>
   ${row('Own questions right',p=>`${p.c}/${p.t}`)}${row('Steals',p=>`${p.sw}/${p.st}`)}${row('Best streak',p=>p.best)}${row('HP left',p=>`${p.hp}/${p.max}`)}</table>
   <div class="row" style="justify-content:center;margin-top:14px">${w<0?'<button class="btn" id="dsd">⚡ Sudden death</button>':''}<button class="btn${w<0?' alt':''}" id="go">⚔ Rematch</button><button class="btn alt" id="dset">Change players</button><button class="btn ghost" id="dt">Title screen</button></div></div>`);
   if(w<0)$('#dsd').onclick=suddenDeath;
   $('#go').onclick=()=>duelStart(D.cfg);$('#dset').onclick=()=>duelSetup(D.cfg);$('#dt').onclick=()=>{D=null;title()};app.querySelector('.cert .btn').focus()},700);
}

/* ============ keyboard ============ */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'){if(e.key==='Enter'){const g=$('#go');g&&g.click()}return}
  if(document.querySelector('.veil'))return;
  if(((B&&!B.answered)||(D&&(D.phase==='ask'||D.phase==='steal')))&&/^[1-4]$/.test(e.key)){const b=app.querySelector(`[data-o="${+e.key-1}"]`);if(b&&!b.disabled){e.preventDefault();b.click()}}
});

if(location.hash==='#qa')window.__EQ={get S(){return S},get B(){return B},get D(){return D},ALLG,POOLS,checkCode,gradeOf};
const sv=load();if(sv&&sv.done){S=sv;endGame()}else title();
})();
</script>
</body>
</html>
